server.port=8080


# VS Code \ub85c\uceec \uac1c\ubc1c\uc6a9: src\uc758 Thymeleaf HTML\uc744 \uc9c1\uc811 \uc77d\uc74c
spring.thymeleaf.prefix=file:./src/main/resources/templates/thymeleaf/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true


# \uc218\ub3d9 Bean\uc774 \uc790\ub3d9 Bean\uc744 \uc624\ubc84\ub77c\uc774\ub529\ud558\ub3c4\ub85d \uc124\uc815
spring.main.allow-bean-definition-overriding=true

# open-in-view(\ud639\uc740 Open-Session-In-View(OSIV))
# true(\uae30\ubcf8\uac12) : \uc0ac\uc6a9\uc790\uc5d0\uac8c \uc751\ub2f5 \ub610\ub294 view\uac00 \ub80c\ub354\ub9c1\ub420 \ub54c\uae4c\uc9c0 \uc601\uc18d\uc131 \ucee8\ud14d\uc2a4\ud2b8 \uc720\uc9c0
# false : \ud2b8\ub79c\uc7ad\uc158\uc774 \uc885\ub8cc\ub420 \ub54c \uc601\uc18d\uc131 \ucee8\ud14d\uc2a4\ud2b8 \uc885\ub8cc
spring.jpa.open-in-view=false


# DB\uc11c\ubc84 \ud0c0\uc785(hsql,mysql,oracle,altibase,tibero) - datasource \ubc0f sqlMap \ud30c\uc77c \uc9c0\uc815\uc5d0 \uc0ac\uc6a9\ub428
Globals.DbType=hsql_server

# hsql(\ub0b4\uc7a5, \ub514\ube44 \uc811\uc18d X)\uacfc hsql_server\ub294 \ub2e4\ub978 \ub514\ube44\uc5d0 \uc811\uc18d \uac00\ub2a5
#Globals.hsql_server.DriverClassName=net.sf.log4jdbc.DriverSpy
Globals.hsql_server.DriverClassName=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
Globals.hsql_server.Url=jdbc:log4jdbc:hsqldb:hsql://127.0.0.1:9001/ArkiveDB
Globals.hsql_server.UserName=sa
Globals.hsql_server.Password=

# never: Spring Boot SQL initialization is disabled; EgovConfigDatasource applies versioned migrations.
spring.sql.init.mode=never

# HSQLDB \ud30c\uc77c DB\ub97c \uc0ac\uc6a9\ud558\uc5ec \ud504\ub85c\uc81d\ud2b8 \uc7ac\uc2dc\uc791 \ud6c4\uc5d0\ub3c4 \ub370\uc774\ud130\ub97c \uc720\uc9c0\ud569\ub2c8\ub2e4.
Globals.hsql_server.DatabasePath=./data/ArkiveDB
# HSQLDB \uc11c\ubc84 \ud3ec\ud2b8. Globals.hsql_server.Url\uc758 \ud3ec\ud2b8\uc640 \ubc18\ub4dc\uc2dc \uac19\uc544\uc57c \ud569\ub2c8\ub2e4.
# \ud14c\uc2a4\ud2b8\ub294 application-test.properties\uc5d0\uc11c 9002\ub85c \ubd84\ub9ac\ud574 \uc571 \uc2e4\ud589 \uc911\uc5d0\ub3c4 \ub3cc \uc218 \uc788\uc2b5\ub2c8\ub2e4.
Globals.hsql_server.Port=9001

# Quartz DBJob dump path. HSQLDB SCRIPT dump every 10 min. Parent dirs are created.
Globals.dumpPath=./backup/ArkiveDB.sql

# JWT (API). Set JWT_SECRET in production. If empty, a random key is generated at startup.
Globals.jwt.secret=${JWT_SECRET:}
Globals.jwt.expireSeconds=3600

# Mail. Disabled by default. Set MAIL_ENABLED=true and the SMTP values for the target environment.
# Never commit real SMTP credentials. MAIL_FROM is required when mail is enabled.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
arkive.mail.enabled=${MAIL_ENABLED:false}
arkive.mail.from=${MAIL_FROM:}
arkive.mail.base-url=${MAIL_BASE_URL:http://localhost:8080}
# 메일 발송을 끈 상태에서 SMTP 헬스 체크가 전체 health를 DOWN으로 만들지 않게 한다.
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# 감사 로그 보관. 0이면 자동 삭제하지 않는다. 실제 기간은 개인정보 처리방침 검토 후 설정한다.
arkive.audit.retention-days=0
arkive.audit.retention-cron=0 0 4 * * *

# Social login. Issue client keys and callback URLs from each provider console, per environment.
# With no keys (empty values), the login buttons are hidden.
Globals.naver.clientId=
Globals.naver.clientSecret=
Globals.naver.callbackUrl=http://localhost:8080/login/oauth/naverCallback
Globals.kakao.clientId=
Globals.kakao.clientSecret=
Globals.kakao.callbackUrl=http://localhost:8080/login/oauth/kakaoCallback
Globals.google.clientId=
Globals.google.clientSecret=
Globals.google.callbackUrl=http://localhost:8080/login/oauth/googleCallback

# NICE identity verification (CheckPlus). Site code and password come from the NICE contract, per environment.
# With no keys (empty values), verification start is blocked. Replace test keys with NICE test codes.
Globals.nice.siteCode=
Globals.nice.sitePassword=
Globals.nice.returnUrl=http://localhost:8080/login/nice/callback
Globals.nice.errorUrl=http://localhost:8080/login/nice/callback

# Legacy NiceCheck key alias. Keep it identical to the Globals value above.
NiceSiteCode=
NiceSitePassword=

# \ub85c\uadf8\uc778 \uc778\uc99d \uc81c\ud55c(login authentication limit)
# (\uc0ac\uc6a9 \uc5ec\ubd80 \uc124\uc815\uac12 : true, false)
Globals.login.Lock = true
# - \uc778\uc99d \uc7ac\uc2dc\ub3c4 \ud69f\uc218
Globals.login.LockCount = 5

# EncryptionUtil \ubcc0\uc218
Globals.PUBLIC_KEY 		= __blmsPublickey__
Globals.RSA_WEB_KEY 	= __rsaBlmsPrivateKey__
Globals.RSA_INSTANCE 	= RSA_BLMS

# \ud30c\uc77c \uc5c5\ub85c\ub4dc \uacbd\ub85c(\uacbd\ub85c \uc124\uc815\uc740 \ubc18\ub4dc\uc2dc \uc808\ub300\uacbd\ub85c\ub97c \uc0ac\uc6a9\ud574\uc57c\ud568, \uacbd\ub85c \ub4a4\uc5d0 /\ub97c \ubd99\uc5ec\uc918\uc57c \ud568.)
Globals.FILE_TEMP_PATH 	=  C:/upload/arkive/temp/
Globals.FILE_REAL_PATH 	=  C:/upload/arkive/
Globals.SHOW_TEMP_PATH 	=  C:/upload/arkive/temp/
Globals.SHOW_REAL_PATH 	=  C:/upload/arkive/

# \uba40\ud2f0\ud30c\ud2b8 \ud30c\uc77c \uc5c5\ub85c\ub4dc \uc124\uc815
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
Globals.MaxFilesNum=20
# \uD30C\uC77C 1\uAC1C\uB2F9 \uCD5C\uB300 \uC6A9\uB7C9(MB). \uBA40\uD2F0\uD30C\uD2B8\u00B7\uB4DC\uB86D\uC874 \uC548\uB0B4\uC640 \uD074\uB77C\uC774\uC5B8\uD2B8 \uAC80\uC0AC \uAE30\uC900\uAC12\uC774\uB2E4.
Globals.fileUpload.maxFileSize.mb = 50
# TUS 1\uD68C \uCD5C\uB300 \uC6A9\uB7C9(MB). TUS \uC548\uB0B4\uBB38\uACFC Tus-Max-Size \uD5E4\uB354 \uAE30\uC900\uAC12\uC774\uB2E4.
Globals.tus.maxFileSize.mb = 50
# \uc784\uc2dc\ud30c\uc77c \ubcf4\uad00 \uc2dc\uac04(\uc2dc\uac04). \uc9c0\ub09c \ud30c\uc77c\uc740 TempFileCleanupJob\uc774 \uc0ad\uc81c\ud55c\ub2e4.
Globals.TempFileExpireHours=24

# \uc378\ub124\uc77c \ud504\ub85c\uadf8\ub7a8(FFMPEG) \uacbd\ub85c
Globals.FFMPEG_PATH = /usr/bin

# \uac15\uc758 \ub3d9\uc601\uc0c1 \uc778\ucf54\ub529. \uae30\ubcf8 \ube44\ud65c\uc131\uc774\uba70, FFmpeg\uac00 \uc124\uce58\ub41c \ud658\uacbd\uc5d0\uc11c\ub9cc \ucf1c\uc11c \uc0ac\uc6a9\ud55c\ub2e4.
# \uc778\ucf54\ub529 \uc2e4\ud589 \uc804 VOD \uacbd\ub85c\uc640 \uc6d0\ubcf8 \ubcf4\uc874 \uc815\ucc45\uc744 \ud655\uc778\ud55c\ub2e4.
arkive.ffmpeg.enabled=${FFMPEG_ENABLED:false}
arkive.ffmpeg.path=${FFMPEG_PATH:/usr/bin}
arkive.vod.path=${VOD_PATH:./data/vod/}

# SSO \uc5f0\uacc4. \uae30\ubcf8 \ube44\ud65c\uc131. \uc678\ubd80 SSO \uc11c\ubc84 \uacc4\uc57d\uac12\uc740 \ud658\uacbd\ubcc4\ub85c \uc8fc\uc785\ud55c\ub2e4.
arkive.sso.enabled=${SSO_ENABLED:false}
arkive.sso.authorize-url=${SSO_AUTHORIZE_URL:}
arkive.sso.token-url=${SSO_TOKEN_URL:}
arkive.sso.user-info-url=${SSO_USER_INFO_URL:}
arkive.sso.client-id=${SSO_CLIENT_ID:}
arkive.sso.client-secret=${SSO_CLIENT_SECRET:}
arkive.sso.callback-url=${SSO_CALLBACK_URL:http://localhost:8080/sso/callback}
# \uc678\ubd80 SSO \uc0ac\uc6a9\uc790 \uc815\ubcf4(JSON) \ud544\ub4dc\uba85. \uc2e4\uc81c \uacc4\uc57d\uc5d0 \ub9de\ucd94\uc5b4 \uad50\uccb4\ud55c\ub2e4.
arkive.sso.scope=${SSO_SCOPE:}
arkive.sso.user-id-field=${SSO_USER_ID_FIELD:sub}
arkive.sso.user-name-field=${SSO_USER_NAME_FIELD:name}
arkive.sso.user-email-field=${SSO_USER_EMAIL_FIELD:email}
# \uc5f0\uacc4 \uacc4\uc815\uc774 \uc5c6\uc744 \ub54c \uc790\ub3d9 \uac00\uc785\ud560\uc9c0 \uc5ec\ubd80. \uae30\ubcf8\uc740 \uc544\ub2c8\uc624(\uc6b4\uc601 \uc815\ucc45 \ud655\uc778 \ud6c4 \ucf1c\uc57c \ud568).
arkive.sso.auto-create=${SSO_AUTO_CREATE:false}
arkive.sso.user-prefix=${SSO_USER_PREFIX:sso_}

# WebSocket \ucc44\ud305. \ud5c8\uc6a9 Origin\uc744 \uc27c\ud45c\ub85c \ub098\uc5f4\ud55c\ub2e4(\ube44\uc6b0\uba74 \uac19\uc740 Origin\ub9cc).
arkive.chat.allowed-origins=${CHAT_ALLOWED_ORIGINS:}

# Batch Job\uc740 \uc571 \uc2dc\uc791 \uc2dc \uc790\ub3d9 \uc2e4\ud589\ud558\uc9c0 \uc54a\ub294\ub2e4. \ud654\uba74\uc5d0\uc11c \uc218\ub3d9 \uc2e4\ud589\ud55c\ub2e4.
# ResourcelessJobRepository\ub97c \uc4f0\ubbc0\ub85c BATCH_* \uba54\ud0c0\ub370\uc774\ud130 \ud14c\uc774\ube14\uc740 \uc0dd\uc131\ud558\uc9c0 \uc54a\ub294\ub2e4.
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never

# \uce74\uce74\uc624 \uc57d\ub3c4. \ud0a4\uac00 \uc5c6\uc73c\uba74 \uc9c0\ub3c4 \uc2a4\ud06c\ub9bd\ud2b8\ub97c \ub85c\ub4dc\ud558\uc9c0 \uc54a\uace0 \uc8fc\uc18c\u00b7\uc88c\ud45c\ub9cc \ud45c\uc2dc\ud55c\ub2e4.
Globals.kakao.mapKey=${KAKAO_MAP_KEY:}


# \ud30c\uc77c \ud655\uc7a5\uc790 \ud654\uc774\ud2b8\ub9ac\uc2a4\ud2b8. \ud655\uc7a5\uc790\ub97c (.)\uacfc \ud568\uaed8 \uc774\uc5b4\uc11c \uc0ac\uc6a9\ud558\uba70 (.)\ub85c \uc2dc\uc791\ud55c\ub2e4.
# \uc774\ubbf8\uc9c0 \uc5c5\ub85c\ub4dc\uc6a9 \ud5c8\uc6a9 \ud655\uc7a5\uc790 (\ud604\uc7ac \ucf54\ub4dc\uc5d0\uc11c \uc77d\uc9c0 \uc54a\uc74c).
Globals.fileUpload.Extensions.Images = .gif.jpg.jpeg.png
# \uc804\uccb4 \uc5c5\ub85c\ub4dc \ud5c8\uc6a9 \ud655\uc7a5\uc790. temp \uc800\uc7a5\u00b7\ud655\uc815 \ub2e8\uacc4\uc5d0\uc11c \uac80\uc0ac\ud558\uba70 \ubaa9\ub85d\uc5d0 \uc5c6\uc73c\uba74 \uc5c5\ub85c\ub4dc\ub97c \uac70\ubd80\ud55c\ub2e4.
Globals.fileUpload.Extensions = .gif.jpg.jpeg.png.pdf.doc.docx.xls.xlsx.ppt.pptx.zip.hwp.hwpx.txt
# \ub2e4\uc6b4\ub85c\ub4dc \ubbf8\ub9ac\ubcf4\uae30(inline \ud45c\uc2dc) \ub300\uc0c1 \ud655\uc7a5\uc790. \ubaa9\ub85d\uc5d0 \uc5c6\uc73c\uba74 \ucca8\ubd80 \ub2e4\uc6b4\ub85c\ub4dc\ud55c\ub2e4.
Globals.fileDownload.Extensions = .gif.jpg.jpeg.png.pdf

# 기존 CommUtil AES 호환 키. 실제 운영 키는 환경변수로 주입한다.
private.key = ${LEGACY_CRYPTO_KEY:}
private.iv = ${LEGACY_CRYPTO_IV:}

#SMS API KEY
SMS.APIKEY = ${ALIGO_API_KEY:}
SMS.ID = ${ALIGO_ID:}
SMS.URL = https://sipapis.aligo.in
# \uc6b4\uc601
#SMS.TEL = 0414177715
# \uac1c\ubc1c
SMS.TEL = ${ALIGO_SENDER:}

# 이전 개발용 SMS 키는 폐기했다. 새 키는 ALIGO_* 환경변수로만 주입한다.
# NICE 본인확인 키. 실제 값은 NICE_* 환경변수로 주입한다.
#nice.clientID = ${NICE_CLIENT_ID:}
#nice.secretKey = ${NICE_SECRET_KEY:}
#nice.accessToken = ${NICE_ACCESS_TOKEN:}



# \ud504\ub860\ud2b8\uc5d4\ub4dc \ubc31\uc5d4\ub4dc\uac00 \uc788\uc744\uc2dc Origin(url)\uc5d0\uc11c \uc624\ub294 \uc694\uccad\uc740 \ud5c8\uc6a9 \ud558\uae30\uc704\ud574 \ud544\uc694
# Access-Control-Allow-Origin
Globals.Allow.Origin = http://localhost:3000

# \uc554\ud638\ud654\uc11c\ube44\uc2a4 \uc54c\uace0\ub9ac\uc998 \ud0a4
# \uc8fc\uc758 : \ubc18\ub4dc\uc2dc \uae30\ubcf8\uac12 "egovframe"\uc744 \ub2e4\ub978\uac83\uc73c\ub85c \ubcc0\uacbd\ud558\uc5ec \uc0ac\uc6a9\ud558\uc2dc\uae30 \ubc14\ub78d\ub2c8\ub2e4.
Globals.crypto.algoritm = egovframe

# DB 필드 암호화 키. 운영에서는 ARKIVE_FIELD_KEY 환경변수로 주입하고 저장소에 실제 키를 커밋하지 않는다.
# 값이 비어 있으면 TOTP와 개인정보 필드 암호화 기능이 비활성화된다.
arkive.crypto.field-key=${ARKIVE_FIELD_KEY:}
# TOTP 인증 앱에 표시할 발급자 이름
arkive.totp.issuer=${ARKIVE_TOTP_ISSUER:Arkive}

# 외부 HTTP 호출 공통 설정. GET만 재시도하고 POST는 중복 부작용을 막기 위해 재시도하지 않는다.
arkive.http.connect-timeout-ms=${ARKIVE_HTTP_CONNECT_TIMEOUT_MS:3000}
arkive.http.read-timeout-ms=${ARKIVE_HTTP_READ_TIMEOUT_MS:5000}
arkive.http.get-max-attempts=${ARKIVE_HTTP_GET_MAX_ATTEMPTS:3}
arkive.http.retry-backoff-ms=${ARKIVE_HTTP_RETRY_BACKOFF_MS:200}

# SMS 알림. enabled=false 또는 자격증명·발신번호가 없으면 발송하지 않는다.
arkive.sms.enabled=${ARKIVE_SMS_ENABLED:false}
arkive.sms.title-prefix=${ARKIVE_SMS_TITLE_PREFIX:[Arkive] }
arkive.sms.aligo.url=${ALIGO_URL:https://sipapis.aligo.in}
arkive.sms.aligo.id=${ALIGO_ID:}
arkive.sms.aligo.api-key=${ALIGO_API_KEY:}
arkive.sms.aligo.sender=${ALIGO_SENDER:}
arkive.sms.aligo.test-mode=${ALIGO_TEST_MODE:false}

# GA4·Clarity. 기본은 꺼짐이며 ID와 동의 정책을 넣은 뒤에만 켠다.
# require-consent=true이면 사용자가 동의하기 전까지 외부 분석 스크립트를 요청하지 않는다.
arkive.analytics.enabled=${ARKIVE_ANALYTICS_ENABLED:false}
arkive.analytics.ga4-id=${ARKIVE_GA4_ID:}
arkive.analytics.clarity-id=${ARKIVE_CLARITY_ID:}
arkive.analytics.require-consent=${ARKIVE_ANALYTICS_REQUIRE_CONSENT:true}
arkive.analytics.consent-version=${ARKIVE_ANALYTICS_CONSENT_VERSION:1}

# 초성 검색 색인. DB LIKE가 기본이고, Elasticsearch는 별도 설정이 있을 때만 검토한다.
arkive.search.elasticsearch.enabled=${ARKIVE_SEARCH_ES_ENABLED:false}
arkive.search.elasticsearch.url=${ARKIVE_SEARCH_ES_URL:http://localhost:9200}
arkive.search.elasticsearch.index=${ARKIVE_SEARCH_ES_INDEX:arkive-board}
arkive.search.elasticsearch.username=${ARKIVE_SEARCH_ES_USERNAME:}
arkive.search.elasticsearch.password=${ARKIVE_SEARCH_ES_PASSWORD:}

# 내부 연동 API 서비스 토큰. 비어 있으면 /internal/** 를 503으로 닫는다.
arkive.api.internal-token=${ARKIVE_INTERNAL_API_TOKEN:}

#swaggerdoc
# actuator (operations monitoring. Exposes health/info/metrics. Restrict sensitive endpoints to the internal network.)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
springdoc.packages-to-scan=egovframework,arkive
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.groups.enabled=true
springdoc.cache.disabled=true

#Sns
Sns.naver.clientId=YOUR_CLIENT_ID
Sns.naver.clientSecret=YOUR_CLIENT_SECRET
Sns.naver.callbackUrl=http://localhost:3000/login/naver/callback
Sns.kakao.clientId=YOUR_CLIENT_ID
Sns.kakao.callbackUrl=http://localhost:3000/login/kakao/callback
