# DB는 PostgreSQL 단일 구성이다. 접속 값은 표준 Boot 키(spring.datasource.*)에서 직접 수정한다.
# - 기존 Globals.postgresql.* / Globals.Hikari.* 는 Boot DataSource 자동 구성으로 이전했다.
# - 접속 URL 예시(Supabase Session pooler, 5432):
#   jdbc:postgresql://aws-<n>-<region>.pooler.supabase.com:5432/postgres?sslmode=require
# - 직접 연결 호스트(db.<ref>.supabase.co)는 IPv6 전용이라 IPv4만 되는 네트워크에서는 접속되지 않는다.
# - sslmode=require 를 빼면 드라이버 기본값(prefer) 때문에 평문으로 폴백될 수 있다.
# - Transaction pooler(6543)는 prepared statement를 쓰는 MyBatis에 부적합하다.
# - log4jdbc 추적이 필요하면 driver-class-name을 net.sf.log4jdbc.sql.jdbcapi.DriverSpy로,
#   url을 jdbc:log4jdbc:postgresql://... 형태로 함께 변경한다.
# - 비밀번호가 들어 있는 이 파일은 공유·커밋하지 않는다. 배포/공유 전 비밀번호를 제거한다.
# - 접속에 실패하면 다른 DB로 자동 전환하지 않고 기동에 실패한다.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.xzjcvayeseiiohoebyvr
spring.datasource.password=Arkive!@#$%^&*()

# ---------------------------------------------------------------------------
# HikariCP 커넥션 풀. Boot DataSource 자동 구성이 spring.datasource.hikari.*로 바인딩한다.
# - 아래 값은 이식용 초기값이다. 대상 환경의 DB 연결 한도·pooler(Supavisor 등) 제한은
#   담당자 확인 후 이 파일에서 조정한다. 운영 제한을 근거 없이 확정하지 않는다.
# - maximum-pool-size/minimum-idle/connection-timeout은 기존 DBCP2 최대 연결 10 /
#   최소 유휴 2 / 대기 10000ms와 같은 의미다.
# - validation-timeout은 connection-timeout보다 작아야 한다(최소 250ms).
# - idle-timeout은 10000ms 이상, max-lifetime은 30000ms 이상이어야 한다(Hikari 유효 범위).
# - 유효성 검사는 JDBC4 Connection.isValid 기본 동작을 쓰므로 DB 전용 쿼리를 두지 않는다.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# 세션 시간대. PostgreSQL 세션 기본값이 UTC라 CURRENT_TIMESTAMP가 UTC로 저장되면
# 화면의 로그·등록일시가 한국 시간과 어긋난다. 접속 URL의 TimeZone/options 파라미터는
# Supavisor(Supabase pooler)에서 적용되지 않으므로 커넥션을 얻을 때 직접 실행한다.
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Seoul'

