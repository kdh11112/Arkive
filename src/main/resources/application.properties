spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
arkive.mail.enabled=${MAIL_ENABLED:false}
arkive.mail.from=${MAIL_FROM:}
arkive.mail.base-url=${MAIL_BASE_URL:http://localhost:8080}
# 메일 발송을 끈 상태에서 SMTP 헬스 체크가 전체 health를 DOWN으로 만들지 않게 한다.
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# 감사 로그 보관. 0이면 자동 삭제하지 않는다. 실제 기간은 개인정보 처리방침 검토 후 설정한다.
