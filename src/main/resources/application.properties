server.port=8080


# VS Code \ub85c\uceec \uac1c\ubc1c\uc6a9: src\uc758 Thymeleaf HTML\uc744 \uc9c1\uc811 \uc77d\uc74c
spring.thymeleaf.prefix=file:./src/main/resources/templates/thymeleaf/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true


# \uc218\ub3d9 Bean\uc774 \uc790\ub3d9 Bean\uc744 \uc624\ubc84\ub77c\uc774\ub529\ud558\ub3c4\ub85d \uc124\uc815
spring.main.allow-bean-definition-overriding=true

# open-in-view(\ud639\uc740 Open-Session-In-View(OSIV))
# true(\uae30\ubcf8\uac12) : \uc0ac\uc6a9\uc790\uc5d0\uac8c \uc751\ub2f5 \ub610\ub294 view\uac00 \ub80c\ub354\ub9c1\ub420 \ub54c\uae4c\uc9c0 \uc601\uc18d\uc131 \ucee8\ud14d\uc2a4\ud2b8 \uc720\uc9c0
# false : \ud2b8\ub79c\uc7ad\uc158\uc774 \uc885\ub8cc\ub420 \ub54c \uc601\uc18d\uc131 \ucee8\ud14d\uc2a4\ud2b8 \uc885\ub8cc
spring.jpa.open-in-view=false


# DB\uc11c\ubc84 \ud0c0\uc785(hsql,mysql,oracle,altibase,tibero) - datasource \ubc0f sqlMap \ud30c\uc77c \uc9c0\uc815\uc5d0 \uc0ac\uc6a9\ub428
Globals.DbType=hsql_server

# hsql(\ub0b4\uc7a5, \ub514\ube44 \uc811\uc18d X)\uacfc hsql_server\ub294 \ub2e4\ub978 \ub514\ube44\uc5d0 \uc811\uc18d \uac00\ub2a5
#Globals.hsql_server.DriverClassName=net.sf.log4jdbc.DriverSpy
Globals.hsql_server.DriverClassName=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
Globals.hsql_server.Url=jdbc:log4jdbc:hsqldb:hsql://127.0.0.1:9001/ArkiveDB
Globals.hsql_server.UserName=sa
Globals.hsql_server.Password=

# never: Spring Boot SQL initialization is disabled; EgovConfigDatasource applies versioned migrations.
spring.sql.init.mode=never

# HSQLDB \ud30c\uc77c DB\ub97c \uc0ac\uc6a9\ud558\uc5ec \ud504\ub85c\uc81d\ud2b8 \uc7ac\uc2dc\uc791 \ud6c4\uc5d0\ub3c4 \ub370\uc774\ud130\ub97c \uc720\uc9c0\ud569\ub2c8\ub2e4.
Globals.hsql_server.DatabasePath=./data/ArkiveDB

# Quartz DBJob dump path. HSQLDB SCRIPT dump every 10 min. Parent dirs are created.
Globals.dumpPath=./backup/ArkiveDB.sql

# \ub85c\uadf8\uc778 \uc778\uc99d \uc81c\ud55c(login authentication limit)
# (\uc0ac\uc6a9 \uc5ec\ubd80 \uc124\uc815\uac12 : true, false)
Globals.login.Lock = true
# - \uc778\uc99d \uc7ac\uc2dc\ub3c4 \ud69f\uc218
Globals.login.LockCount = 5

# EncryptionUtil \ubcc0\uc218
Globals.PUBLIC_KEY 		= __blmsPublickey__
Globals.RSA_WEB_KEY 	= __rsaBlmsPrivateKey__
Globals.RSA_INSTANCE 	= RSA_BLMS

# \ud30c\uc77c \uc5c5\ub85c\ub4dc \uacbd\ub85c(\uacbd\ub85c \uc124\uc815\uc740 \ubc18\ub4dc\uc2dc \uc808\ub300\uacbd\ub85c\ub97c \uc0ac\uc6a9\ud574\uc57c\ud568, \uacbd\ub85c \ub4a4\uc5d0 /\ub97c \ubd99\uc5ec\uc918\uc57c \ud568.)
Globals.FILE_TEMP_PATH 	=  C:/upload/arkive/temp/
Globals.FILE_REAL_PATH 	=  C:/upload/arkive/
Globals.SHOW_TEMP_PATH 	=  C:/upload/arkive/temp/
Globals.SHOW_REAL_PATH 	=  C:/upload/arkive/

# \uba40\ud2f0\ud30c\ud2b8 \ud30c\uc77c \uc5c5\ub85c\ub4dc \uc124\uc815
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
Globals.MaxFilesNum=20
# \uD30C\uC77C 1\uAC1C\uB2F9 \uCD5C\uB300 \uC6A9\uB7C9(MB). \uBA40\uD2F0\uD30C\uD2B8\u00B7\uB4DC\uB86D\uC874 \uC548\uB0B4\uC640 \uD074\uB77C\uC774\uC5B8\uD2B8 \uAC80\uC0AC \uAE30\uC900\uAC12\uC774\uB2E4.
Globals.fileUpload.maxFileSize.mb = 50
# TUS 1\uD68C \uCD5C\uB300 \uC6A9\uB7C9(MB). TUS \uC548\uB0B4\uBB38\uACFC Tus-Max-Size \uD5E4\uB354 \uAE30\uC900\uAC12\uC774\uB2E4.
Globals.tus.maxFileSize.mb = 50
# \uc784\uc2dc\ud30c\uc77c \ubcf4\uad00 \uc2dc\uac04(\uc2dc\uac04). \uc9c0\ub09c \ud30c\uc77c\uc740 TempFileCleanupJob\uc774 \uc0ad\uc81c\ud55c\ub2e4.
Globals.TempFileExpireHours=24

# \uc378\ub124\uc77c \ud504\ub85c\uadf8\ub7a8(FFMPEG) \uacbd\ub85c
Globals.FFMPEG_PATH = /usr/bin


# \ud30c\uc77c \ud655\uc7a5\uc790 \ud654\uc774\ud2b8\ub9ac\uc2a4\ud2b8. \ud655\uc7a5\uc790\ub97c (.)\uacfc \ud568\uaed8 \uc774\uc5b4\uc11c \uc0ac\uc6a9\ud558\uba70 (.)\ub85c \uc2dc\uc791\ud55c\ub2e4.
