<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>일정 등록</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large"><span th:text="${detail != null ? '일정 수정' : '일정 등록'}">일정 등록</span><div th:replace="~{cmm/doubleSubmit :: badge}"></div></h2>
    <div class="conts-wrap">
        <div class="fieldset input-form">
            <input type="hidden" id="scheduleId" th:value="${detail != null ? detail['scheduleId'] : ''}">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <div class="form-group">
                <div class="form-tit"><label for="title">제목</label></div>
                <div class="form-conts"><input type="text" id="title" class="krds-input" th:value="${detail != null ? detail['title'] : ''}"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="scheduleType">구분</label></div>
                <div class="form-conts">
                    <select id="scheduleType" class="krds-form-select">
                        <option value="DEPT" th:selected="${detail == null or detail['scheduleType'] == 'DEPT'}">부서일정</option>
                        <option value="PERSONAL" th:selected="${detail != null and detail['scheduleType'] == 'PERSONAL'}">개인일정</option>
                        <option value="DAILY" th:selected="${detail != null and detail['scheduleType'] == 'DAILY'}">일지</option>
                        <option value="TODO" th:selected="${detail != null and detail['scheduleType'] == 'TODO'}">할일</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="startDt">기간</label></div>
                <div class="form-conts" style="display: flex; flex-direction: row; gap: 8px; align-items: center; flex-wrap: nowrap;">
                    <input type="datetime-local" id="startDt" class="krds-input" style="flex: 1; min-width: 0;" onclick="this.showPicker()" th:value="${detail != null ? #strings.replace(detail['startDt'],' ','T') : (defaultDate != null ? defaultDate + 'T09:00' : '')}">
                    <span>~</span>
                    <input type="datetime-local" id="endDt" class="krds-input" style="flex: 1; min-width: 0;" onclick="this.showPicker()" th:value="${detail != null ? #strings.replace(detail['endDt'],' ','T') : (defaultDate != null ? defaultDate + 'T18:00' : '')}">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="content">내용</label></div>
                <div class="form-conts"><textarea id="content" class="krds-input" rows="8" style="width: 100%;" th:text="${detail != null ? detail['content'] : ''}"></textarea></div>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:href="@{/schedule/scheduleList}" class="krds-btn medium secondary">목록</a>
            <button type="button" class="krds-btn medium danger" th:if="${detail != null}" onclick="fnDeleteSchedule()">삭제</button>
            <button type="button" id="saveBtn" class="krds-btn medium primary" th:text="${detail != null ? '수정' : '등록'}" onclick="fnSaveSchedule()">저장</button>
        </div>
    </div>
<script>
    function fnSaveSchedule() {
        if (window._scheduleSaving) { return; }
        var title = ($('#title').val() || '').trim();
        if (title === '') {
            alert('제목을 입력하세요.');
            $('#title').focus();
            return;
        }
        var scheduleId = $('#scheduleId').val();
        var isUpdate = scheduleId !== '';
        $.ajax({
            type: 'post',
            url: isUpdate ? '/schedule/updateSchedule.json' : '/schedule/insertSchedule.json',
            data: { scheduleId: scheduleId, title: title, content: $('#content').val(), startDt: $('#startDt').val(), endDt: $('#endDt').val(), scheduleType: $('#scheduleType').val(), 'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val() },
            beforeSend: function() { window._scheduleSaving = true; $('#saveBtn').prop('disabled', true); },
            complete: function() { window._scheduleSaving = false; $('#saveBtn').prop('disabled', false); },
            success: function(res) {
                if (res.success) { location.href = '/schedule/scheduleList'; }
                else { alert(res.message || '저장에 실패했습니다.'); }
            },
            error: function() { alert('저장 중 오류가 발생했습니다.'); }
        });
    }
    function fnDeleteSchedule() {
        if (!confirm('삭제하시겠습니까?')) { return; }
        $.ajax({
            type: 'post',
            url: '/schedule/deleteSchedule.json',
            data: { scheduleId: $('#scheduleId').val() },
            success: function(res) {
                if (res.success) { location.href = '/schedule/scheduleList'; }
                else { alert(res.message || '삭제에 실패했습니다.'); }
            },
            error: function() { alert('삭제 중 오류가 발생했습니다.'); }
        });
    }
</script>
</div>
</body>
</html>
