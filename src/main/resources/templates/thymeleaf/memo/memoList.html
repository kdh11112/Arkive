<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>메모보고</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">메모보고</h2>

    <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;">
        <a th:href="@{/memo/memoWrite}" class="krds-btn medium primary">등록</a>
    </div>

    <form id="listForm" method="post" th:action="@{/memo/memoList}">
        <input type="hidden" id="pageIndex" name="pageIndex" th:value="${pageIndex}">
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <select name="status" class="krds-form-select" style="width: 150px;" onchange="document.getElementById('pageIndex').value=1; document.getElementById('listForm').submit();">
                <option value="">전체상태</option>
                <option value="보고" th:selected="${status == '보고'}">보고</option>
                <option value="확인" th:selected="${status == '확인'}">확인</option>
                <option value="의견" th:selected="${status == '의견'}">의견</option>
            </select>
            <input type="text" name="searchKeyword" class="krds-input" style="flex: 1;" placeholder="제목·보고자·대상자 검색" th:value="${searchKeyword}">
            <button type="submit" class="krds-btn medium secondary" onclick="document.getElementById('pageIndex').value=1;">검색</button>
        </div>
    </form>

    <div class="krds-table-wrap">
        <table class="tbl col data">
            <caption>메모보고 목록</caption>
            <colgroup>
                <col style="width: 8%;">
                <col>
                <col style="width: 10%;">
                <col style="width: 10%;">
                <col style="width: 8%;">
                <col style="width: 12%;">
            </colgroup>
            <thead>
            <tr>
                <th scope="col">번호</th>
                <th scope="col">제목</th>
                <th scope="col">보고자</th>
                <th scope="col">대상자</th>
                <th scope="col">상태</th>
                <th scope="col">보고일</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item, stat : ${resultList}">
                <td th:text="${paginationInfo.totalRecordCount + 1 - ((pageIndex - 1) * paginationInfo.recordCountPerPage + stat.count)}"></td>
                <td><a th:href="@{/memo/memoDetail}" data-post th:attr="data-name='reportId',data-value=${item['reportId']}" th:text="${item['title']}"></a></td>
                <td th:text="${item['reporter']}"></td>
                <td th:text="${item['receiver']}"></td>
                <td th:text="${item['status']}"></td>
                <td th:text="${item['reportDt'] != null ? #dates.format(item['reportDt'], 'yyyy-MM-dd') : ''}"></td>
            </tr>
            <tr th:if="${resultList == null or resultList.isEmpty()}">
                <td colspan="6">조회된 메모보고가 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div id="paging" class="krds-pagination w-page" th:utext="${#egovKrdsPaginationRenderer.renderPagination(paginationInfo, 'memoPaging')}"></div>
<script>
    function memoPaging(pageIndex) {
        document.getElementById('pageIndex').value = pageIndex;
        document.getElementById('listForm').submit();
    }
</script>
</div>
</body>
</html>
