<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>로그관리</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">로그관리</h2>
    <p style="color:#555;">로그인, 메뉴 접근, 개인정보 열람·다운로드 기록을 조회합니다. 원문 비밀번호와 본문은 저장하지 않습니다.</p>

    <form id="listForm" method="post" th:action="@{/system/auditLogList}">
        <input type="hidden" id="pageIndex" name="pageIndex" th:value="${pageIndex}">
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
            <input type="date" name="startDate" class="krds-input" style="width:160px;" th:value="${startDate}">
            <input type="date" name="endDate" class="krds-input" style="width:160px;" th:value="${endDate}">
            <select name="eventType" class="krds-input" style="width:180px;">
                <option value="">전체 이벤트</option>
                <option th:each="type : ${eventTypes}" th:value="${type}" th:text="${type}" th:selected="${type == eventType}"></option>
            </select>
            <input type="text" name="searchKeyword" class="krds-input" style="flex:1; min-width:180px;" placeholder="사용자·대상ID·요청 검색" th:value="${searchKeyword}">
            <button type="submit" class="krds-btn medium secondary" onclick="document.getElementById('pageIndex').value=1;">검색</button>
            <a th:href="@{/system/downloadAuditLogExcel.do(startDate=${startDate},endDate=${endDate},eventType=${eventType},searchKeyword=${searchKeyword})}" class="krds-btn medium primary">엑셀</a>
        </div>
    </form>

    <div class="krds-table-wrap">
        <table class="tbl col data">
            <caption>감사 로그 목록</caption>
            <thead>
            <tr>
                <th scope="col">일시</th>
                <th scope="col">이벤트</th>
                <th scope="col">사용자</th>
                <th scope="col">메뉴</th>
                <th scope="col">대상</th>
                <th scope="col">요청</th>
                <th scope="col">결과</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${resultList}">
                <td th:text="${item['registDt'] != null ? #dates.format(item['registDt'], 'yyyy-MM-dd HH:mm:ss') : ''}"></td>
                <td th:text="${item['eventType']}"></td>
                <td th:text="${item['userId'] != null ? item['userId'] : '-'}"></td>
                <td th:text="${item['menuId'] != null ? item['menuId'] : '-'}"></td>
                <td th:text="${(item['targetType'] != null ? item['targetType'] : '') + (item['targetId'] != null ? ' / ' + item['targetId'] : '')}"></td>
                <td th:text="${item['requestUri']}"></td>
                <td th:text="${item['result']}"></td>
            </tr>
            <tr th:if="${resultList == null or resultList.isEmpty()}">
                <td colspan="7">조회된 로그가 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div id="paging" class="krds-pagination w-page" th:utext="${#egovKrdsPaginationRenderer.renderPagination(paginationInfo, 'auditPaging')}"></div>
    <script>
        function auditPaging(pageIndex) {
            document.getElementById('pageIndex').value = pageIndex;
            document.getElementById('listForm').submit();
        }
    </script>
</div>
</body>
</html>
