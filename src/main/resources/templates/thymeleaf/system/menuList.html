<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>메뉴 관리</title>
</head>
<body>

<div layout:fragment="content">
    <h2 class="heading-large">메뉴 관리</h2>

    <link rel="stylesheet" th:href="@{/vendor/jstree/style.min.css}">
    <script th:src="@{/vendor/jstree/jstree.min.js}"></script>

    <div class="conts-wrap">
        <style>
            /* 상위(트리)-하위(표) 좌우 배치. 좁은 화면에서는 세로로 쌓는다 */
            .menu-cols { display: flex; gap: 24px; align-items: flex-start; }
            .menu-cols > .menu-tree { flex: 0 0 28%; min-width: 0; }
            .menu-cols > .menu-tree #jstree { width: 100%; }
            .menu-cols > .menu-table { flex: 1 1 auto; min-width: 0; }
            .menu-cols > .menu-table { flex: 1; min-width: 0; }
            @media (max-width: 1023px) {
                .menu-cols { flex-direction: column; }
                .menu-cols > .menu-tree { flex: none; width: 100%; }
            }
        </style>
        <div class="menu-cols">
        <div class="menu-tree">
        <div class="fieldset">
            <div class="form-group">
                <div class="form-tit"><span>상위메뉴 목록</span></div>
                <div class="form-conts">
                    <div class="btn-wrap">
                        <button type="button" class="krds-btn small primary" onclick="fnOpenMenuModal('insert', 'upper')">추가</button>
                        <button type="button" class="krds-btn small secondary" onclick="fnOpenMenuModal('update', 'upper')">수정</button>
                        <button type="button" class="krds-btn small danger" onclick="fnDeleteMenu()">삭제</button>
                    </div>
                    <div id="jstree" style="height: 400px; overflow: auto; border: 1px solid #d5d5d5; margin-top: 8px;"></div>
                </div>
            </div>
        </div>
        </div>

        <div class="menu-table">
        <div class="fieldset">
            <div class="form-group">
                <div class="form-tit"><span>하위메뉴 목록</span></div>
                <div class="form-conts">
                    <div class="btn-wrap" style="margin-bottom: 8px;">
                        <button type="button" class="krds-btn small primary" onclick="fnOpenMenuModal('insert', 'lower')">하위메뉴 추가</button>
                    </div>
                    <div class="krds-table-wrap">
                        <table class="tbl col data">
                            <caption>하위메뉴 목록</caption>
                            <thead>
                                <tr>
                                    <th scope="col">메뉴ID</th>
                                    <th scope="col">메뉴명</th>
                                    <th scope="col">메뉴경로</th>
                                    <th scope="col">순서</th>
                                    <th scope="col">사용여부</th>
                                    <th scope="col">관리</th>
                                </tr>
                            </thead>
                            <tbody id="menuLowTbody">
                                <tr>
                                    <td colspan="6">상위 메뉴를 선택하세요.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        </div>
        </div>
    </div>

    <!-- KRDS 모달. ui-script 의존 없이 직접 열고 닫는다 -->
    <section id="menuModal" class="krds-modal fade" role="dialog" aria-labelledby="tit_menuModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="tit_menuModal" class="modal-title">메뉴 등록</h2>
                </div>
                <div class="modal-conts">
                    <div class="conts-area">
                        <form id="menuForm">
                            <input type="hidden" id="mode" name="mode">
                            <input type="hidden" id="grad" name="grad" value="1">
                            <input type="hidden" id="upMenuId" name="upMenuId" value="ME00000000">
                            <div class="fieldset input-form">
                                <div class="form-group">
                                    <div class="form-tit"><label for="menuId">메뉴 ID</label></div>
                                    <div class="form-conts"><input type="text" class="krds-input" id="menuId" name="menuId" required placeholder="예: ME00000001"></div>
                                </div>
                                <div class="form-group">
                                    <div class="form-tit"><label for="menuNm">메뉴명</label></div>
                                    <div class="form-conts"><input type="text" class="krds-input" id="menuNm" name="menuNm" required placeholder="메뉴명을 입력하세요"></div>
                                </div>
                                <div class="form-group">
                                    <div class="form-tit"><label for="menuCours">메뉴 경로 (URL)</label></div>
                                    <div class="form-conts"><input type="text" class="krds-input" id="menuCours" name="menuCours" placeholder="예: /system/menuList"></div>
                                </div>
                                <div class="form-group">
                                    <div class="form-tit"><label for="ordr">출력 순서</label></div>
                                    <div class="form-conts"><input type="number" class="krds-input" id="ordr" name="ordr" value="1"></div>
                                </div>
                                <div class="form-group">
                                    <div class="form-tit"><label for="useYn">사용 여부</label></div>
                                    <div class="form-conts">
                                        <select class="krds-form-select" id="useYn" name="useYn">
                                            <option value="Y">Y</option>
                                            <option value="N">N</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="modal-btn btn-wrap">
                    <button type="button" class="krds-btn medium tertiary close-modal" onclick="closeMenuModal()">취소</button>
                    <button type="button" class="krds-btn medium primary" onclick="fnSaveMenu()">저장</button>
                </div>
                <button type="button" class="krds-btn medium icon btn-close close-modal" onclick="closeMenuModal()">
                    <span class="sr-only">닫기</span>
                    <i class="svg-icon ico-popup-close"></i>
                </button>
            </div>
        </div>
        <div class="modal-back"></div>
    </section>

<script>
    var selectedNodeId = "ME00000000";
    var selectedNodeText = "";
    var selectedNodeGrad = 1;

    function getMenuList(menuId) {
    	$.getJSON(
    		"/system/getMenuList.json",
    		function(data) {
    			if($('#jstree').jstree(true)) {
    				$('#jstree').jstree(true).destroy();
    			}
    			$('#jstree').jstree({
    				'core' : {
    					'multiple' : false,
    					'data' : data.menuList
    				}
    			});

    			$('#jstree').bind('ready.jstree', function(e, data) {
    				$('#jstree').jstree("select_node", menuId);
    				$('#jstree').jstree("open_node", menuId);
    			});

    			$('#jstree').off('changed.jstree').on('changed.jstree', function (e, data) {
    				if(data.selected && data.selected.length > 0) {
    					var node = data.instance.get_node(data.selected[0]);
    					selectedNodeId = node.id;
    					selectedNodeText = node.text;
    					selectedNodeGrad = node.original ? (node.original.grad || 1) : 1;
    					getMenuLow(selectedNodeId);
    				}
    			});
    		}
    	);
    }

    // 하위메뉴 목록 조회
    function getMenuLow(pId){
    	$.ajax({
    		type: "post",
    		url: "/system/getMenuDetailList.json",
    		data: {
    			"menuId": pId
    		},
    		dataType: "json",
    		success: function(data){
    			var html = "";
    			if(data.menuList && data.menuList.length > 0) {
    				$.each(data.menuList, function(i, item) {
    					html += "<tr>";
    					html += "<td>" + (item.menuId || '') + "</td>";
    					html += "<td>" + (item.menuNm || '') + "</td>";
    					html += "<td>" + (item.menuCours || '') + "</td>";
    					html += "<td>" + (item.ordr || '') + "</td>";
    					html += "<td>" + (item.useYn || '') + "</td>";
    					html += "<td>";
    					html += "<button type='button' class='krds-btn small secondary' onclick='fnEditLowerMenu(\"" + item.menuId + "\", \"" + item.menuNm + "\", \"" + (item.menuCours || '') + "\", " + (item.ordr || 1) + ", \"" + item.useYn + "\")'>수정</button> ";
    					html += "<button type='button' class='krds-btn small danger' onclick='fnDeleteLowerMenu(\"" + item.menuId + "\")'>삭제</button>";
    					html += "</td>";
    					html += "</tr>";
    				});
    			} else {
    				html += "<tr><td colspan='6'>하위 메뉴가 존재하지 않습니다.</td></tr>";
    			}
    			$("#menuLowTbody").html(html);
    		},
    		error: function(request,status,error){
    			alert("에러가 발생하였습니다. 관리자에게 문의하세요.");
    		}
    	});
    }

    function openMenuModal() {
        var m = document.getElementById('menuModal');
        m.classList.add('shown');
        m.querySelector('.modal-back').classList.add('in');
        setTimeout(function() { m.classList.add('in'); }, 50);
    }

    function closeMenuModal() {
        var m = document.getElementById('menuModal');
        if (!m.classList.contains('shown')) return;
        m.classList.remove('in');
        m.querySelector('.modal-back').classList.remove('in');
        setTimeout(function() { m.classList.remove('shown'); }, 150);
    }
    document.getElementById('menuModal').querySelector('.modal-back').addEventListener('click', closeMenuModal);
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeMenuModal();
    });

    // 모달 오픈 (추가/수정, 상위/하위)
    function fnOpenMenuModal(type, target) {
        $("#menuForm")[0].reset();
        $("#menuId").prop("readonly", false);

        if (type === 'insert') {
            $("#mode").val("insert");
            if (target === 'upper') {
                $("#tit_menuModal").text("상위메뉴 등록");
                $("#grad").val(1);
                $("#upMenuId").val("ME00000000");
            } else {
                if (!selectedNodeId || selectedNodeId === "ME00000000") {
                    alert("상위 메뉴를 먼저 선택하세요.");
                    return;
                }
                $("#tit_menuModal").text("하위메뉴 등록 (상위: " + selectedNodeText + ")");
                $("#grad").val(Number(selectedNodeGrad) + 1);
                $("#upMenuId").val(selectedNodeId);
            }
            $("#menuId").val("ME" + Math.floor(10000000 + Math.random() * 90000000));
        } else if (type === 'update') {
            if (!selectedNodeId || selectedNodeId === "ME00000000") {
                alert("수정할 상위 메뉴를 선택하세요.");
                return;
            }
            $("#mode").val("update");
            $("#tit_menuModal").text("상위메뉴 수정");
            $("#menuId").val(selectedNodeId).prop("readonly", true);
            $("#menuNm").val(selectedNodeText);
            $("#grad").val(selectedNodeGrad);
            $("#upMenuId").val("ME00000000");
        }
        openMenuModal();
    }

    // 하위메뉴 수정 모달 오픈
    function fnEditLowerMenu(menuId, menuNm, menuCours, ordr, useYn) {
        $("#menuForm")[0].reset();
        $("#mode").val("update");
        $("#tit_menuModal").text("하위메뉴 수정");
        $("#menuId").val(menuId).prop("readonly", true);
        $("#menuNm").val(menuNm);
        $("#menuCours").val(menuCours);
        $("#ordr").val(ordr);
        $("#useYn").val(useYn);
        $("#grad").val(2);
        $("#upMenuId").val(selectedNodeId);
        openMenuModal();
    }

    // 메뉴 저장 (등록/수정)
    function fnSaveMenu() {
        var mode = $("#mode").val();
        var url = (mode === 'insert') ? "/system/setInsertMenu.json" : "/system/setUpdateMenu.json";

        var formData = {
            menuId: $("#menuId").val(),
            menuNm: $("#menuNm").val(),
            menuCours: $("#menuCours").val(),
            grad: $("#grad").val(),
            upMenuId: $("#upMenuId").val(),
            ordr: $("#ordr").val() || 1,
            useYn: $("#useYn").val()
        };

        if(!formData.menuId || !formData.menuNm) {
            alert("메뉴 ID와 메뉴명은 필수 입력 항목입니다.");
            return;
        }

        $.ajax({
            type: "post",
            url: url,
            data: formData,
            dataType: "json",
            success: function(response) {
                alert("저장되었습니다.");
                closeMenuModal();
                getMenuList(selectedNodeId);
            },
            error: function(request, status, error) {
                alert("저장 중 에러가 발생하였습니다.");
            }
        });
    }

    // 상위메뉴 삭제
    function fnDeleteMenu() {
        if (!selectedNodeId || selectedNodeId === "ME00000000") {
            alert("삭제할 상위 메뉴를 선택하세요.");
            return;
        }
        if (confirm("정말 삭제하시겠습니까? 하위 메뉴가 함께 삭제될 수 있습니다.")) {
            $.ajax({
                type: "post",
                url: "/system/setDeleteMenu.json",
                data: { menuId: selectedNodeId },
                dataType: "json",
                success: function(response) {
                    alert("삭제되었습니다.");
                    getMenuList("ME00000000");
                    $("#menuLowTbody").html("<tr><td colspan='6'>상위 메뉴를 선택하세요.</td></tr>");
                },
                error: function(request, status, error) {
                    alert("삭제 중 에러가 발생하였습니다.");
                }
            });
        }
    }

    // 하위메뉴 삭제
    function fnDeleteLowerMenu(menuId) {
        if (confirm("정말 이 하위 메뉴를 삭제하시겠습니까?")) {
            $.ajax({
                type: "post",
                url: "/system/setDeleteMenu.json",
                data: { menuId: menuId },
                dataType: "json",
                success: function(response) {
                    alert("삭제되었습니다.");
                    getMenuList(selectedNodeId);
                    getMenuLow(selectedNodeId);
                },
                error: function(request, status, error) {
                    alert("삭제 중 에러가 발생하였습니다.");
                }
            });
        }
    }

	$(function() {
		getMenuList("ME00000000");
	});
</script>
</div>

</body>
</html>
