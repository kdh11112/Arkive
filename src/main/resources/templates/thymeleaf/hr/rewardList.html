<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>포상관리</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">포상관리</h2>

    <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;">
        <a th:href="@{/hr/rewardWrite}" class="krds-btn medium primary">등록</a>
    </div>

    <form id="listForm" method="get" th:action="@{/hr/rewardList}">
        <input type="hidden" id="pageIndex" name="pageIndex" th:value="${pageIndex}">
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <input type="number" name="year" class="krds-input" style="width: 110px;"
                   min="2000" max="2100" th:value="${year}">
            <select name="rewardType" class="krds-form-select" style="width: 150px;">
                <option value="" th:selected="${rewardType == ''}">전체 구분</option>
                <option value="EXCELLENT" th:selected="${rewardType == 'EXCELLENT'}">우수사원</option>
                <option value="TEAMWORK" th:selected="${rewardType == 'TEAMWORK'}">협업공로</option>
                <option value="ETC" th:selected="${rewardType == 'ETC'}">기타</option>
            </select>
            <input type="text" name="searchKeyword" class="krds-input" style="flex: 1;"
                   placeholder="포상명·대상자·포상자 검색" th:value="${searchKeyword}">
            <button type="submit" class="krds-btn medium secondary"
                    onclick="document.getElementById('pageIndex').value=1;">검색</button>
        </div>
    </form>

    <div class="krds-table-wrap">
        <table class="tbl col data">
            <caption>포상 목록</caption>
            <colgroup>
                <col style="width: 12%;">
                <col style="width: 18%;">
                <col style="width: 10%;">
                <col>
                <col style="width: 12%;">
                <col style="width: 14%;">
            </colgroup>
            <thead>
            <tr>
                <th scope="col">포상일</th>
                <th scope="col">대상자</th>
                <th scope="col">구분</th>
                <th scope="col">포상명</th>
                <th scope="col">포상금</th>
                <th scope="col">포상자</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${resultList}">
                <td><a th:href="@{/hr/rewardWrite}" data-post th:attr="data-name='rewardId',data-value=${item['rewardId']}" th:text="${item['rewardDe']}"></a></td>
                <td>
                    <div th:text="${item['userNm']}"></div>
                    <div th:text="${item['userId']}" style="font-size: 12px; color: #666;"></div>
                </td>
                <td th:switch="${item['rewardType']}">
                    <span th:case="'EXCELLENT'">우수사원</span>
                    <span th:case="'TEAMWORK'">협업공로</span>
                    <span th:case="*">기타</span>
                </td>
                <td th:text="${item['title']}"></td>
                <td th:text="${#numbers.formatDecimal(item['amount'], 1, 0)} + '원'"></td>
                <td th:text="${item['rewarder']}"></td>
            </tr>
            <tr th:if="${resultList == null or resultList.isEmpty()}">
                <td colspan="6">조회된 포상이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div id="paging" class="krds-pagination w-page"
         th:utext="${#egovKrdsPaginationRenderer.renderPagination(paginationInfo, 'rewardPaging')}"></div>
    <script>
        function rewardPaging(pageIndex) {
            document.getElementById('pageIndex').value = pageIndex;
            document.getElementById('listForm').submit();
        }
    </script>
</div>
</body>
</html>
