<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>기념일 등록</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large"><span th:text="${detail != null ? '기념일 수정' : '기념일 등록'}">기념일 등록</span><div th:replace="~{cmm/doubleSubmit :: badge}"></div></h2>
    <div class="conts-wrap">
        <div class="fieldset input-form">
            <input type="hidden" id="annivId" th:value="${detail != null ? detail['annivId'] : ''}">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <div class="form-group">
                <div class="form-tit"><label for="userId">대상자</label></div>
                <div class="form-conts">
                    <select id="userId" class="krds-form-select" style="width: 260px;">
                        <option value="">선택</option>
                        <option th:each="user : ${userList}" th:value="${user['userId']}"
                                th:text="${user['userNm']} + ' (' + ${user['userId']} + ')'"
                                th:selected="${detail != null and detail['userId'] == user['userId']}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="annivType">구분</label></div>
                <div class="form-conts">
                    <select id="annivType" class="krds-form-select" style="width: 200px;">
                        <option value="BIRTH" th:selected="${detail == null or detail['annivType'] == 'BIRTH'}">생일</option>
                        <option value="WEDDING" th:selected="${detail != null and detail['annivType'] == 'WEDDING'}">결혼기념일</option>
                        <option value="HIRE" th:selected="${detail != null and detail['annivType'] == 'HIRE'}">입사기념일</option>
                        <option value="ETC" th:selected="${detail != null and detail['annivType'] == 'ETC'}">기타</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="annivDe">기념일</label></div>
                <div class="form-conts">
                    <input type="text" id="annivDe" class="krds-input" style="width: 140px;"
                           maxlength="5" placeholder="MM-DD"
                           th:value="${detail != null ? detail['annivDe'] : ''}">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="title">기념일명</label></div>
                <div class="form-conts">
                    <input type="text" id="title" class="krds-input" maxlength="200"
                           th:value="${detail != null ? detail['title'] : ''}">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="useYn">사용여부</label></div>
                <div class="form-conts">
                    <select id="useYn" class="krds-form-select" style="width: 160px;">
                        <option value="Y" th:selected="${detail == null or detail['useYn'] == 'Y'}">사용</option>
                        <option value="N" th:selected="${detail != null and detail['useYn'] == 'N'}">중지</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="remark">비고</label></div>
                <div class="form-conts">
                    <textarea id="remark" class="krds-input" rows="3" maxlength="500"
                              style="width: 100%;" th:text="${detail != null ? detail['remark'] : ''}"></textarea>
                </div>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:href="@{/hr/anniversaryList}" class="krds-btn medium secondary">목록</a>
            <button type="button" class="krds-btn medium danger" th:if="${detail != null}" onclick="fnDelete()">삭제</button>
            <button type="button" id="saveBtn" class="krds-btn medium primary"
                    th:text="${detail != null ? '수정' : '등록'}" onclick="fnSave()">저장</button>
        </div>
    </div>
    <script>
        function fnSave() {
            var annivId = $('#annivId').val();
            if (!$('#userId').val()) { alert('대상자를 선택하세요.'); return; }
            if (!/^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$/.test(($('#annivDe').val() || '').trim())) {
                alert('기념일은 MM-DD 형식으로 입력하세요.'); return;
            }
            if (($('#title').val() || '').trim() === '') { alert('기념일명을 입력하세요.'); return; }
            $.ajax({
                type: 'post',
                url: annivId ? '/hr/updateAnniversary.json' : '/hr/insertAnniversary.json',
                data: {
                    annivId: annivId,
                    userId: $('#userId').val(),
                    annivType: $('#annivType').val(),
                    annivDe: $('#annivDe').val(),
                    title: $('#title').val(),
                    remark: $('#remark').val(),
                    useYn: $('#useYn').val(),
                    'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val()
                },
                beforeSend: function() { $('#saveBtn').prop('disabled', true); },
                complete: function() { $('#saveBtn').prop('disabled', false); },
                success: function(res) {
                    if (res.success) { location.href = '/hr/anniversaryList'; }
                    else { alert(res.message || '저장에 실패했습니다.'); }
                },
                error: function() { alert('저장 중 오류가 발생했습니다.'); }
            });
        }
        function fnDelete() {
            if (!confirm('삭제하시겠습니까?')) { return; }
            $.ajax({
                type: 'post',
                url: '/hr/deleteAnniversary.json',
                data: { annivId: $('#annivId').val() },
                success: function(res) {
                    if (res.success) { location.href = '/hr/anniversaryList'; }
                    else { alert(res.message || '삭제에 실패했습니다.'); }
                },
                error: function() { alert('삭제 중 오류가 발생했습니다.'); }
            });
        }
    </script>
</div>
</body>
</html>
