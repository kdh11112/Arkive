<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>경조사 등록</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large"><span th:text="${detail != null ? '경조사 수정' : '경조사 등록'}">경조사 등록</span><div th:replace="~{cmm/doubleSubmit :: badge}"></div></h2>
    <div class="conts-wrap">
        <div class="fieldset input-form">
            <input type="hidden" id="eventId" th:value="${detail != null ? detail['eventId'] : ''}">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <div class="form-group">
                <div class="form-tit"><label for="userId">대상자</label></div>
                <div class="form-conts">
                    <select id="userId" class="krds-form-select" style="width: 260px;">
                        <option value="">선택</option>
                        <option th:each="user : ${userList}" th:value="${user['userId']}"
                                th:text="${user['userNm']} + ' (' + ${user['userId']} + ')'"
                                th:selected="${detail != null and detail['userId'] == user['userId']}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="eventType">구분</label></div>
                <div class="form-conts">
                    <select id="eventType" class="krds-form-select" style="width: 200px;">
                        <option value="WEDDING" th:selected="${detail == null or detail['eventType'] == 'WEDDING'}">결혼</option>
                        <option value="FUNERAL" th:selected="${detail != null and detail['eventType'] == 'FUNERAL'}">장례</option>
                        <option value="BIRTH" th:selected="${detail != null and detail['eventType'] == 'BIRTH'}">출산</option>
                        <option value="ETC" th:selected="${detail != null and detail['eventType'] == 'ETC'}">기타</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="eventDe">경조사일</label></div>
                <div class="form-conts">
                    <input type="date" id="eventDe" class="krds-input" th:value="${detail != null ? detail['eventDe'] : ''}">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="title">경조사명</label></div>
                <div class="form-conts">
                    <input type="text" id="title" class="krds-input" maxlength="200"
                           th:value="${detail != null ? detail['title'] : ''}">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="amount">경조금(원)</label></div>
                <div class="form-conts">
                    <input type="number" id="amount" class="krds-input" min="0" step="1" style="width: 200px;"
                           th:value="${detail != null ? detail['amount'] : 0}">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="remark">비고</label></div>
                <div class="form-conts">
                    <textarea id="remark" class="krds-input" rows="3" maxlength="500"
                              style="width: 100%;" th:text="${detail != null ? detail['remark'] : ''}"></textarea>
                </div>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:href="@{/hr/eventList}" class="krds-btn medium secondary">목록</a>
            <button type="button" class="krds-btn medium danger" th:if="${detail != null}" onclick="fnDelete()">삭제</button>
            <button type="button" id="saveBtn" class="krds-btn medium primary"
                    th:text="${detail != null ? '수정' : '등록'}" onclick="fnSave()">저장</button>
        </div>
    </div>
    <script>
        function fnSave() {
            var eventId = $('#eventId').val();
            if (!$('#userId').val()) { alert('대상자를 선택하세요.'); return; }
            if (($('#eventDe').val() || '').trim() === '') { alert('경조사일을 입력하세요.'); return; }
            if (($('#title').val() || '').trim() === '') { alert('경조사명을 입력하세요.'); return; }
            $.ajax({
                type: 'post',
                url: eventId ? '/hr/updateEvent.json' : '/hr/insertEvent.json',
                data: {
                    eventId: eventId,
                    userId: $('#userId').val(),
                    eventType: $('#eventType').val(),
                    eventDe: $('#eventDe').val(),
                    title: $('#title').val(),
                    amount: $('#amount').val(),
                    remark: $('#remark').val(),
                    'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val()
                },
                beforeSend: function() { $('#saveBtn').prop('disabled', true); },
                complete: function() { $('#saveBtn').prop('disabled', false); },
                success: function(res) {
                    if (res.success) { location.href = '/hr/eventList'; }
                    else { alert(res.message || '저장에 실패했습니다.'); }
                },
                error: function() { alert('저장 중 오류가 발생했습니다.'); }
            });
        }
        function fnDelete() {
            if (!confirm('삭제하시겠습니까?')) { return; }
            $.ajax({
                type: 'post',
                url: '/hr/deleteEvent.json',
                data: { eventId: $('#eventId').val() },
                success: function(res) {
                    if (res.success) { location.href = '/hr/eventList'; }
                    else { alert(res.message || '삭제에 실패했습니다.'); }
                },
                error: function() { alert('삭제 중 오류가 발생했습니다.'); }
            });
        }
    </script>
</div>
</body>
</html>
