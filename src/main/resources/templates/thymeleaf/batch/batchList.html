<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>배치관리</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">배치관리</h2>

    <div style="margin-bottom: 12px; padding: 12px 16px; background: #f8f9fa; border-radius: 6px; color: #444; font-size: 14px;">
        <div>Spring Batch <strong>dailyStatsJob</strong> / <strong>dailyStatsStep</strong>을 화면에서 수동 실행합니다.</div>
        <div>집계 항목: 게시판 건수(누적), 로그인·접속(AUDIT_LOG), 강의 수료, 설문 참여</div>
        <div style="color: #b45309; margin-top: 4px;">
            실행 이력은 저장하지 않으며(ResourcelessJobRepository), 같은 날짜를 다시 실행하면 기존 집계를 지우고 새로 계산합니다.
        </div>
    </div>

    <form id="runForm" method="post" th:action="@{/batch/batchList}"
          th:attr="data-run-url=@{/batch/runDailyStats.json}">
        <div th:replace="~{cmm/doubleSubmit :: token}"></div>
        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 16px;">
            <label for="statDate" style="font-weight: 600;">집계 날짜</label>
            <input type="date" id="statDate" name="statDate" class="krds-input"
                   th:value="${statDate}" style="width: 180px;">
            <button type="submit" class="krds-btn medium secondary">결과 조회</button>
            <button type="button" id="runBtn" class="krds-btn medium primary" onclick="fnRun()">집계 실행</button>
        </div>
    </form>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <h3 class="heading-medium" style="margin: 0;" th:text="${statDate} + ' 집계 결과'">집계 결과</h3>
        <span style="color: #666; font-size: 14px;" th:text="${'총 ' + #lists.size(resultList) + '건'}"></span>
    </div>

    <div class="krds-table-wrap">
        <table class="tbl col data">
            <caption>일일 통계 집계 결과</caption>
            <colgroup>
                <col style="width: 20%;">
                <col style="width: 30%;">
                <col style="width: 20%;">
                <col>
            </colgroup>
            <thead>
            <tr>
                <th scope="col">유형</th>
                <th scope="col">항목</th>
                <th scope="col">값</th>
                <th scope="col">집계 시각</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${resultList}">
                <td>
                    <span th:switch="${item['statType']}">
                        <span th:case="'BOARD'">게시판</span>
                        <span th:case="'LOGIN'">로그인</span>
                        <span th:case="'ACCESS'">접속</span>
                        <span th:case="'LECTURE_COMPLETE'">강의 수료</span>
                        <span th:case="'SURVEY_PARTICIPATION'">설문 참여</span>
                        <span th:case="*" th:text="${item['statType']}"></span>
                    </span>
                </td>
                <td th:text="${item['statKey'] == 'TOTAL' ? '전체' : item['statKey']}"></td>
                <td th:text="${item['statValue']}"></td>
                <td th:text="${item['registDt'] == null ? '' : #dates.format(item['registDt'], 'yyyy-MM-dd HH:mm:ss')}"></td>
            </tr>
            <tr th:if="${resultList == null or resultList.isEmpty()}">
                <td colspan="4">집계 결과가 없습니다. 집계 날짜를 확인한 뒤 집계를 실행하세요.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <script>
        function fnRun() {
            var statDate = document.getElementById('statDate').value;
            if (!statDate) {
                alert('집계 날짜를 선택하세요.');
                return;
            }
            if (!confirm(statDate + ' 날짜의 일일 통계를 집계하시겠습니까?\n같은 날짜의 기존 집계 결과는 새로 계산됩니다.')) {
                return;
            }
            var $form = $('#runForm');
            var $btn = $('#runBtn').prop('disabled', true);
            $.ajax({
                type: 'post',
                url: $form.data('run-url'),
                data: $form.serialize(),
                success: function(res) {
                    if (res.success) {
                        alert(res.targetDate + ' 집계가 완료되었습니다.');
                        location.href = $form.attr('action') + '?statDate=' + encodeURIComponent(res.targetDate);
                    } else {
                        alert(res.message || '집계에 실패했습니다.');
                    }
                },
                error: function(xhr) {
                    alert(xhr.status === 403 ? '권한이 없습니다.' : '처리 중 오류가 발생했습니다.');
                },
                complete: function() {
                    $btn.prop('disabled', false);
                }
            });
        }
    </script>
</div>
</body>
</html>
