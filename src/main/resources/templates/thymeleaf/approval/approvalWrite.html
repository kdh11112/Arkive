<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>기안 작성</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large"><span th:text="${detail != null ? '기안 수정' : '기안 작성'}">기안 작성</span><div th:replace="~{cmm/doubleSubmit :: badge}"></div></h2>
    <div class="conts-wrap">
        <div class="fieldset input-form">
            <input type="hidden" id="docId" th:value="${detail != null ? detail['docId'] : ''}">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <div class="form-group">
                <div class="form-tit"><label for="docType">문서구분</label></div>
                <div class="form-conts">
                    <select id="docType" class="krds-form-select" style="width: 180px;">
                        <option value="GENERAL" th:selected="${detail == null or detail['docType'] == 'GENERAL'}">일반</option>
                        <option value="LEAVE" th:selected="${detail != null and detail['docType'] == 'LEAVE'}">휴가</option>
                        <option value="EXPENSE" th:selected="${detail != null and detail['docType'] == 'EXPENSE'}">지출</option>
                        <option value="ETC" th:selected="${detail != null and detail['docType'] == 'ETC'}">기타</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="approverId">결재자</label></div>
                <div class="form-conts">
                    <select id="approverId" class="krds-form-select" style="width: 220px;">
                        <option th:each="user : ${userList}" th:value="${user['userId']}"
                                th:text="${user['userNm'] + ' (' + user['userId'] + ')'}"
                                th:selected="${detail != null and detail['approverId'] == user['userId']}"></option>
                    </select>
                    <span style="font-size: 12px; color: #555; margin-left: 8px;">본인은 결재자로 지정할 수 없습니다.</span>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="title">제목</label></div>
                <div class="form-conts">
                    <input type="text" id="title" class="krds-input" maxlength="200"
                           th:value="${detail != null ? detail['title'] : ''}">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="content">내용</label></div>
                <div class="form-conts">
                    <textarea id="content" class="krds-input" rows="10" maxlength="4000"
                              style="width: 100%;" th:text="${detail != null ? detail['content'] : ''}"></textarea>
                </div>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:href="@{/approval/approvalList}" class="krds-btn medium secondary">목록</a>
            <button type="button" id="saveBtn" class="krds-btn medium primary"
                    th:text="${detail != null ? '수정' : '임시저장'}" onclick="fnSaveDraft()">저장</button>
        </div>
    </div>
    <script>
        function fnSaveDraft() {
            var title = ($('#title').val() || '').trim();
            var approverId = $('#approverId').val();
            if (title === '') {
                alert('제목을 입력하세요.');
                $('#title').focus();
                return;
            }
            if (!approverId) {
                alert('결재자를 선택하세요.');
                return;
            }
            var docId = $('#docId').val();
            $.ajax({
                type: 'post',
                url: docId ? '/approval/updateDraft.json' : '/approval/insertDraft.json',
                data: {
                    docId: docId,
                    docType: $('#docType').val(),
                    approverId: approverId,
                    title: title,
                    content: $('#content').val(),
                    'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val()
                },
                beforeSend: function() { $('#saveBtn').prop('disabled', true); },
                complete: function() { $('#saveBtn').prop('disabled', false); },
                success: function(res) {
                    if (res.success) {
                        location.href = '/approval/approvalView?docId=' + encodeURIComponent(res.docId || docId);
                    } else {
                        alert(res.message || '저장에 실패했습니다.');
                    }
                },
                error: function() { alert('저장 중 오류가 발생했습니다.'); }
            });
        }
    </script>
</div>
</body>
</html>
