<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>설문 질문 등록</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large"><span th:text="${detail != null ? '질문 수정' : '질문 등록'}">질문 등록</span><div th:replace="~{cmm/doubleSubmit :: badge}"></div></h2>

    <div class="conts-wrap" style="margin-bottom: 12px;">
        <strong th:text="${survey['title']}"></strong>
        <span style="margin-left: 8px; font-size: 12px; color: #666;"
              th:text="${survey['startDe']} + ' ~ ' + ${survey['endDe']}"></span>
    </div>

    <div th:if="${survey['status'] != 'DRAFT'}"
         style="margin-bottom: 12px; padding: 10px 12px; background: #fff7e6; border: 1px solid #f0c36d;">
        공개된 설문은 질문을 추가·수정할 수 없습니다.
    </div>

    <div class="conts-wrap">
        <div class="fieldset input-form">
            <input type="hidden" id="surveyId" th:value="${survey['surveyId']}">
            <input type="hidden" id="questionId" th:value="${detail != null ? detail['questionId'] : ''}">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <div class="form-group">
                <div class="form-tit"><label for="questionType">질문 유형</label></div>
                <div class="form-conts">
                    <select id="questionType" class="krds-form-select" style="width: 220px;"
                            th:disabled="${survey['status'] != 'DRAFT'}" onchange="fnToggleItems()">
                        <option value="SINGLE" th:selected="${detail == null or detail['questionType'] == 'SINGLE'}">단일선택</option>
                        <option value="MULTI" th:selected="${detail != null and detail['questionType'] == 'MULTI'}">복수선택</option>
                        <option value="TEXT" th:selected="${detail != null and detail['questionType'] == 'TEXT'}">주관식</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="questionTxt">질문</label></div>
                <div class="form-conts">
                    <textarea id="questionTxt" class="krds-input" rows="3" maxlength="1000" style="width: 100%;"
                              th:text="${detail != null ? detail['questionTxt'] : ''}"
                              th:readonly="${survey['status'] != 'DRAFT'}"></textarea>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="requiredYn">필수 여부</label></div>
                <div class="form-conts">
                    <select id="requiredYn" class="krds-form-select" style="width: 160px;"
                            th:disabled="${survey['status'] != 'DRAFT'}">
                        <option value="N" th:selected="${detail == null or detail['requiredYn'] == 'N'}">선택</option>
                        <option value="Y" th:selected="${detail != null and detail['requiredYn'] == 'Y'}">필수</option>
                    </select>
                </div>
            </div>
            <div class="form-group" id="itemGroup">
                <div class="form-tit"><span>보기</span></div>
                <div class="form-conts">
                    <div id="itemRows"></div>
                    <div style="margin-top: 6px;">
                        <button type="button" class="krds-btn small secondary" onclick="fnAddItem()"
                                th:disabled="${survey['status'] != 'DRAFT'}">보기 추가</button>
                        <span style="margin-left: 8px; font-size: 12px; color: #666;">객관식은 보기 2~10개가 필요합니다.</span>
                    </div>
                </div>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:href="@{/survey/questionList(surveyId=${survey['surveyId']})}" class="krds-btn medium secondary">목록</a>
            <button type="button" id="saveBtn" class="krds-btn medium primary"
                    th:if="${survey['status'] == 'DRAFT'}"
                    th:text="${detail != null ? '수정' : '등록'}" onclick="fnSave()">저장</button>
        </div>
    </div>

    <script th:inline="javascript">
        var initialItems = /*[[${detail != null ? detail['items'] : null}]]*/ null;
        var MAX_ITEMS = 10;
        var MIN_ITEMS = 2;

        function itemRow(value) {
            var row = $('<div style="display: flex; gap: 6px; margin-bottom: 6px;"></div>');
            var input = $('<input type="text" class="krds-input item-txt" maxlength="500" style="flex: 1;" placeholder="보기 내용">');
            input.val(value || '');
            var remove = $('<button type="button" class="krds-btn small danger">삭제</button>');
            remove.on('click', function() {
                if ($('#itemRows .item-txt').length <= MIN_ITEMS) { alert('보기는 2개 이상 필요합니다.'); return; }
                row.remove();
            });
            row.append(input).append(remove);
            return row;
        }

        function fnAddItem(value) {
            if ($('#itemRows .item-txt').length >= MAX_ITEMS) { alert('보기는 10개까지 등록할 수 있습니다.'); return; }
            $('#itemRows').append(itemRow(value));
        }

        function fnToggleItems() {
            var isText = $('#questionType').val() === 'TEXT';
            $('#itemGroup').toggle(!isText);
        }

        $(function() {
            if (initialItems && initialItems.length > 0) {
                for (var i = 0; i < initialItems.length; i++) {
                    fnAddItem(initialItems[i]['itemTxt']);
                }
            } else {
                fnAddItem('');
                fnAddItem('');
            }
            fnToggleItems();
        });

        function fnSave() {
            var questionTxt = ($('#questionTxt').val() || '').trim();
            if (!questionTxt) { alert('질문을 입력하세요.'); return; }
            var questionType = $('#questionType').val();
            var items = [];
            if (questionType !== 'TEXT') {
                $('#itemRows .item-txt').each(function() {
                    var value = ($(this).val() || '').trim();
                    if (value) { items.push(value); }
                });
                if (items.length < MIN_ITEMS || items.length > MAX_ITEMS) {
                    alert('객관식 보기는 2~10개 입력하세요.');
                    return;
                }
            }
            var questionId = $('#questionId').val();
            var data = {
                surveyId: $('#surveyId').val(),
                questionId: questionId,
                questionTxt: questionTxt,
                questionType: questionType,
                requiredYn: $('#requiredYn').val(),
                'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val()
            };
            if (items.length > 0) { data.itemTxt = items; }
            $.ajax({
                type: 'post',
                url: questionId ? '/survey/updateQuestion.json' : '/survey/insertQuestion.json',
                data: data,
                traditional: true,
                beforeSend: function() { $('#saveBtn').prop('disabled', true); },
                complete: function() { $('#saveBtn').prop('disabled', false); },
                success: function(res) {
                    if (res.success) {
                        location.href = '/survey/questionList?surveyId=' + encodeURIComponent($('#surveyId').val());
                    } else {
                        alert(res.message || '저장에 실패했습니다.');
                    }
                },
                error: function() { alert('저장 중 오류가 발생했습니다.'); }
            });
        }
    </script>
</div>
</body>
</html>
