<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>설문템플릿</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">설문템플릿</h2>

    <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;">
        <a th:href="@{/survey/templateWrite}" class="krds-btn medium primary">등록</a>
    </div>

    <form id="listForm" method="get" th:action="@{/survey/templateList}">
        <input type="hidden" id="pageIndex" name="pageIndex" th:value="${pageIndex}">
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <select name="useYn" class="krds-form-select" style="width: 120px;">
                <option value="" th:selected="${useYn == ''}">전체</option>
                <option value="Y" th:selected="${useYn == 'Y'}">사용</option>
                <option value="N" th:selected="${useYn == 'N'}">중지</option>
            </select>
            <input type="text" name="searchKeyword" class="krds-input" style="flex: 1;"
                   placeholder="템플릿명·설명 검색" th:value="${searchKeyword}">
            <button type="submit" class="krds-btn medium secondary"
                    onclick="document.getElementById('pageIndex').value=1;">검색</button>
        </div>
    </form>

    <div class="krds-table-wrap">
        <table class="tbl col data">
            <caption>설문 템플릿 목록</caption>
            <colgroup>
                <col style="width: 26%;">
                <col>
                <col style="width: 10%;">
                <col style="width: 10%;">
                <col style="width: 10%;">
            </colgroup>
            <thead>
            <tr>
                <th scope="col">템플릿명</th>
                <th scope="col">설명</th>
                <th scope="col">사용 설문</th>
                <th scope="col">사용</th>
                <th scope="col">등록일</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${resultList}">
                <td><a th:href="@{/survey/templateWrite}" data-post th:attr="data-name='templateId',data-value=${item['templateId']}" th:text="${item['templateNm']}"></a></td>
                <td th:text="${item['description']}"></td>
                <td th:text="${item['surveyCnt']} + '건'"></td>
                <td th:text="${item['useYn'] == 'Y' ? '사용' : '중지'}"></td>
                <td th:text="${item['registDt'] != null ? #dates.format(item['registDt'], 'yyyy-MM-dd') : ''}"></td>
            </tr>
            <tr th:if="${resultList == null or resultList.isEmpty()}">
                <td colspan="5">조회된 템플릿이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div id="paging" class="krds-pagination w-page"
         th:utext="${#egovKrdsPaginationRenderer.renderPagination(paginationInfo, 'templatePaging')}"></div>
    <script>
        function templatePaging(pageIndex) {
            document.getElementById('pageIndex').value = pageIndex;
            document.getElementById('listForm').submit();
        }
    </script>
</div>
</body>
</html>
