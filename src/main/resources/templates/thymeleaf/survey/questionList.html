<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>설문 질문 관리</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">질문 관리</h2>

    <div class="conts-wrap" style="margin-bottom: 12px;">
        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
            <strong th:text="${survey['title']}"></strong>
            <span style="font-size: 12px; color: #666;"
                  th:text="${survey['startDe']} + ' ~ ' + ${survey['endDe']}"></span>
            <span th:switch="${survey['status']}" style="font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #eef3ff;">
                <span th:case="'DRAFT'">작성중</span>
                <span th:case="'OPEN'">공개</span>
                <span th:case="*">마감</span>
            </span>
            <a th:href="@{/survey/surveyWrite(surveyId=${survey['surveyId']})}" class="krds-btn small secondary">설문 정보</a>
            <a th:href="@{/survey/stats(surveyId=${survey['surveyId']})}" class="krds-btn small secondary">통계</a>
            <a th:href="@{/survey/surveyList}" class="krds-btn small secondary">목록</a>
            <a th:if="${survey['status'] == 'DRAFT'}"
               th:href="@{/survey/questionWrite(surveyId=${survey['surveyId']})}"
               class="krds-btn small primary">질문 추가</a>
        </div>
        <p th:if="${survey['status'] != 'DRAFT'}" style="margin: 8px 0 0; font-size: 12px; color: #a15c00;">
            공개된 설문은 질문·보기를 수정하거나 삭제할 수 없습니다.
        </p>
    </div>

    <div class="krds-table-wrap">
        <table class="tbl col data">
            <caption>질문 목록</caption>
            <colgroup>
                <col style="width: 6%;">
                <col style="width: 10%;">
                <col>
                <col style="width: 8%;">
                <col style="width: 12%;">
            </colgroup>
            <thead>
            <tr>
                <th scope="col">번호</th>
                <th scope="col">유형</th>
                <th scope="col">질문·보기</th>
                <th scope="col">필수</th>
                <th scope="col">관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="question : ${resultList}">
                <td th:text="${question['questionNo']}"></td>
                <td th:switch="${question['questionType']}">
                    <span th:case="'SINGLE'">단일선택</span>
                    <span th:case="'MULTI'">복수선택</span>
                    <span th:case="*">주관식</span>
                </td>
                <td>
                    <div th:text="${question['questionTxt']}"></div>
                    <ol th:if="${question['items'] != null and !question['items'].isEmpty()}"
                        style="margin: 6px 0 0 18px; padding: 0; font-size: 12px; color: #555;">
                        <li th:each="item : ${question['items']}" th:text="${item['itemTxt']}"></li>
                    </ol>
                </td>
                <td th:text="${question['requiredYn'] == 'Y' ? '필수' : '선택'}"></td>
                <td style="white-space: nowrap;" th:if="${survey['status'] == 'DRAFT'}">
                    <a th:href="@{/survey/questionWrite(questionId=${question['questionId']})}"
                       class="krds-btn small secondary">수정</a>
                    <button type="button" class="krds-btn small danger"
                            th:attr="data-id=${question['questionId']}" onclick="fnDelete(this)">삭제</button>
                </td>
                <td th:if="${survey['status'] != 'DRAFT'}">-</td>
            </tr>
            <tr th:if="${resultList == null or resultList.isEmpty()}">
                <td colspan="5">등록된 질문이 없습니다. 질문을 1개 이상 등록해야 공개할 수 있습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <script>
        function fnDelete(btn) {
            if (!confirm('질문과 보기를 삭제하시겠습니까?')) { return; }
            $.ajax({
                type: 'post', url: '/survey/deleteQuestion.json',
                data: { questionId: btn.getAttribute('data-id') },
                success: function(res) {
                    if (res.success) { location.reload(); }
                    else { alert(res.message || '삭제에 실패했습니다.'); }
                },
                error: function() { alert('삭제 중 오류가 발생했습니다.'); }
            });
        }
    </script>
</div>
</body>
</html>
