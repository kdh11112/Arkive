<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>설문관리</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">설문관리</h2>

    <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;">
        <a th:href="@{/survey/surveyWrite}" class="krds-btn medium primary">등록</a>
    </div>

    <form id="listForm" method="get" th:action="@{/survey/surveyList}">
        <input type="hidden" id="pageIndex" name="pageIndex" th:value="${pageIndex}">
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <select name="status" class="krds-form-select" style="width: 140px;">
                <option value="" th:selected="${status == ''}">전체 상태</option>
                <option value="DRAFT" th:selected="${status == 'DRAFT'}">작성중</option>
                <option value="OPEN" th:selected="${status == 'OPEN'}">공개</option>
                <option value="CLOSED" th:selected="${status == 'CLOSED'}">마감</option>
            </select>
            <input type="text" name="searchKeyword" class="krds-input" style="flex: 1;"
                   placeholder="설문 제목 검색" th:value="${searchKeyword}">
            <button type="submit" class="krds-btn medium secondary"
                    onclick="document.getElementById('pageIndex').value=1;">검색</button>
        </div>
    </form>

    <div class="krds-table-wrap">
        <table class="tbl col data">
            <caption>설문 목록</caption>
            <colgroup>
                <col style="width: 24%;">
                <col style="width: 14%;">
                <col style="width: 8%;">
                <col style="width: 8%;">
                <col style="width: 8%;">
                <col style="width: 14%;">
                <col>
            </colgroup>
            <thead>
            <tr>
                <th scope="col">제목</th>
                <th scope="col">기간</th>
                <th scope="col">질문</th>
                <th scope="col">참여</th>
                <th scope="col">상태</th>
                <th scope="col">템플릿</th>
                <th scope="col">관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${resultList}">
                <td><a th:href="@{/survey/surveyWrite}" data-post th:attr="data-name='surveyId',data-value=${item['surveyId']}" th:text="${item['title']}"></a></td>
                <td th:text="${item['startDe']} + ' ~ ' + ${item['endDe']}"></td>
                <td th:text="${item['questionCnt']} + '개'"></td>
                <td th:text="${item['participationCnt']} + '명'"></td>
                <td th:switch="${item['status']}">
                    <span th:case="'DRAFT'">작성중</span>
                    <span th:case="'OPEN'">공개</span>
                    <span th:case="*">마감</span>
                </td>
                <td th:text="${item['templateNm']}"></td>
                <td style="white-space: nowrap;">
                    <a th:href="@{/survey/questionList(surveyId=${item['surveyId']})}" class="krds-btn small secondary">질문</a>
                    <a th:href="@{/survey/stats(surveyId=${item['surveyId']})}" class="krds-btn small secondary">통계</a>
                    <button type="button" class="krds-btn small primary" th:if="${item['status'] == 'DRAFT'}"
                            th:attr="data-id=${item['surveyId']}" onclick="fnOpen(this)">공개</button>
                    <button type="button" class="krds-btn small secondary" th:if="${item['status'] == 'OPEN'}"
                            th:attr="data-id=${item['surveyId']}" onclick="fnClose(this)">마감</button>
                    <button type="button" class="krds-btn small danger" th:if="${item['status'] == 'DRAFT'}"
                            th:attr="data-id=${item['surveyId']}" onclick="fnDelete(this)">삭제</button>
                </td>
            </tr>
            <tr th:if="${resultList == null or resultList.isEmpty()}">
                <td colspan="7">조회된 설문이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div id="paging" class="krds-pagination w-page"
         th:utext="${#egovKrdsPaginationRenderer.renderPagination(paginationInfo, 'surveyPaging')}"></div>
    <script>
        function surveyPaging(pageIndex) {
            document.getElementById('pageIndex').value = pageIndex;
            document.getElementById('listForm').submit();
        }
        function fnOpen(btn) {
            if (!confirm('설문을 공개하시겠습니까? 공개 후에는 질문을 수정할 수 없습니다.')) { return; }
            postAction('/survey/openSurvey.json', btn.getAttribute('data-id'));
        }
        function fnClose(btn) {
            if (!confirm('설문을 마감하시겠습니까?')) { return; }
            postAction('/survey/closeSurvey.json', btn.getAttribute('data-id'));
        }
        function fnDelete(btn) {
            if (!confirm('삭제하시겠습니까?')) { return; }
            postAction('/survey/deleteSurvey.json', btn.getAttribute('data-id'));
        }
        function postAction(url, surveyId) {
            $.ajax({
                type: 'post', url: url, data: { surveyId: surveyId },
                success: function(res) {
                    if (res.success) { location.reload(); }
                    else { alert(res.message || '처리에 실패했습니다.'); }
                },
                error: function() { alert('처리 중 오류가 발생했습니다.'); }
            });
        }
    </script>
</div>
</body>
</html>
