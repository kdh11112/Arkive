<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>설문템플릿 등록</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large"><span th:text="${detail != null ? '설문템플릿 수정' : '설문템플릿 등록'}">설문템플릿 등록</span><div th:replace="~{cmm/doubleSubmit :: badge}"></div></h2>
    <div class="conts-wrap">
        <div class="fieldset input-form">
            <input type="hidden" id="templateId" th:value="${detail != null ? detail['templateId'] : ''}">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <div class="form-group">
                <div class="form-tit"><label for="templateNm">템플릿명</label></div>
                <div class="form-conts">
                    <input type="text" id="templateNm" class="krds-input" maxlength="200"
                           th:value="${detail != null ? detail['templateNm'] : ''}">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="description">설명</label></div>
                <div class="form-conts">
                    <textarea id="description" class="krds-input" rows="4" maxlength="1000"
                              style="width: 100%;" th:text="${detail != null ? detail['description'] : ''}"></textarea>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="useYn">사용여부</label></div>
                <div class="form-conts">
                    <select id="useYn" class="krds-form-select" style="width: 160px;">
                        <option value="Y" th:selected="${detail == null or detail['useYn'] == 'Y'}">사용</option>
                        <option value="N" th:selected="${detail != null and detail['useYn'] == 'N'}">중지</option>
                    </select>
                </div>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:href="@{/survey/templateList}" class="krds-btn medium secondary">목록</a>
            <button type="button" class="krds-btn medium danger" th:if="${detail != null}" onclick="fnDelete()">삭제</button>
            <button type="button" id="saveBtn" class="krds-btn medium primary"
                    th:text="${detail != null ? '수정' : '등록'}" onclick="fnSave()">저장</button>
        </div>
    </div>
    <script>
        function fnSave() {
            var templateId = $('#templateId').val();
            if (($('#templateNm').val() || '').trim() === '') { alert('템플릿명을 입력하세요.'); return; }
            $.ajax({
                type: 'post',
                url: templateId ? '/survey/updateTemplate.json' : '/survey/insertTemplate.json',
                data: {
                    templateId: templateId,
                    templateNm: $('#templateNm').val(),
                    description: $('#description').val(),
                    useYn: $('#useYn').val(),
                    'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val()
                },
                beforeSend: function() { $('#saveBtn').prop('disabled', true); },
                complete: function() { $('#saveBtn').prop('disabled', false); },
                success: function(res) {
                    if (res.success) { location.href = '/survey/templateList'; }
                    else { alert(res.message || '저장에 실패했습니다.'); }
                },
                error: function() { alert('저장 중 오류가 발생했습니다.'); }
            });
        }
        function fnDelete() {
            if (!confirm('삭제하시겠습니까?')) { return; }
            $.ajax({
                type: 'post',
                url: '/survey/deleteTemplate.json',
                data: { templateId: $('#templateId').val() },
                success: function(res) {
                    if (res.success) { location.href = '/survey/templateList'; }
                    else { alert(res.message || '삭제에 실패했습니다.'); }
                },
                error: function() { alert('삭제 중 오류가 발생했습니다.'); }
            });
        }
    </script>
</div>
</body>
</html>
