<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>주소록 등록</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large"><span th:text="${detail != null ? '주소록 수정' : '주소록 등록'}">주소록 등록</span><div th:replace="~{cmm/doubleSubmit :: badge}"></div></h2>
    <div class="conts-wrap">
        <div class="fieldset input-form">
            <input type="hidden" id="addrId" th:value="${detail != null ? detail['addrId'] : ''}">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <div class="form-group">
                <div class="form-tit"><label for="addrNm">이름</label></div>
                <div class="form-conts"><input type="text" id="addrNm" class="krds-input" maxlength="100" th:value="${detail != null ? detail['addrNm'] : ''}"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="deptNm">부서</label></div>
                <div class="form-conts"><input type="text" id="deptNm" class="krds-input" maxlength="100" th:value="${detail != null ? detail['deptNm'] : ''}"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="telNo">전화번호</label></div>
                <div class="form-conts"><input type="text" id="telNo" class="krds-input" maxlength="30" placeholder="02-123-4567" th:value="${detail != null ? detail['telNo'] : ''}"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="email">이메일</label></div>
                <div class="form-conts"><input type="text" id="email" class="krds-input" maxlength="100" th:value="${detail != null ? detail['email'] : ''}"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="memo">메모</label></div>
                <div class="form-conts"><textarea id="memo" class="krds-input" rows="4" style="width: 100%;" th:text="${detail != null ? detail['memo'] : ''}"></textarea></div>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:href="@{/address/addressList}" class="krds-btn medium secondary">목록</a>
            <button type="button" class="krds-btn medium danger" th:if="${detail != null}" onclick="fnDeleteAddress()">삭제</button>
            <button type="button" id="saveBtn" class="krds-btn medium primary" th:text="${detail != null ? '수정' : '등록'}" onclick="fnSaveAddress()">저장</button>
        </div>
    </div>
<script>
    function fnSaveAddress() {
        if (window._addressSaving) { return; }
        var nm = ($('#addrNm').val() || '').trim();
        if (nm === '') {
            alert('이름을 입력하세요.');
            $('#addrNm').focus();
            return;
        }
        var addrId = $('#addrId').val();
        var isUpdate = addrId !== '';
        $.ajax({
            type: 'post',
            url: isUpdate ? '/address/updateAddress.json' : '/address/insertAddress.json',
            data: { addrId: addrId, addrNm: nm, deptNm: $('#deptNm').val(), telNo: $('#telNo').val(), email: $('#email').val(), memo: $('#memo').val(), 'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val() },
            beforeSend: function() { window._addressSaving = true; $('#saveBtn').prop('disabled', true); },
            complete: function() { window._addressSaving = false; $('#saveBtn').prop('disabled', false); },
            success: function(res) {
                if (res.success) { location.href = '/address/addressList'; }
                else { alert(res.message || '저장에 실패했습니다.'); }
            },
            error: function() { alert('저장 중 오류가 발생했습니다.'); }
        });
    }
    function fnDeleteAddress() {
        if (!confirm('삭제하시겠습니까?')) { return; }
        $.ajax({
            type: 'post',
            url: '/address/deleteAddress.json',
            data: { addrId: $('#addrId').val() },
            success: function(res) {
                if (res.success) { location.href = '/address/addressList'; }
                else { alert(res.message || '삭제에 실패했습니다.'); }
            },
            error: function() { alert('삭제 중 오류가 발생했습니다.'); }
        });
    }
</script>
</div>
</body>
</html>
