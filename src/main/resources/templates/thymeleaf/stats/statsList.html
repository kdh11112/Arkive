<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>통계</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">통계
        <span class="help-tip" tabindex="0" role="img"
              aria-label="감사 로그 기준의 접속·로그인·다운로드 현황과 게시판 건수입니다. 막대는 카드 안에서 가장 큰 값을 100%로 두고 그린 비율입니다."
              data-tip="감사 로그 기준의 접속·로그인·다운로드 현황과 게시판 건수입니다. 막대는 카드 안에서 가장 큰 값을 100%로 두고 그린 비율입니다.">?</span>
    </h2>

    <form method="get" th:action="@{/stats/statsList}" style="display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 20px;">
        <input type="date" name="startDate" class="krds-input" style="width:160px;" th:value="${startDate}">
        <input type="date" name="endDate" class="krds-input" style="width:160px;" th:value="${endDate}">
        <button type="submit" class="krds-btn medium secondary">조회</button>
        <a th:href="@{/stats/downloadStatsExcel.do(startDate=${startDate},endDate=${endDate})}" class="krds-btn medium primary">엑셀</a>
    </form>

    <div class="stat-grid">
        <section class="stat-card">
            <div class="stat-card-head">
                <h3 class="stat-card-tit">게시판 건수</h3>
            </div>
            <p class="stat-card-unit">단위: 건 (전체 기간)</p>
            <div class="stat-chart" th:if="${boardStats != null and !boardStats.isEmpty()}">
                <div class="stat-bar-col" th:each="item : ${boardStats}" th:attr="data-value=${item['cnt']}">
                    <span class="stat-bar-val" th:text="${item['cnt']}">0</span>
                    <div class="stat-bar"></div>
                </div>
            </div>
            <div class="stat-axis" th:if="${boardStats != null and !boardStats.isEmpty()}">
                <span th:each="item : ${boardStats}" th:text="${item['boardType']}">CK</span>
            </div>
            <p class="stat-empty" th:if="${boardStats == null or boardStats.isEmpty()}">데이터 없음</p>
            <table class="tbl col data" th:if="${boardStats != null and !boardStats.isEmpty()}">
                <caption>게시판 건수</caption>
                <thead>
                <tr><th scope="col">게시판</th><th scope="col">건수</th></tr>
                </thead>
                <tbody>
                <tr th:each="item : ${boardStats}">
                    <td th:text="${item['boardType']}"></td>
                    <td th:text="${item['cnt']}"></td>
                </tr>
                </tbody>
            </table>
        </section>

        <section class="stat-card">
            <div class="stat-card-head">
                <h3 class="stat-card-tit">이벤트 건수</h3>
            </div>
            <p class="stat-card-unit">단위: 건 (조회 기간)</p>
            <div class="stat-chart" th:if="${eventStats != null and !eventStats.isEmpty()}">
                <div class="stat-bar-col" th:each="item : ${eventStats}" th:attr="data-value=${item['cnt']}">
                    <span class="stat-bar-val" th:text="${item['cnt']}">0</span>
                    <div class="stat-bar"></div>
                </div>
            </div>
            <div class="stat-axis" th:if="${eventStats != null and !eventStats.isEmpty()}">
                <span th:each="item : ${eventStats}" th:text="${item['eventType']}">LOGIN_SUCCESS</span>
            </div>
            <p class="stat-empty" th:if="${eventStats == null or eventStats.isEmpty()}">데이터 없음</p>
            <table class="tbl col data" th:if="${eventStats != null and !eventStats.isEmpty()}">
                <caption>이벤트 건수</caption>
                <thead>
                <tr><th scope="col">이벤트</th><th scope="col">건수</th></tr>
                </thead>
                <tbody>
                <tr th:each="item : ${eventStats}">
                    <td th:text="${item['eventType']}"></td>
                    <td th:text="${item['cnt']}"></td>
                </tr>
                </tbody>
            </table>
        </section>

        <section class="stat-card">
            <div class="stat-card-head">
                <h3 class="stat-card-tit">일별 로그인</h3>
            </div>
            <p class="stat-card-unit">단위: 건 (조회 기간)</p>
            <div class="stat-chart" th:if="${dailyLoginStats != null and !dailyLoginStats.isEmpty()}">
                <div class="stat-bar-col" th:each="item : ${dailyLoginStats}" th:attr="data-value=${item['cnt']}">
                    <span class="stat-bar-val" th:text="${item['cnt']}">0</span>
                    <div class="stat-bar"></div>
                </div>
            </div>
            <div class="stat-axis stat-axis-dense" th:if="${dailyLoginStats != null and !dailyLoginStats.isEmpty()}">
                <span th:each="item : ${dailyLoginStats}"
                      th:text="${item['statDate'] != null ? #dates.format(item['statDate'], 'MM-dd') : ''}">01-01</span>
            </div>
            <p class="stat-empty" th:if="${dailyLoginStats == null or dailyLoginStats.isEmpty()}">데이터 없음</p>
            <table class="tbl col data" th:if="${dailyLoginStats != null and !dailyLoginStats.isEmpty()}">
                <caption>일별 로그인</caption>
                <thead>
                <tr><th scope="col">일자</th><th scope="col">건수</th></tr>
                </thead>
                <tbody>
                <tr th:each="item : ${dailyLoginStats}">
                    <td th:text="${item['statDate'] != null ? #dates.format(item['statDate'], 'yyyy-MM-dd') : ''}"></td>
                    <td th:text="${item['cnt']}"></td>
                </tr>
                </tbody>
            </table>
        </section>

        <section class="stat-card">
            <div class="stat-card-head">
                <h3 class="stat-card-tit">일별 접속</h3>
            </div>
            <p class="stat-card-unit">단위: 건 (조회 기간)</p>
            <div class="stat-chart" th:if="${dailyAccessStats != null and !dailyAccessStats.isEmpty()}">
                <div class="stat-bar-col" th:each="item : ${dailyAccessStats}" th:attr="data-value=${item['cnt']}">
                    <span class="stat-bar-val" th:text="${item['cnt']}">0</span>
                    <div class="stat-bar"></div>
                </div>
            </div>
            <div class="stat-axis stat-axis-dense" th:if="${dailyAccessStats != null and !dailyAccessStats.isEmpty()}">
                <span th:each="item : ${dailyAccessStats}"
                      th:text="${item['statDate'] != null ? #dates.format(item['statDate'], 'MM-dd') : ''}">01-01</span>
            </div>
            <p class="stat-empty" th:if="${dailyAccessStats == null or dailyAccessStats.isEmpty()}">데이터 없음</p>
            <table class="tbl col data" th:if="${dailyAccessStats != null and !dailyAccessStats.isEmpty()}">
                <caption>일별 접속</caption>
                <thead>
                <tr><th scope="col">일자</th><th scope="col">건수</th></tr>
                </thead>
                <tbody>
                <tr th:each="item : ${dailyAccessStats}">
                    <td th:text="${item['statDate'] != null ? #dates.format(item['statDate'], 'yyyy-MM-dd') : ''}"></td>
                    <td th:text="${item['cnt']}"></td>
                </tr>
                </tbody>
            </table>
        </section>

        <section class="stat-card">
            <div class="stat-card-head">
                <h3 class="stat-card-tit">다운로드 현황</h3>
            </div>
            <p class="stat-card-unit">단위: 건 (조회 기간)</p>
            <div class="stat-chart" th:if="${downloadStats != null and !downloadStats.isEmpty()}">
                <div class="stat-bar-col" th:each="item : ${downloadStats}" th:attr="data-value=${item['cnt']}">
                    <span class="stat-bar-val" th:text="${item['cnt']}">0</span>
                    <div class="stat-bar"></div>
                </div>
            </div>
            <div class="stat-axis" th:if="${downloadStats != null and !downloadStats.isEmpty()}">
                <span th:each="item : ${downloadStats}"
                      th:text="${item['targetType'] != null ? item['targetType'] : '-'}">ADDRESS</span>
            </div>
            <p class="stat-empty" th:if="${downloadStats == null or downloadStats.isEmpty()}">데이터 없음</p>
            <table class="tbl col data" th:if="${downloadStats != null and !downloadStats.isEmpty()}">
                <caption>다운로드 현황</caption>
                <thead>
                <tr><th scope="col">대상</th><th scope="col">건수</th></tr>
                </thead>
                <tbody>
                <tr th:each="item : ${downloadStats}">
                    <td th:text="${item['targetType'] != null ? item['targetType'] : '-'}"></td>
                    <td th:text="${item['cnt']}"></td>
                </tr>
                </tbody>
            </table>
        </section>
    </div>

    <script>
        // 막대 높이: 카드마다 항목 중 가장 큰 값을 100%로 두고 비율로 그린다.
        // 0건도 보이도록 최소 2%는 남긴다.
        document.querySelectorAll('.stat-chart').forEach(function (chart) {
            var cols = chart.querySelectorAll('.stat-bar-col');
            var max = 0;
            cols.forEach(function (col) {
                var value = Number(col.getAttribute('data-value')) || 0;
                if (value > max) max = value;
            });
            cols.forEach(function (col) {
                var value = Number(col.getAttribute('data-value')) || 0;
                var bar = col.querySelector('.stat-bar');
                if (!bar) return;
                bar.style.height = (max > 0 ? Math.max(2, (value / max) * 100) : 2) + '%';
                bar.title = value + '건';
            });
        });
    </script>
</div>
</body>
</html>
