<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>강의 등록</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">
        <span th:text="${detail != null ? '강의 수정' : '강의 등록'}">강의 등록</span>
        <div th:replace="~{cmm/doubleSubmit :: badge}"></div>
    </h2>

    <div class="conts-wrap">
        <div th:if="${detail != null and detail['status'] != 'DRAFT'}"
             style="padding: 12px; margin-bottom: 12px; background: #f5f5f5; color: #555;">
            <span th:switch="${detail['status']}">
                <span th:case="'OPEN'">공개중인 강의입니다.</span>
                <span th:case="*">마감된 강의입니다.</span>
            </span>
            공개 후에는 내용과 동영상을 수정할 수 없습니다.
            <a th:href="@{/lecture/completionList(lectureId=${detail['lectureId']})}" class="krds-btn small secondary">수료현황</a>
        </div>

        <div class="fieldset input-form">
            <input type="hidden" id="lectureId" th:value="${detail != null ? detail['lectureId'] : ''}">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <div class="form-group">
                <div class="form-tit"><label for="title">제목</label></div>
                <div class="form-conts">
                    <input type="text" id="title" class="krds-input" maxlength="200"
                           th:value="${detail != null ? detail['title'] : ''}">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="description">설명</label></div>
                <div class="form-conts">
                    <textarea id="description" class="krds-input" rows="4" maxlength="2000"
                              style="width: 100%;" th:text="${detail != null ? detail['description'] : ''}"></textarea>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="video">동영상</label></div>
                <div class="form-conts">
                    <input type="file" id="video" accept="video/*">
                    <div th:if="${detail != null and detail['videoOriginalNm'] != null}"
                         style="font-size: 12px; color: #666; margin-top: 4px;"
                         th:text="'등록된 파일: ' + ${detail['videoOriginalNm']} + ' (' + ${detail['durationSec']} + '초)'"></div>
                    <div th:if="${encodingEnabled}" style="font-size: 12px; color: #666; margin-top: 4px;">
                        FFmpeg 인코딩이 켜져 있습니다. mp4/webm/mov/avi/mkv/m4v 업로드 시 mp4로 변환하며,
                        재생 길이는 인코딩 결과에서 읽습니다. 비워도 됩니다.
                    </div>
                    <div th:if="${!encodingEnabled}" style="font-size: 12px; color: #b45309; margin-top: 4px;">
                        인코딩이 꺼져 있어 mp4/webm만 저장합니다. 재생 길이(초)를 직접 입력하세요.
                    </div>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="durationSec">재생 길이(초)</label></div>
                <div class="form-conts">
                    <input type="number" id="durationSec" class="krds-input" min="0" style="width: 160px;"
                           th:value="${detail != null ? detail['durationSec'] : 0}">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="completeRate">수료 기준(%)</label></div>
                <div class="form-conts">
                    <input type="number" id="completeRate" class="krds-input" min="1" max="100" style="width: 160px;"
                           th:value="${detail != null ? detail['completeRate'] : 90}">
                    <span style="font-size: 12px; color: #666;">동영상을 이 비율까지 시청해야 영상 수료로 인정합니다.</span>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="surveyId">연결 설문</label></div>
                <div class="form-conts">
                    <select id="surveyId" class="krds-form-select" style="width: 100%; max-width: 480px;">
                        <option value="">연결 안 함</option>
                        <option th:each="survey : ${surveyList}" th:value="${survey['surveyId']}"
                                th:selected="${detail != null and detail['surveyId'] == survey['surveyId']}"
                                th:text="${survey['title']} + ' (' + ${survey['status']} + ')'"></option>
                    </select>
                    <div style="font-size: 12px; color: #666; margin-top: 4px;">
                        설문을 연결하면 참여까지 완료해야 수료로 인정합니다.
                    </div>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="useYn">사용여부</label></div>
                <div class="form-conts">
                    <select id="useYn" class="krds-form-select" style="width: 160px;">
                        <option value="Y" th:selected="${detail == null or detail['useYn'] == 'Y'}">사용</option>
                        <option value="N" th:selected="${detail != null and detail['useYn'] == 'N'}">중지</option>
                    </select>
                </div>
            </div>
        </div>

        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:href="@{/lecture/lectureList}" class="krds-btn medium secondary">목록</a>
            <button type="button" class="krds-btn medium danger"
                    th:if="${detail != null and detail['status'] == 'DRAFT'}" onclick="fnDelete()">삭제</button>
            <button type="button" id="saveBtn" class="krds-btn medium primary"
                    th:if="${detail == null or detail['status'] == 'DRAFT'}"
                    th:text="${detail != null ? '수정' : '등록'}" onclick="fnSave()">저장</button>
        </div>
    </div>

    <script th:inline="javascript">
        function fnSave() {
            var lectureId = $('#lectureId').val();
            var durationSec = parseInt($('#durationSec').val() || '0', 10);
            var file = $('#video')[0].files.length ? $('#video')[0].files[0] : null;
            var encodingEnabled = /*[[${encodingEnabled}]]*/ false;

            if (($('#title').val() || '').trim() === '') { alert('제목을 입력하세요.'); return; }
            if (!encodingEnabled && file && durationSec <= 0) {
                alert('인코딩이 꺼져 있으면 재생 길이(초)를 입력하세요.'); return;
            }

            var formData = new FormData();
            formData.append('lectureId', lectureId);
            formData.append('title', $('#title').val());
            formData.append('description', $('#description').val());
            formData.append('durationSec', durationSec);
            formData.append('completeRate', $('#completeRate').val());
            formData.append('surveyId', $('#surveyId').val());
            formData.append('useYn', $('#useYn').val());
            formData.append('egovframework.double.submit.preventer.parameter.name', $('#doubleSubmitToken').val());
            if (file) { formData.append('video', file); }

            $.ajax({
                type: 'post',
                url: lectureId ? '/lecture/updateLecture.json' : '/lecture/insertLecture.json',
                data: formData,
                processData: false,
                contentType: false,
                beforeSend: function() { $('#saveBtn').prop('disabled', true).text('저장 중...'); },
                complete: function() { $('#saveBtn').prop('disabled', false); },
                success: function(res) {
                    if (res.success) {
                        location.href = '/lecture/lectureWrite?lectureId=' + encodeURIComponent(res.id);
                    } else {
                        alert(res.message || '저장에 실패했습니다.');
                    }
                },
                error: function() { alert('저장 중 오류가 발생했습니다.'); }
            });
        }
        function fnDelete() {
            if (!confirm('강의와 등록된 동영상을 삭제하시겠습니까?')) { return; }
            $.ajax({
                type: 'post',
                url: '/lecture/deleteLecture.json',
                data: { lectureId: $('#lectureId').val() },
                success: function(res) {
                    if (res.success) { location.href = '/lecture/lectureList'; }
                    else { alert(res.message || '삭제에 실패했습니다.'); }
                },
                error: function() { alert('삭제 중 오류가 발생했습니다.'); }
            });
        }
    </script>
</div>
</body>
</html>
