<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>강의관리</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">강의관리</h2>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <p style="color: #555; margin: 0;">
            수료 기준은 동영상 시청 비율과 연결 설문 참여로 판정합니다.
            <span th:if="${!encodingEnabled}" style="color: #b45309;">(FFmpeg 인코딩 꺼짐: mp4/webm만 업로드, 재생 길이 직접 입력)</span>
        </p>
        <a th:href="@{/lecture/lectureWrite}" class="krds-btn medium primary">등록</a>
    </div>

    <form id="listForm" method="get" th:action="@{/lecture/lectureList}">
        <input type="hidden" id="pageIndex" name="pageIndex" th:value="${pageIndex}">
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <select name="status" class="krds-form-select" style="width: 140px;">
                <option value="" th:selected="${status == ''}">전체 상태</option>
                <option value="DRAFT" th:selected="${status == 'DRAFT'}">작성중</option>
                <option value="OPEN" th:selected="${status == 'OPEN'}">공개</option>
                <option value="CLOSED" th:selected="${status == 'CLOSED'}">마감</option>
            </select>
            <select name="useYn" class="krds-form-select" style="width: 120px;">
                <option value="" th:selected="${useYn == ''}">전체 사용</option>
                <option value="Y" th:selected="${useYn == 'Y'}">사용</option>
                <option value="N" th:selected="${useYn == 'N'}">중지</option>
            </select>
            <input type="text" name="searchKeyword" class="krds-input" style="flex: 1;"
                   placeholder="강의 제목 검색" th:value="${searchKeyword}">
            <button type="submit" class="krds-btn medium secondary"
                    onclick="document.getElementById('pageIndex').value=1;">검색</button>
        </div>
    </form>

    <div class="krds-table-wrap">
        <table class="tbl col data">
            <caption>강의 목록</caption>
            <colgroup>
                <col style="width: 24%;">
                <col style="width: 8%;">
                <col style="width: 8%;">
                <col style="width: 10%;">
                <col style="width: 12%;">
                <col style="width: 10%;">
                <col>
            </colgroup>
            <thead>
            <tr>
                <th scope="col">제목</th>
                <th scope="col">상태</th>
                <th scope="col">길이</th>
                <th scope="col">수료기준</th>
                <th scope="col">설문</th>
                <th scope="col">수강/수료</th>
                <th scope="col">관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${resultList}">
                <td>
                    <a th:href="@{/lecture/lectureWrite}" data-post
                       th:attr="data-name='lectureId',data-value=${item['lectureId']}"
                       th:text="${item['title']}"></a>
                    <div th:if="${item['videoOriginalNm'] != null}" th:text="${item['videoOriginalNm']}"
                         style="font-size: 12px; color: #888;"></div>
                </td>
                <td th:switch="${item['status']}">
                    <span th:case="'DRAFT'">작성중</span>
                    <span th:case="'OPEN'">공개</span>
                    <span th:case="*">마감</span>
                </td>
                <td th:text="${item['durationSec']} + '초'"></td>
                <td th:text="${item['completeRate']} + '%'"></td>
                <td>
                    <span th:if="${item['linkedSurveyId'] == null}" style="color: #888;">없음</span>
                    <span th:if="${item['linkedSurveyId'] != null}" th:text="${item['surveyTitle']}"></span>
                </td>
                <td th:text="${item['learnerCnt']} + ' / ' + ${item['completedCnt']}"></td>
                <td style="white-space: nowrap;">
                    <a th:href="@{/lecture/completionList(lectureId=${item['lectureId']})}"
                       class="krds-btn small secondary">수료현황</a>
                    <a th:if="${item['status'] == 'DRAFT'}" th:href="@{/lecture/lectureWrite}"
                       data-post th:attr="data-name='lectureId',data-value=${item['lectureId']}"
                       class="krds-btn small secondary">수정</a>
                    <button type="button" class="krds-btn small primary" th:if="${item['status'] == 'DRAFT'}"
                            th:attr="data-id=${item['lectureId']}" onclick="fnOpen(this)">공개</button>
                    <button type="button" class="krds-btn small secondary" th:if="${item['status'] == 'OPEN'}"
                            th:attr="data-id=${item['lectureId']}" onclick="fnClose(this)">마감</button>
                    <button type="button" class="krds-btn small danger" th:if="${item['status'] == 'DRAFT'}"
                            th:attr="data-id=${item['lectureId']}" onclick="fnDelete(this)">삭제</button>
                </td>
            </tr>
            <tr th:if="${resultList == null or resultList.isEmpty()}">
                <td colspan="7">조회된 강의가 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div id="paging" class="krds-pagination w-page"
         th:utext="${#egovKrdsPaginationRenderer.renderPagination(paginationInfo, 'lecturePaging')}"></div>
    <script>
        function lecturePaging(pageIndex) {
            document.getElementById('pageIndex').value = pageIndex;
            document.getElementById('listForm').submit();
        }
        function fnOpen(btn) {
            if (!confirm('강의를 공개하시겠습니까? 공개 후에는 내용과 동영상을 수정할 수 없습니다.')) { return; }
            postAction('/lecture/openLecture.json', btn.getAttribute('data-id'));
        }
        function fnClose(btn) {
            if (!confirm('강의를 마감하시겠습니까?')) { return; }
            postAction('/lecture/closeLecture.json', btn.getAttribute('data-id'));
        }
        function fnDelete(btn) {
            if (!confirm('강의와 등록된 동영상을 삭제하시겠습니까?')) { return; }
            postAction('/lecture/deleteLecture.json', btn.getAttribute('data-id'));
        }
        function postAction(url, lectureId) {
            $.ajax({
                type: 'post', url: url, data: { lectureId: lectureId },
                success: function(res) {
                    if (res.success) { location.reload(); }
                    else { alert(res.message || '처리에 실패했습니다.'); }
                },
                error: function() { alert('처리 중 오류가 발생했습니다.'); }
            });
        }
    </script>
</div>
</body>
</html>
