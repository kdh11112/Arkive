<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>사용자 등록</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large"><span th:text="${detail != null ? '사용자 수정' : '사용자 등록'}">사용자 등록</span><div th:replace="~{cmm/doubleSubmit :: badge}"></div></h2>
    <div class="conts-wrap">
        <div class="fieldset input-form">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <div class="form-group">
                <div class="form-tit"><label for="userId">아이디 (영문·숫자 4~20자)</label></div>
                <div class="form-conts"><input type="text" id="userId" class="krds-input" maxlength="20" th:value="${detail != null ? detail['userId'] : ''}" th:readonly="${detail != null}"></div>
            </div>
            <div class="form-group" th:if="${detail == null}">
                <div class="form-tit"><label for="password">비밀번호 (8자 이상)</label></div>
                <div class="form-conts"><input type="password" id="password" class="krds-input" maxlength="50" autocomplete="new-password"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="userNm">이름</label></div>
                <div class="form-conts"><input type="text" id="userNm" class="krds-input" maxlength="100" th:value="${detail != null ? detail['userNm'] : ''}"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="email">이메일</label></div>
                <div class="form-conts"><input type="text" id="email" class="krds-input" maxlength="100" th:value="${detail != null ? detail['email'] : ''}"></div>
            </div>
            <div class="form-group" th:if="${detail != null}">
                <div class="form-tit"><label for="useYn">사용여부</label></div>
                <div class="form-conts">
                    <select id="useYn" class="krds-form-select" style="width: 150px;">
                        <option value="Y" th:selected="${detail['useYn'] == 'Y'}">사용</option>
                        <option value="N" th:selected="${detail['useYn'] == 'N'}">미사용</option>
                    </select>
                </div>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:href="@{/auth/userList}" class="krds-btn medium secondary">목록</a>
            <button type="button" class="krds-btn medium danger" th:if="${detail != null}" onclick="fnDeleteUser()">삭제</button>
            <button type="button" id="saveBtn" class="krds-btn medium primary" th:text="${detail != null ? '수정' : '등록'}" onclick="fnSaveUser()">등록</button>
        </div>
    </div>
<script>
    function fnSaveUser() {
        if (window._userSaving) { return; }
        var userId = ($('#userId').val() || '').trim();
        if (userId === '') {
            alert('아이디를 입력하세요.');
            $('#userId').focus();
            return;
        }
        var isUpdate = $('#userId').prop('readonly');
        if (!isUpdate && (($('#password').val() || '').length < 8)) {
            alert('비밀번호는 8자 이상 입력하세요.');
            $('#password').focus();
            return;
        }
        if (($('#userNm').val() || '').trim() === '') {
            alert('이름을 입력하세요.');
            $('#userNm').focus();
            return;
        }
        $.ajax({
            type: 'post',
            url: isUpdate ? '/auth/updateUser.json' : '/auth/insertUser.json',
            data: { userId: userId, password: $('#password').val(), userNm: $('#userNm').val(), email: $('#email').val(), useYn: $('#useYn').val(), 'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val() },
            beforeSend: function() { window._userSaving = true; $('#saveBtn').prop('disabled', true); },
            complete: function() { window._userSaving = false; $('#saveBtn').prop('disabled', false); },
            success: function(res) {
                if (res.success) { location.href = '/auth/userList'; }
                else { alert(res.message || '저장에 실패했습니다.'); }
            },
            error: function(xhr) {
                if (xhr.status === 401) { alert('로그인이 필요합니다.'); location.href = '/login/login'; }
                else { alert('저장 중 오류가 발생했습니다.'); }
            }
        });
    }
    function fnDeleteUser() {
        if (!confirm('삭제하시겠습니까?')) { return; }
        $.ajax({
            type: 'post',
            url: '/auth/deleteUser.json',
            data: { userId: $('#userId').val() },
            success: function(res) {
                if (res.success) { location.href = '/auth/userList'; }
                else { alert(res.message || '삭제에 실패했습니다.'); }
            },
            error: function() { alert('삭제 중 오류가 발생했습니다.'); }
        });
    }
</script>
</div>
</body>
</html>
