<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/layout}">
<head>
    <meta charset="utf-8">
    <title>공지사항</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">공지사항</h2>

    <form id="listForm" method="post" th:action="@{/user/board/noticeList}">
        <input type="hidden" id="pageIndex" name="pageIndex" th:value="${pageIndex}">
        <div class="user-list-search">
            <label class="sr-only" for="noticeSearchKeyword">공지사항 검색어</label>
            <input type="text" id="noticeSearchKeyword" name="searchKeyword" class="krds-input" placeholder="제목 검색" th:value="${searchKeyword}">
            <button type="submit" class="krds-btn medium secondary" onclick="document.getElementById('pageIndex').value=1;">검색</button>
        </div>
    </form>

    <div class="krds-table-wrap">
        <table class="tbl col data">
            <caption>공지사항 목록</caption>
            <colgroup>
                <col style="width: 10%;">
                <col>
                <col style="width: 15%;">
                <col style="width: 10%;">
            </colgroup>
            <thead>
            <tr>
                <th scope="col">번호</th>
                <th scope="col">제목</th>
                <th scope="col">등록일</th>
                <th scope="col">조회수</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item, stat : ${resultList}">
                <td th:text="${paginationInfo.totalRecordCount + 1 - ((pageIndex - 1) * paginationInfo.recordCountPerPage + stat.count)}"></td>
                <td><a th:href="@{/user/board/noticeDetail}" data-post th:attr="data-name='boardId',data-value=${item['boardId']}" th:text="${item['title']}"></a></td>
                <td th:text="${item['registDt'] != null ? #dates.format(item['registDt'], 'yyyy-MM-dd') : ''}"></td>
                <td th:text="${item['viewCnt']}"></td>
            </tr>
            <tr th:if="${resultList == null or resultList.isEmpty()}">
                <td colspan="4">게시글이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div id="paging" class="krds-pagination w-page" th:utext="${#egovKrdsPaginationRenderer.renderPagination(paginationInfo, 'boardPaging')}"></div>
<script>
    function boardPaging(pageIndex) {
        document.getElementById('pageIndex').value = pageIndex;
        document.getElementById('listForm').submit();
    }
</script>
</div>
</body>
</html>
