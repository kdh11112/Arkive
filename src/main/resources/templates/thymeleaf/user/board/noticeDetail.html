<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/layout}">
<head>
    <meta charset="utf-8">
    <title>공지사항 상세보기</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">공지사항 상세보기</h2>
    <div class="conts-wrap" th:if="${detail != null}">
        <div class="fieldset input-form">
            <div class="form-group">
                <div class="form-tit">제목</div>
                <div class="form-conts"><p th:text="${detail['title']}"></p></div>
            </div>
            <div class="form-group">
                <div class="form-tit">등록일 · 조회수</div>
                <div class="form-conts"><p th:text="${detail['registDt'] != null ? #dates.format(detail['registDt'], 'yyyy-MM-dd HH:mm') : ''} + ' · ' + ${detail['viewCnt']}"></p></div>
            </div>
        </div>
        <hr>
        <div class="board-content" style="min-height: 200px; padding: 16px 0;" th:utext="${detail['content']}"></div>
        <hr>
        <div class="krds-table-wrap">
            <table class="tbl row data">
                <caption>이전글/다음글</caption>
                <tbody>
                <tr>
                    <th scope="row">다음글</th>
                    <td>
                        <a th:if="${next != null}" th:href="@{/user/board/noticeDetail}" data-post th:attr="data-name='boardId',data-value=${next['boardId']}" th:text="${next['title']}"></a>
                        <span th:if="${next == null}">다음글이 없습니다.</span>
                    </td>
                </tr>
                <tr>
                    <th scope="row">이전글</th>
                    <td>
                        <a th:if="${prev != null}" th:href="@{/user/board/noticeDetail}" data-post th:attr="data-name='boardId',data-value=${prev['boardId']}" th:text="${prev['title']}"></a>
                        <span th:if="${prev == null}">이전글이 없습니다.</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:href="@{/user/board/noticeList}" class="krds-btn medium secondary">목록</a>
        </div>
    </div>
</div>
</body>
</html>
