<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/layout}">
<head>
    <meta charset="utf-8">
    <title>Q&A 질문등록</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">Q&A 질문등록<div th:replace="~{cmm/doubleSubmit :: badge}"></div></h2>
    <div class="conts-wrap">
        <div class="fieldset input-form">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <div class="form-group">
                <div class="form-tit"><label for="title">질문</label></div>
                <div class="form-conts"><input type="text" id="title" class="krds-input"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="register">작성자 (미입력 시 익명)</label></div>
                <div class="form-conts"><input type="text" id="register" class="krds-input" maxlength="50"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="content">내용</label></div>
                <div class="form-conts"><textarea id="content" class="krds-input" rows="10" style="width: 100%;"></textarea></div>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:href="@{/user/qna/qnaList}" class="krds-btn medium secondary">목록</a>
            <button type="button" id="saveBtn" class="krds-btn medium primary" onclick="fnSaveQna()">등록</button>
        </div>
    </div>
<script>
    function fnSaveQna() {
        if (window._qnaSaving) { return; }
        var title = ($('#title').val() || '').trim();
        if (title === '') {
            alert('제목을 입력하세요.');
            $('#title').focus();
            return;
        }
        $.ajax({
            type: 'post',
            url: '/user/qna/insertQna.json',
            data: { title: title, content: $('#content').val(), register: $('#register').val(), 'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val() },
            beforeSend: function() { window._qnaSaving = true; $('#saveBtn').prop('disabled', true); },
            complete: function() { window._qnaSaving = false; $('#saveBtn').prop('disabled', false); },
            success: function(res) {
                if (res.success) { location.href = '/user/qna/qnaList'; }
                else { alert(res.message || '저장에 실패했습니다.'); }
            },
            error: function() { alert('저장 중 오류가 발생했습니다.'); }
        });
    }
</script>
</div>
</body>
</html>
