<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>POLL 등록</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large"><span th:text="${detail != null ? 'POLL 수정' : 'POLL 등록'}">POLL 등록</span><div th:replace="~{cmm/doubleSubmit :: badge}"></div></h2>
    <div class="conts-wrap">
        <div class="fieldset input-form">
            <input type="hidden" id="pollId" th:value="${detail != null ? detail['pollId'] : ''}">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <div class="form-group">
                <div class="form-tit"><label for="title">제목</label></div>
                <div class="form-conts"><input type="text" id="title" class="krds-input" th:value="${detail != null ? detail['title'] : ''}"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="items">보기 (한 줄에 하나, 2~10개. 수정 시 득표 초기화됨)</label></div>
                <div class="form-conts"><textarea id="items" class="krds-input" rows="6" style="width: 100%;" th:text="${itemsText}"></textarea></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="startYmd">투표기간</label></div>
                <div class="form-conts" style="display: flex; flex-direction: row; gap: 8px; align-items: center; flex-wrap: nowrap;">
                    <input type="date" id="startYmd" class="krds-input" style="flex: 1; min-width: 0;" onclick="this.showPicker()" th:value="${detail != null ? #strings.substring(detail['startYmd'],0,4) + '-' + #strings.substring(detail['startYmd'],4,6) + '-' + #strings.substring(detail['startYmd'],6,8) : ''}">
                    <span>~</span>
                    <input type="date" id="endYmd" class="krds-input" style="flex: 1; min-width: 0;" onclick="this.showPicker()" th:value="${detail != null ? #strings.substring(detail['endYmd'],0,4) + '-' + #strings.substring(detail['endYmd'],4,6) + '-' + #strings.substring(detail['endYmd'],6,8) : ''}">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="useYn">사용여부</label></div>
                <div class="form-conts">
                    <select id="useYn" class="krds-form-select">
                        <option value="Y" th:selected="${detail == null or detail['useYn'] == 'Y'}">진행</option>
                        <option value="N" th:selected="${detail != null and detail['useYn'] == 'N'}">중지</option>
                    </select>
                </div>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:href="@{/poll/pollList}" class="krds-btn medium secondary">목록</a>
            <button type="button" class="krds-btn medium danger" th:if="${detail != null}" onclick="fnDeletePoll()">삭제</button>
            <button type="button" id="saveBtn" class="krds-btn medium primary" th:text="${detail != null ? '수정' : '등록'}" onclick="fnSavePoll()">저장</button>
        </div>
    </div>
<script>
    function fnSavePoll() {
        if (window._pollSaving) { return; }
        var title = ($('#title').val() || '').trim();
        if (title === '') {
            alert('제목을 입력하세요.');
            $('#title').focus();
            return;
        }
        var pollId = $('#pollId').val();
        var isUpdate = pollId !== '';
        if (isUpdate && !confirm('수정 시 보기가 재등록되어 기존 득표가 초기화됩니다. 계속하시겠습니까?')) { return; }
        $.ajax({
            type: 'post',
            url: isUpdate ? '/poll/updatePoll.json' : '/poll/insertPoll.json',
            data: { pollId: pollId, title: title, items: $('#items').val(), startYmd: $('#startYmd').val(), endYmd: $('#endYmd').val(), useYn: $('#useYn').val(), 'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val() },
            beforeSend: function() { window._pollSaving = true; $('#saveBtn').prop('disabled', true); },
            complete: function() { window._pollSaving = false; $('#saveBtn').prop('disabled', false); },
            success: function(res) {
                if (res.success) { location.href = '/poll/pollList'; }
                else { alert(res.message || '저장에 실패했습니다.'); }
            },
            error: function() { alert('저장 중 오류가 발생했습니다.'); }
        });
    }
    function fnDeletePoll() {
        if (!confirm('보기와 득표를 포함해 삭제하시겠습니까?')) { return; }
        $.ajax({
            type: 'post',
            url: '/poll/deletePoll.json',
            data: { pollId: $('#pollId').val() },
            success: function(res) {
                if (res.success) { location.href = '/poll/pollList'; }
                else { alert(res.message || '삭제에 실패했습니다.'); }
            },
            error: function() { alert('삭제 중 오류가 발생했습니다.'); }
        });
    }
</script>
</div>
</body>
</html>
