<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>조회수 통계</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">조회수 통계</h2>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <p style="margin: 0; color: #555;">
            최근 14일 동안 집계된 조회수입니다. 게시글 1건은 브라우저당 24시간에 한 번만 집계됩니다.
        </p>
        <a th:href="@{/board/ckeditorList}" class="krds-btn medium secondary">공지사항관리</a>
    </div>

    <!-- 그래프: 일별 조회수 막대. 별도 차트 라이브러리 없이 CSS 높이로 그린다. -->
    <div class="krds-table-wrap" style="padding: 20px 16px 8px;">
        <div style="display: flex; align-items: flex-end; gap: 8px; height: 240px; border-bottom: 1px solid #d1d5db;">
            <div th:each="point : ${dailyStats}"
                 style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; text-align: center;">
                <span style="font-size: 11px; color: #374151;" th:text="${point['count']}">0</span>
                <div th:style="'width: 100%; background: #2563eb; border-radius: 3px 3px 0 0; height: ' + ${point['heightPct']} + '%; min-height: 2px;'"
                     th:title="${point['label']} + ' · ' + ${point['count']}"></div>
            </div>
        </div>
        <div style="display: flex; gap: 8px; margin-top: 6px;">
            <span th:each="point : ${dailyStats}"
                  style="flex: 1; text-align: center; font-size: 11px; color: #374151;"
                  th:text="${point['label']}">10-25</span>
        </div>
    </div>

    <!-- 그래프 아래 숫자 표 -->
    <div class="krds-table-wrap" style="margin-top: 20px;">
        <table class="tbl col data">
            <caption>일별 조회수</caption>
            <colgroup>
                <col style="width: 40%;">
                <col>
            </colgroup>
            <thead>
            <tr>
                <th scope="col">일자</th>
                <th scope="col">조회수</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="point : ${dailyStats}">
                <td th:text="${point['label']}">10-25</td>
                <td th:text="${point['count']}">0</td>
            </tr>
            <tr>
                <th scope="row">합계(14일)</th>
                <td th:text="${dailyTotal}">0</td>
            </tr>
            </tbody>
        </table>
    </div>

    <h3 class="heading-medium" style="margin-top: 28px;">게시글별 누적 조회수</h3>
    <div class="krds-table-wrap">
        <table class="tbl col data">
            <caption>게시글별 누적 조회수</caption>
            <colgroup>
                <col style="width: 8%;">
                <col style="width: 10%;">
                <col>
                <col style="width: 12%;">
                <col style="width: 15%;">
            </colgroup>
            <thead>
            <tr>
                <th scope="col">순위</th>
                <th scope="col">구분</th>
                <th scope="col">제목</th>
                <th scope="col">조회수</th>
                <th scope="col">등록일</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item, stat : ${boardRank}">
                <td th:text="${stat.count}">1</td>
                <td th:text="${item['boardType'] == 'CK' ? '공지' : '자료실'}">공지</td>
                <td>
                    <a th:href="@{/board/detail(boardId=${item['boardId']})}" th:text="${item['title']}">제목</a>
                </td>
                <td th:text="${item['viewCnt']}">0</td>
                <td th:text="${item['registDt'] != null ? #dates.format(item['registDt'], 'yyyy-MM-dd') : ''}">2026-11-07</td>
            </tr>
            <tr th:if="${boardRank == null or boardRank.isEmpty()}">
                <td colspan="5">게시글이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
