<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title th:text="${detail != null ? '자료실 수정 (토스트 에디터)' : '자료실 등록 (토스트 에디터)'}">자료실 등록</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large"><span th:text="${detail != null ? '자료실 수정 (토스트 에디터)' : '자료실 등록 (토스트 에디터)'}">자료실 등록</span><div th:replace="~{cmm/doubleSubmit :: badge}"></div></h2>
    <div class="conts-wrap">
        <div class="fieldset input-form">
            <input type="hidden" id="boardId" th:value="${detail != null ? detail['boardId'] : ''}">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <input type="hidden" id="initContent" th:value="${detail != null ? detail['content'] : ''}">
            <div class="form-group">
                <div class="form-tit"><label for="title">제목</label></div>
                <div class="form-conts"><input type="text" id="title" class="krds-input" th:value="${detail != null ? detail['title'] : ''}"></div>
            </div>
            <div class="form-group" th:if="${isAdmin}">
                <div class="form-tit">중요글</div>
                <div class="form-conts">
                    <label style="display: flex; align-items: center; gap: 6px; font-size: 14px;">
                        <input type="checkbox" id="importantYn" th:checked="${detail != null and detail['importantYn'] == 'Y'}">
                        <span>중요글로 지정하고 메일 알림을 보냅니다. (게시글당 1회)</span>
                    </label>
                    <p style="font-size: 12px; color: #666; margin-top: 4px;">메일 수신에 동의한 사용자에게만 발송되며, 이후 수정해도 다시 발송되지 않습니다.</p>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="editor">내용 (HWP에서 복사 후 Ctrl+V, 이미지는 에디터에 바로 붙여넣기)</label></div>
                <div class="form-conts">
                    <div style="margin-bottom: 4px;"><span id="charCount">0 / 4000자</span></div>
                    <!-- 임시저장 안내. confirm 대신 배너로 알리고 사용자가 불러오기/무시를 고른다. -->
                    <div id="draftNotice" style="display: none; align-items: center; gap: 8px; margin-bottom: 8px; padding: 8px 12px; border: 1px solid #d5dbe3; border-radius: 6px; background: #f7f9fc; font-size: 13px; color: #333;">
                        <span>작성 중인 임시저장본이 있습니다. <span id="draftSavedAt"></span></span>
                        <button type="button" id="draftLoad" class="krds-btn small secondary">불러오기</button>
                        <button type="button" id="draftDiscard" class="krds-btn small tertiary">무시</button>
                    </div>
                    <div id="editor"></div>
                </div>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:href="@{/board/toastList}" class="krds-btn medium secondary">목록</a>
            <button type="button" id="saveBtn" class="krds-btn medium primary" th:text="${detail != null ? '수정' : '등록'}" onclick="fnSaveBoard()">저장</button>
        </div>
    </div>
<link rel="stylesheet" th:href="@{/vendor/toast-ui/toastui-editor.min.css}">
<script th:src="@{/vendor/toast-ui/toastui-editor-all.min.js}"></script>
<script th:src="@{/vendor/toast-ui/i18n/ko-kr.js}"></script>
<script>
    var toastEditor = new toastui.Editor({
        el: document.querySelector('#editor'),
        height: '400px',
        initialEditType: 'wysiwyg',
        previewStyle: 'vertical',
        language: 'ko-KR',
        initialValue: document.getElementById('initContent').value || '',
        hooks: {
            addImageBlobHook: function(blob, callback) {
                var fd = new FormData();
                fd.append('upload', blob);
                $.ajax({
                    type: 'POST', url: '/board/editorImageUpload.json', data: fd,
                    processData: false, contentType: false,
                    success: function(res) { callback(res.url, 'image'); },
                    error: function() { alert('이미지 업로드에 실패했습니다.'); }
                });
            }
        }
    });

    // 글자수 제한·임시저장 (제목 제외 본문 순수 텍스트 기준)
    var BOARD_MAX_CHARS = 4000;
    var DRAFT_KEY = 'boardDraft_TOAST_' + ($('#boardId').val() || 'new');
    function plainText(html) {
        var d = document.createElement('div');
        d.innerHTML = html || '';
        return (d.textContent || '').replace(/\s+/g, ' ').trim();
    }
    function updateCharCount() {
        var n = plainText(toastEditor.getHTML()).length;
        $('#charCount').text(n + ' / ' + BOARD_MAX_CHARS + '자');
        return n;
    }
    // 임시저장은 편집이 멈춘 뒤에만 한다. 화면을 열어보기만 해도 초안이 쌓이던 문제를 막는다.
    var DRAFT_DELAY_MS = 2000;
    var DRAFT_TTL_MS = 7 * 24 * 60 * 60 * 1000;
    var draftTimer = null;
    var lastDraftJson = null;
    function currentDraft() {
        return { title: $('#title').val() || '', content: toastEditor.getHTML() };
    }
    function saveDraft() {
        var d = currentDraft();
        // 빈 화면은 초안으로 남기지 않는다.
        if (!d.title.trim() && !plainText(d.content)) return;
        var json = JSON.stringify(d);
        // 직전 저장과 같으면 쓰지 않는다.
        if (json === lastDraftJson) return;
        lastDraftJson = json;
        try {
            localStorage.setItem(DRAFT_KEY, JSON.stringify({
                title: d.title,
                content: d.content,
                savedAt: Date.now()
            }));
        } catch (e) { /* 저장소 full 등 무시 */ }
    }
    function scheduleSaveDraft() {
        clearTimeout(draftTimer);
        draftTimer = setTimeout(saveDraft, DRAFT_DELAY_MS);
    }
    function hideDraftNotice() {
        $('#draftNotice').hide();
    }
    function restoreDraft() {
        var raw = null;
        try { raw = localStorage.getItem(DRAFT_KEY); } catch (e) { return; }
        if (!raw) return;
        var d = null;
        try { d = JSON.parse(raw); } catch (e) { d = null; }
        // 파손된 초안·만료된 초안·빈 초안은 버린다.
        if (!d || !d.savedAt || (Date.now() - d.savedAt) > DRAFT_TTL_MS
            || (!d.title && !plainText(d.content))) {
            try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* 무시 */ }
            return;
        }
        if (d.title === ($('#title').val() || '') && plainText(d.content) === plainText(currentDraft().content)) return;
        $('#draftSavedAt').text(new Date(d.savedAt).toLocaleString());
        $('#draftLoad').off('click').on('click', function () {
            $('#title').val(d.title || '');
            toastEditor.setHTML(d.content || '');
            lastDraftJson = JSON.stringify({ title: $('#title').val() || '', content: toastEditor.getHTML() });
            hideDraftNotice();
        });
        $('#draftDiscard').off('click').on('click', function () {
            try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* 무시 */ }
            hideDraftNotice();
        });
        $('#draftNotice').css('display', 'flex');
    }
    toastEditor.on('change', function () {
        updateCharCount();
        scheduleSaveDraft();
    });
    $('#title').on('input', scheduleSaveDraft);
    restoreDraft();
    updateCharCount();

    function fnSaveBoard() {
        if (window._boardSaving) { return; }
        var title = ($('#title').val() || '').trim();
        if (title === '') {
            alert('제목을 입력하세요.');
            $('#title').focus();
            return;
        }
        var boardId = $('#boardId').val();
        var isUpdate = boardId !== '';
        var chars = updateCharCount();
        if (chars > BOARD_MAX_CHARS) {
            alert('본문이 ' + BOARD_MAX_CHARS + '자를 초과했습니다. (현재 ' + chars + '자)');
            return;
        }
        $.ajax({
            type: 'post',
            url: isUpdate ? '/board/updateBoard.json' : '/board/insertBoard.json',
            data: { boardId: boardId, boardType: 'TOAST', title: title, content: toastEditor.getHTML(), atchFileGrpid: '', importantYn: $('#importantYn').is(':checked') ? 'Y' : 'N', 'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val() },
            beforeSend: function() { window._boardSaving = true; $('#saveBtn').prop('disabled', true); },
            complete: function() { window._boardSaving = false; $('#saveBtn').prop('disabled', false); },
            success: function(res) {
                if (res.success) { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} location.href = '/board/toastList'; }
                else { alert(res.message || '저장에 실패했습니다.'); }
            },
            error: function() { alert('저장 중 오류가 발생했습니다.'); }
        });
    }
</script>
</div>
</body>
</html>
