<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>게시글 상세보기</title>
</head>
<body>
<div layout:fragment="content">
    <style>
        /* HWP 복붙 대응: 큰 이미지·표가 영역을 깨고 넘치지 않게 강제 */
        .board-content img { max-width: 100% !important; height: auto !important; }
        .board-content iframe { max-width: 100%; }
        .board-content figure.table { overflow-x: auto; max-width: 100%; }
        .board-content table { max-width: 100%; }
        .board-content * { overflow-wrap: anywhere; }
        /* 댓글: 1단, 로그인 사용자만 작성. 본문은 th:text로 이스케이프한다. */
        .comment-wrap { margin-top: 8px; }
        .comment-list { list-style: none; padding: 0; margin: 0; }
        .comment-item { padding: 12px 0; border-bottom: 1px solid #ddd; }
        .comment-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .comment-head span { color: #666; font-size: 13px; }
        .comment-body { white-space: pre-wrap; overflow-wrap: anywhere; }
        .comment-empty { padding: 16px 0; color: #666; }
        .comment-write { display: flex; gap: 8px; margin-top: 12px; align-items: flex-start; }
        .comment-write textarea { flex: 1; min-height: 70px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
    </style>
    <h2 class="heading-large">
        <span class="krds-badge" th:if="${detail != null and detail['noticeYn'] == 'Y'}">공지</span>
        <span class="krds-badge" th:if="${detail != null and detail['importantYn'] == 'Y'}">중요</span>
        <span th:text="${detail != null ? detail['title'] : '게시글'}">게시글</span>
    </h2>
    <div class="conts-wrap">
        <div class="krds-table-wrap" th:if="${detail != null}">
            <table class="tbl row data">
                <caption>게시글 정보</caption>
                <colgroup>
                    <col style="width: 15%;">
                    <col>
                    <col style="width: 15%;">
                    <col>
                </colgroup>
                <tbody>
                <tr>
                    <th scope="row">구분</th>
                    <td th:text="${detail['boardType'] == 'CK' ? '공지사항' : '자료실'}"></td>
                    <th scope="row">조회수</th>
                    <td th:text="${detail['viewCnt']}"></td>
                </tr>
                <tr>
                    <th scope="row">등록일</th>
                    <td colspan="3" th:text="${detail['registDt'] != null ? #dates.format(detail['registDt'], 'yyyy-MM-dd HH:mm') : ''}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <!-- 에디터 HTML 그대로 표시. 운영 전 서버 sanitize 필요 -->
        <div class="board-content" style="min-height: 200px; padding: 16px 0;" th:if="${detail != null}" th:utext="${detail['content']}"></div>
        <hr>
        <div class="krds-table-wrap">
            <table class="tbl row data">
                <caption>이전글/다음글</caption>
                <colgroup>
                    <col style="width: 15%;">
                    <col>
                </colgroup>
                <tbody>
                <tr>
                    <th scope="row">다음글</th>
                    <td>
                        <a th:if="${next != null}" th:href="@{/board/detail}" data-post th:attr="data-name='boardId',data-value=${next['boardId']}" th:text="${next['title']}"></a>
                        <span th:if="${next == null}">다음글이 없습니다.</span>
                    </td>
                </tr>
                <tr>
                    <th scope="row">이전글</th>
                    <td>
                        <a th:if="${prev != null}" th:href="@{/board/detail}" data-post th:attr="data-name='boardId',data-value=${prev['boardId']}" th:text="${prev['title']}"></a>
                        <span th:if="${prev == null}">이전글이 없습니다.</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="comment-wrap" th:if="${detail != null}">
            <h3 class="heading-medium">댓글 <span th:text="${commentCount != null ? commentCount : 0}">0</span></h3>
            <ul class="comment-list" th:if="${commentList != null and !commentList.isEmpty()}">
                <li class="comment-item" th:each="c : ${commentList}">
                    <div class="comment-head">
                        <strong th:text="${c['registerNm']}">작성자</strong>
                        <span th:text="${c['registDt'] != null ? #dates.format(c['registDt'], 'yyyy-MM-dd HH:mm') : ''}">2026-01-01 00:00</span>
                        <button type="button" class="krds-btn small tertiary"
                                th:if="${session.ADMIN_USER != null or (session.LOGIN_USER != null and #strings.equals(session.LOGIN_USER['userId'], c['register']))}"
                                th:attr="data-comment-id=${c['commentId']}"
                                onclick="fnDeleteComment(this)">삭제</button>
                    </div>
                    <div class="comment-body" th:text="${c['content']}">댓글 내용</div>
                </li>
            </ul>
            <p class="comment-empty" th:if="${commentList == null or commentList.isEmpty()}">등록된 댓글이 없습니다.</p>
            <div class="comment-write">
                <textarea id="commentContent" maxlength="1000" rows="3" placeholder="댓글을 입력하세요. (1000자 이내)"></textarea>
                <button type="button" id="commentSubmit" class="krds-btn medium primary" onclick="fnInsertComment()">등록</button>
            </div>
        </div>
        <hr>
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:if="${detail != null and detail['boardType'] == 'CK'}" th:href="@{/board/ckeditorList}" class="krds-btn medium secondary">목록</a>
            <a th:if="${detail != null and detail['boardType'] == 'TOAST'}" th:href="@{/board/toastList}" class="krds-btn medium secondary">목록</a>
            <a th:if="${detail != null and detail['boardType'] == 'CK'}" th:href="@{/board/ckeditorWrite}" data-post th:attr="data-name='boardId',data-value=${detail['boardId']}" class="krds-btn medium secondary">수정</a>
            <a th:if="${detail != null and detail['boardType'] == 'TOAST'}" th:href="@{/board/toastWrite}" data-post th:attr="data-name='boardId',data-value=${detail['boardId']}" class="krds-btn medium secondary">수정</a>
            <button type="button" class="krds-btn medium danger" onclick="fnDelete()">삭제</button>
        </div>
    </div>
<script th:inline="javascript">
    // 기존 저장분에 남은 <oembed>를 유튜브 iframe으로 변환한다.
    // 신규 저장분은 에디터 mediaEmbed.previewsInData로 iframe이 함께 저장된다.
    (function() {
        document.querySelectorAll('.board-content oembed[url]').forEach(function(el) {
            var url = el.getAttribute('url') || '';
            var m = url.match(/[?&]v=([^&#]+)/) || url.match(/youtu\.be\/([^?&#]+)/) || url.match(/youtube\.com\/embed\/([^?&#]+)/);
            if (!m) return;
            var f = document.createElement('iframe');
            f.src = 'https://www.youtube.com/embed/' + m[1];
            f.width = '100%';
            f.height = '400';
            f.setAttribute('frameborder', '0');
            f.setAttribute('allowfullscreen', '');
            el.replaceWith(f);
        });
    })();
    function fnDelete() {
        if (!confirm('삭제하시겠습니까?')) return;
        var boardId = /*[[${detail != null ? detail['boardId'] : ''}]]*/ '';
        $.post('/board/deleteBoard.json', { boardId: boardId }, function(res) {
            if (res.success) {
                var isCk = /*[[${detail != null and detail['boardType'] == 'CK'}]]*/ false;
                location.href = isCk ? '/board/ckeditorList' : '/board/toastList';
            } else { alert(res.message || '삭제에 실패했습니다.'); }
        });
    }
    // 댓글 등록. 성공 시 새로고침해 목록·건수를 서버 값으로 다시 그린다.
    function fnInsertComment() {
        var content = $('#commentContent').val();
        if (!content || !content.trim()) {
            alert('댓글 내용을 입력하세요.');
            return;
        }
        var boardId = /*[[${detail != null ? detail['boardId'] : ''}]]*/ '';
        var $btn = $('#commentSubmit');
        if ($btn.prop('disabled')) return;
        $btn.prop('disabled', true);
        $.post('/board/insertComment.json', { boardId: boardId, content: content }, function(res) {
            if (res.success) {
                location.reload();
            } else {
                $btn.prop('disabled', false);
                alert(res.message || '댓글 등록에 실패했습니다.');
            }
        }).fail(function() {
            $btn.prop('disabled', false);
            alert('댓글 등록에 실패했습니다.');
        });
    }
    // 댓글 삭제. 작성자 또는 관리자에게만 버튼이 보인다.
    function fnDeleteComment(btn) {
        if (!confirm('댓글을 삭제하시겠습니까?')) return;
        var commentId = btn.getAttribute('data-comment-id');
        if (!commentId) return;
        $(btn).prop('disabled', true);
        $.post('/board/deleteComment.json', { commentId: commentId }, function(res) {
            if (res.success) {
                location.reload();
            } else {
                $(btn).prop('disabled', false);
                alert(res.message || '댓글 삭제에 실패했습니다.');
            }
        }).fail(function() {
            $(btn).prop('disabled', false);
            alert('댓글 삭제에 실패했습니다.');
        });
    }
</script>
</div>
</body>
</html>
