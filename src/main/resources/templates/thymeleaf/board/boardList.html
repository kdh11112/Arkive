<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>게시판 목록</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large" th:text="${boardType == 'CK' ? '공지사항관리' : '자료실관리'}">게시판</h2>

    <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;">
        <a th:href="${boardType == 'CK' ? '/board/ckeditorWrite' : '/board/toastWrite'}" class="krds-btn medium primary">등록</a>
    </div>

    <!-- CK: 전자정부 오프셋 페이징(서버 렌더 + KRDS 블록) -->
    <th:block th:if="${boardType == 'CK'}">
    <form id="listForm" method="post" th:action="@{/board/ckeditorList}">
        <input type="hidden" id="pageIndex" name="pageIndex" th:value="${pageIndex}">
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <input type="text" name="searchKeyword" class="krds-input" style="flex: 1;" placeholder="제목 검색" th:value="${searchKeyword}">
            <button type="submit" class="krds-btn medium secondary" onclick="document.getElementById('pageIndex').value=1;">검색</button>
        </div>
    </form>
    <div class="krds-table-wrap">
        <table class="tbl col data">
            <caption>공지사항 목록</caption>
            <colgroup>
                <col style="width: 10%;">
                <col>
                <col style="width: 15%;">
                <col style="width: 10%;">
            </colgroup>
            <thead>
            <tr>
                <th scope="col">번호</th>
                <th scope="col">제목</th>
                <th scope="col">등록일</th>
                <th scope="col">조회수</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item, stat : ${resultList}">
                <td th:text="${paginationInfo.totalRecordCount + 1 - ((pageIndex - 1) * paginationInfo.recordCountPerPage + stat.count)}"></td>
                <td><a th:href="@{/board/detail}" data-post th:attr="data-name='boardId',data-value=${item['boardId']}" th:text="${item['title']}"></a></td>
                <td th:text="${item['registDt'] != null ? #dates.format(item['registDt'], 'yyyy-MM-dd') : ''}"></td>
                <td th:text="${item['viewCnt']}"></td>
            </tr>
            <tr th:if="${resultList == null or resultList.isEmpty()}">
                <td colspan="4">게시글이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>
    <div id="paging" class="krds-pagination w-page" th:utext="${#egovKrdsPaginationRenderer.renderPagination(paginationInfo, 'boardPaging')}"></div>
    </th:block>

    <!-- TOAST: 커서(키셋)+더보기(AJAX 렌더). 번호는 불러온 순서대로 매긴다 -->
    <th:block th:if="${boardType == 'TOAST'}">
    <div style="display: flex; gap: 8px; margin-bottom: 12px;">
        <input type="text" id="toastKeyword" class="krds-input" style="flex: 1;" placeholder="제목 검색" th:value="${searchKeyword}">
        <button type="button" class="krds-btn medium secondary" onclick="toastSearch();">검색</button>
    </div>
    <div class="krds-table-wrap">
        <table class="tbl col data">
            <caption>자료실 목록</caption>
            <colgroup>
                <col style="width: 10%;">
                <col>
                <col style="width: 15%;">
                <col style="width: 10%;">
            </colgroup>
            <thead>
            <tr>
                <th scope="col">번호</th>
                <th scope="col">제목</th>
                <th scope="col">등록일</th>
                <th scope="col">조회수</th>
            </tr>
            </thead>
            <tbody id="toastTb">
            </tbody>
        </table>
    </div>
    <div style="text-align: center; margin-top: 12px;">
        <button type="button" id="toastMoreBtn" class="krds-btn medium secondary" onclick="toastMore();">더보기</button>
        <div id="toastEndMsg" class="text-muted" style="display:none;">마지막 글입니다.</div>
    </div>
    </th:block>
<script>
    function boardPaging(pageIndex) {
        document.getElementById('pageIndex').value = pageIndex;
        document.getElementById('listForm').submit();
    }

    // 토스트 커서 목록. GTEMS AJAX 목록과 같은 결이다.
    var toastCursor = '';
    var toastLoading = false;
    var toastSeq = 0;
    function escapeHtml(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    // 상세 이동은 POST로 한다(쿼리스트링 노출 방지). arkive-common.js 전역 data-post와 같은 규칙이다.
    function toastGoDetail(boardId) {
        var form = document.createElement('form');
        form.method = 'post';
        form.action = '/board/detail';
        var input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'boardId';
        input.value = boardId;
        form.appendChild(input);
        document.body.appendChild(form);
        form.submit();
    }
    function toastLoad(reset) {
        if (toastLoading) return;
        toastLoading = true;
        if (reset) {
            toastCursor = '';
            toastSeq = 0;
            $('#toastTb').empty();
        }
        $.ajax({
            type: 'post',
            url: '/board/toastList.json',
            data: { searchKeyword: $('#toastKeyword').val(), cursorId: toastCursor },
            dataType: 'json',
            success: function(data) {
                if (!data || !data.success) {
                    alert((data && data.message) || '목록 조회에 실패했습니다.');
                    toastLoading = false;
                    return;
                }
                var buffer = [];
                if (data.list.length === 0 && toastSeq === 0) {
                    buffer.push("<tr><td colspan='4'>게시글이 없습니다.</td></tr>");
                }
                $.each(data.list, function(i, item) {
                    toastSeq++;
                    buffer.push('<tr>');
                    buffer.push('<td>' + toastSeq + '</td>');
                    buffer.push('<td><a href="javascript:void(0)" onclick="toastGoDetail(\'' + item.boardId + '\')">' + escapeHtml(item.title) + '</a></td>');
                    buffer.push('<td>' + escapeHtml(item.registDt) + '</td>');
                    buffer.push('<td>' + item.viewCnt + '</td>');
                    buffer.push('</tr>');
                });
                $('#toastTb').append(buffer.join(''));
                toastCursor = data.nextCursorId || '';
                if (data.hasNext) {
                    $('#toastMoreBtn').show();
                    $('#toastEndMsg').hide();
                } else {
                    $('#toastMoreBtn').hide();
                    if (toastSeq > 0) $('#toastEndMsg').show();
                }
                toastLoading = false;
            },
            error: function() {
                alert('에러가 발생하였습니다. 관리자에게 문의하세요.');
                toastLoading = false;
            }
        });
    }
    function toastMore() { toastLoad(false); }
    function toastSearch() { toastLoad(true); }
    $(function() {
        if ($('#toastTb').length > 0) toastLoad(true);
    });
</script>
</div>
</body>
</html>
