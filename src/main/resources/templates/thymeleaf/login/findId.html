<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>아이디 찾기</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/component/output.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/krds-local.css}">
    <script th:src="@{/js/jquery.min.js}"></script>
</head>
<body>
<div class="inner" style="max-width: 480px; margin: 80px auto;">
    <h2 class="heading-large" style="text-align: center;">아이디 찾기</h2>
    <div class="conts-wrap">
        <div class="fieldset input-form">
            <div class="form-group">
                <div class="form-tit"><label for="userNm">이름</label></div>
                <div class="form-conts"><input type="text" id="userNm" class="krds-input" maxlength="100"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="email">이메일</label></div>
                <div class="form-conts"><input type="text" id="email" class="krds-input" maxlength="100" autocomplete="email"></div>
            </div>
            <div class="form-group" id="resultRow" style="display: none;">
                <div class="form-tit">아이디</div>
                <div class="form-conts"><strong id="foundId"></strong></div>
            </div>
        </div>
        <div style="margin-top: 12px; display: flex; gap: 8px;">
            <button type="button" class="krds-btn medium primary" style="flex: 1;" onclick="fnFindId()">찾기</button>
        </div>
        <p style="font-size: 12px; margin-top: 8px;"><a th:href="@{/login/login}">로그인으로 돌아가기</a></p>
    </div>
</div>
<script>
    function fnFindId() {
        if (($('#userNm').val() || '').trim() === '' || ($('#email').val() || '').trim() === '') {
            alert('이름과 이메일을 입력하세요.');
            return;
        }
        $.ajax({
            type: 'post',
            url: '/login/findId.json',
            data: { userNm: $('#userNm').val(), email: $('#email').val() },
            success: function(res) {
                if (res.success) {
                    $('#foundId').text(res.userId);
                    $('#resultRow').show();
                } else {
                    $('#resultRow').hide();
                    alert(res.message || '찾기에 실패했습니다.');
                }
            },
            error: function() { alert('찾기 중 오류가 발생했습니다.'); }
        });
    }
</script>
</body>
</html>
