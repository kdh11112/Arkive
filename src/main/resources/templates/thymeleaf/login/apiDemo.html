<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>JWT 데모</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/component/output.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/krds-local.css}">
</head>
<body>
<div class="inner" style="max-width: 720px; margin: 40px auto;">
    <h2 class="heading-large" style="text-align: center;">JWT 동작 데모</h2>
    <p>세션 없이 토큰만으로 돕니다. 1) 로그인 → 2) 목록 → 3) 상세 순서로 눌러보세요.</p>

    <div id="loginBox" class="conts-wrap">
        <div class="fieldset input-form">
            <div class="form-group">
                <div class="form-tit"><label for="userId">아이디</label></div>
                <div class="form-conts"><input type="text" id="userId" class="krds-input" value="admin"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="password">비밀번호</label></div>
                <div class="form-conts"><input type="password" id="password" class="krds-input" value="Admin1234!"></div>
            </div>
        </div>
        <div style="margin-top: 12px;">
            <button type="button" class="krds-btn medium primary" style="width: 100%;" onclick="fnLogin()">1. 로그인 (토큰 발급)</button>
        </div>
    </div>

    <div id="appBox" style="display: none;">
        <p><strong id="hello"></strong> <button type="button" class="krds-btn small secondary" onclick="fnLogout()">로그아웃 (토큰 버림)</button></p>
        <div style="display: flex; gap: 8px; margin-top: 8px;">
            <button type="button" class="krds-btn medium secondary" onclick="fnList()">2. 공지 목록</button>
            <button type="button" class="krds-btn medium danger" onclick="fnNoToken()">토큰 없이 호출</button>
        </div>
        <div id="listZone" style="margin-top: 12px;"></div>
        <div id="detailZone" style="margin-top: 12px; border-top: 1px solid #ddd; padding-top: 12px;"></div>
    </div>

    <div class="form-group" style="margin-top: 12px;">
        <div class="form-tit"><label for="result">API 응답</label></div>
        <div class="form-conts"><textarea id="result" class="krds-input" rows="8" style="width: 100%;" readonly></textarea></div>
    </div>
    <div style="margin-top: 12px;">
        <a th:href="@{/login/login}" class="krds-btn medium secondary">로그인 화면으로</a>
    </div>
</div>
<script>
    // 로그인 화면에서 JWT로 넘어오면 토큰이 있다. 있으면 로그인 박스를 건너뛴다.
    (function() {
        var token = null;
        try { token = sessionStorage.getItem('jwt'); } catch (e) {}
        if (token) {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('appBox').style.display = '';
            document.getElementById('hello').textContent = '토큰 로그인됨';
        }
    })();
    function showResult(obj, status) {
        document.getElementById('result').value = 'HTTP ' + status + '\n' + JSON.stringify(obj, null, 2);
    }
    function authHeader() {
        return { 'Authorization': 'Bearer ' + (sessionStorage.getItem('jwt') || '') };
    }
    function fnLogin() {
        var body = 'userId=' + encodeURIComponent(document.getElementById('userId').value)
            + '&password=' + encodeURIComponent(document.getElementById('password').value);
        fetch('/api/login.json', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: body
        }).then(function(r) { return r.json().then(function(j) { return { status: r.status, body: j }; }); })
        .then(function(res) {
            showResult(res.body, res.status);
            if (res.body && res.body.token) {
                sessionStorage.setItem('jwt', res.body.token);
                document.getElementById('hello').textContent = (res.body.userNm || '') + '님 로그인됨';
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('appBox').style.display = '';
            }
        }).catch(function(e) { showResult({ error: String(e) }, 0); });
    }
    function fnLogout() {
        sessionStorage.removeItem('jwt');
        location.reload();
    }
    function fnList() {
        fetch('/api/noticeList.json', { headers: authHeader() })
        .then(function(r) { return r.json().then(function(j) { return { status: r.status, body: j }; }); })
        .then(function(res) {
            showResult(res.body, res.status);
            var html = '';
            if (res.body && res.body.list) {
                res.body.list.forEach(function(item) {
                    html += '<div><a href="javascript:void(0)" onclick="fnDetail(\'' + item.boardId + '\')">' + item.title + '</a></div>';
                });
            }
            document.getElementById('listZone').innerHTML = html;
            document.getElementById('detailZone').innerHTML = '';
        }).catch(function(e) { showResult({ error: String(e) }, 0); });
    }
    function fnDetail(boardId) {
        fetch('/api/noticeDetail.json?boardId=' + encodeURIComponent(boardId), { headers: authHeader() })
        .then(function(r) { return r.json().then(function(j) { return { status: r.status, body: j }; }); })
        .then(function(res) {
            showResult(res.body, res.status);
            if (res.body && res.body.detail) {
                document.getElementById('detailZone').innerHTML =
                    '<h3>' + res.body.detail.title + '</h3><div>' + (res.body.detail.content || '') + '</div>';
            }
        }).catch(function(e) { showResult({ error: String(e) }, 0); });
    }
    function fnNoToken() {
        fetch('/api/noticeList.json')
        .then(function(r) { return r.json().then(function(j) { return { status: r.status, body: j }; }); })
        .then(function(res) { showResult(res.body, res.status); })
        .catch(function(e) { showResult({ error: String(e) }, 0); });
    }
</script>
</body>
</html>
