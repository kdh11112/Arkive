<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>회원가입</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/component/output.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/krds-local.css}">
    <script th:src="@{/js/jquery.min.js}"></script>
</head>
<body>
<div class="inner" style="max-width: 480px; margin: 80px auto;">
    <h2 class="heading-large" style="text-align: center;">회원가입</h2>
    <div class="conts-wrap">
        <div class="fieldset input-form">
            <div class="form-group">
                <div class="form-tit"><label for="userId">아이디 (영문·숫자 4~20자)</label></div>
                <div class="form-conts"><input type="text" id="userId" class="krds-input" maxlength="20" autocomplete="username"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="password">비밀번호 (8자 이상)</label></div>
                <div class="form-conts"><input type="password" id="password" class="krds-input" maxlength="50" autocomplete="new-password"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="userNm">이름</label></div>
                <div class="form-conts"><input type="text" id="userNm" class="krds-input" maxlength="100"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="email">이메일</label></div>
                <div class="form-conts"><input type="text" id="email" class="krds-input" maxlength="100" autocomplete="email"></div>
            </div>
            <div class="form-group">
                <div class="form-tit">메일 수신</div>
                <div class="form-conts">
                    <label style="display: flex; align-items: center; gap: 6px; font-size: 14px;">
                        <input type="checkbox" id="mailYn">
                        <span>공지·중요글 알림 메일 수신에 동의합니다. (선택)</span>
                    </label>
                    <p style="font-size: 12px; color: #666; margin-top: 4px;">동의한 경우에만 알림 메일을 보냅니다. 이메일이 없으면 동의할 수 없습니다.</p>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="phone">휴대전화</label></div>
                <div class="form-conts"><input type="text" id="phone" class="krds-input" maxlength="20" autocomplete="tel" placeholder="010-0000-0000"></div>
            </div>
            <div class="form-group">
                <div class="form-tit">SMS 수신</div>
                <div class="form-conts">
                    <label style="display: flex; align-items: center; gap: 6px; font-size: 14px;">
                        <input type="checkbox" id="smsYn">
                        <span>공지·중요글 알림 SMS 수신에 동의합니다. (선택)</span>
                    </label>
                    <p style="font-size: 12px; color: #666; margin-top: 4px;">동의한 경우에만 문자를 보냅니다. 휴대전화 번호가 없으면 동의할 수 없습니다.</p>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit">약관 동의</div>
                <div class="form-conts">
                    <div th:each="term : ${termsList}" style="margin-bottom: 6px;">
                        <label style="display: flex; align-items: center; gap: 6px; font-size: 14px;">
                            <input type="checkbox" class="terms-check" th:value="${term['termsId']}"
                                   th:attr="data-required=${term['requiredYn']}">
                            <span th:text="${term['title'] + ' (v' + term['version'] + ', ' + (term['requiredYn'] == 'Y' ? '필수' : '선택') + ')'}"></span>
                        </label>
                    </div>
                    <p style="font-size: 12px; color: #666; margin-top: 4px;">
                        <a th:href="@{/terms}" target="_blank">약관 전문 보기</a>
                    </p>
                </div>
            </div>
        </div>
        <div style="margin-top: 12px; display: flex; gap: 8px;">
            <button type="button" class="krds-btn medium primary" style="flex: 1;" onclick="fnSignup()">가입하기</button>
        </div>
        <p style="font-size: 12px; margin-top: 8px;"><a th:href="@{/login/login}">로그인으로 돌아가기</a></p>
    </div>
</div>
<script>
    function fnSignup() {
        var userId = ($('#userId').val() || '').trim();
        if (!/^[A-Za-z0-9]{4,20}$/.test(userId)) {
            alert('아이디는 영문·숫자 4~20자로 입력하세요.');
            $('#userId').focus();
            return;
        }
        if (($('#password').val() || '').length < 8) {
            alert('비밀번호는 8자 이상 입력하세요.');
            $('#password').focus();
            return;
        }
        if (($('#userNm').val() || '').trim() === '') {
            alert('이름을 입력하세요.');
            $('#userNm').focus();
            return;
        }
        var email = ($('#email').val() || '').trim();
        var mailYn = $('#mailYn').is(':checked') ? 'Y' : 'N';
        if (mailYn === 'Y' && email === '') {
            alert('메일 수신에 동의하려면 이메일을 입력하세요.');
            $('#email').focus();
            return;
        }
        var smsYn = $('#smsYn').is(':checked') ? 'Y' : 'N';
        var phone = ($('#phone').val() || '').trim();
        if (smsYn === 'Y' && !/^01[016789]-?[0-9]{3,4}-?[0-9]{4}$/.test(phone)) {
            alert('SMS 수신에 동의하려면 올바른 휴대전화 번호를 입력하세요.');
            $('#phone').focus();
            return;
        }
        var termsIds = [];
        $('.terms-check:checked').each(function() { termsIds.push($(this).val()); });
        var requiredCount = $('.terms-check[data-required="Y"]').length;
        if ($('.terms-check[data-required="Y"]:checked').length !== requiredCount) {
            alert('필수 약관에 모두 동의해야 가입할 수 있습니다.');
            return;
        }
        $.ajax({
            type: 'post',
            url: '/login/signup.json',
            traditional: true,
            data: { userId: userId, password: $('#password').val(), userNm: $('#userNm').val(), email: email, mailYn: mailYn, phone: phone, smsYn: smsYn, termsIds: termsIds },
            success: function(res) {
                if (res.success) { alert('가입되었습니다. 로그인하세요.'); location.href = '/login/login'; }
                else { alert(res.message || '가입에 실패했습니다.'); }
            },
            error: function() { alert('가입 중 오류가 발생했습니다.'); }
        });
    }
</script>
</body>
</html>
