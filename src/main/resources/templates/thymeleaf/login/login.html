<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>로그인</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/component/output.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/krds-local.css}">
    <script th:src="@{/js/jquery.min.js}"></script>
    <script th:src="@{/js/arkive-common.js}"></script>
</head>
<body>
<div class="inner" style="max-width: 480px; margin: 80px auto;">
    <h2 class="heading-large" style="text-align: center;">아카이브 로그인</h2>
    <div class="conts-wrap">
        <div class="fieldset input-form">
            <div class="form-group">
                <div class="form-tit"><label for="userId">아이디</label></div>
                <div class="form-conts"><input type="text" id="userId" class="krds-input" maxlength="20" autocomplete="username"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="password">비밀번호</label></div>
                <div class="form-conts"><input type="password" id="password" class="krds-input" maxlength="50" autocomplete="current-password"></div>
            </div>
            <div id="totpSection" class="form-group" style="display:none; border:1px solid #ddd; padding:12px; background:#fafafa;">
                <div class="form-tit"><label for="totpCode">2단계 인증 코드</label></div>
                <div class="form-conts">
                    <input type="text" id="totpCode" class="krds-input" maxlength="16" inputmode="numeric"
                           placeholder="인증 앱의 6자리 코드 또는 복구코드" autocomplete="one-time-code">
                    <button type="button" class="krds-btn medium primary" style="margin-top:8px; width:100%;" onclick="fnTotpVerify()">인증</button>
                    <p style="font-size:12px; color:#666; margin-top:6px;">복구코드를 잃어버렸다면 관리자에게 2단계 인증 초기화를 요청하세요.</p>
                </div>
            </div>
            <div class="form-group">
                <div class="form-conts">
                    <div class="krds-form-check">
                        <input type="checkbox" id="saveId">
                        <label for="saveId">아이디 저장</label>
                    </div>
                </div>
            </div>
        </div>
        <div style="margin-top: 12px; display: flex; gap: 8px;">
            <button type="button" id="loginBtn" class="krds-btn medium primary" style="flex: 1;" onclick="fnLogin()">세션 로그인</button>
            <button type="button" id="jwtBtn" class="krds-btn medium secondary" style="flex: 1;" onclick="fnJwtLogin()">JWT 로그인</button>
        </div>
        <div style="display: flex; gap: 8px; margin-top: 8px;">
            <button type="button" class="krds-btn medium secondary" style="flex: 1;" onclick="openReadyModal()">네이버 로그인</button>
            <button type="button" class="krds-btn medium secondary" style="flex: 1;" onclick="openReadyModal()">카카오 로그인</button>
        </div>
        <p style="font-size: 12px; margin-top: 8px;">5회 실패하면 잠깁니다. 초기 관리자 admin / Admin1234! (운영 전 변경)</p>
        <p style="font-size: 12px; margin-top: 4px;"><a th:href="@{/login/apiDemo}">JWT 동작 데모 보기</a></p>
        <p style="font-size: 12px; margin-top: 4px;">
            <a th:href="@{/login/signup}">회원가입</a> ·
            <a th:href="@{/login/findId}">아이디 찾기</a> ·
            <a th:href="@{/login/findPw}">비밀번호 찾기</a>
        </p>
    </div>
</div>
<section id="readyModal" class="krds-modal fade" role="dialog" aria-labelledby="tit_readyModal" style="display: none;">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="tit_readyModal" class="modal-title">알림</h2>
            </div>
            <div class="modal-conts">
                <div class="conts-area">소셜 로그인은 준비중입니다.</div>
            </div>
            <div class="modal-btn btn-wrap">
                <button type="button" class="krds-btn medium primary" onclick="closeReadyModal()">확인</button>
            </div>
            <button type="button" class="krds-btn medium icon btn-close close-modal" onclick="closeReadyModal()">
                <span class="sr-only">닫기</span>
                <i class="svg-icon ico-popup-close"></i>
            </button>
        </div>
    </div>
    <div class="modal-back" onclick="closeReadyModal()"></div>
</section>
<script>
    loadSavedId('userId', 'saveId');
    var totpPending = /*[[${totpPending}]]*/ false;
    if (totpPending) {
        $('#totpSection').show();
        $('#totpCode').focus();
    }
    document.getElementById('password').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { fnLogin(); }
    });
    function fnLogin() {
        var userId = ($('#userId').val() || '').trim();
        if (userId === '' || ($('#password').val() || '') === '') {
            alert('아이디와 비밀번호를 입력하세요.');
            return;
        }
        $('#loginBtn').prop('disabled', true);
        $.ajax({
            type: 'post',
            url: '/login/login.json',
            data: { userId: userId, password: $('#password').val() },
            complete: function() { $('#loginBtn').prop('disabled', false); },
            success: function(res) {
                if (res.success && res.totpRequired) {
                    storeSavedId(userId, document.getElementById('saveId').checked);
                    $('#loginBtn').prop('disabled', true);
                    $('#totpSection').show();
                    $('#totpCode').focus();
                    return;
                }
                if (res.success) {
                    storeSavedId(userId, document.getElementById('saveId').checked);
                    afterLogin(res);
                }
                else { alert(res.message || '로그인에 실패했습니다.'); }
            },
            error: function(xhr) {
                if (xhr.status === 401) { alert('로그인이 필요합니다.'); }
                else { alert('로그인 중 오류가 발생했습니다.'); }
            }
        });
    }
    function afterLogin(res) {
        if (res.termsRequired) {
            location.href = '/login/termsAgree';
            return;
        }
        var returnUrl = new URLSearchParams(location.search).get('returnUrl');
        if (returnUrl && returnUrl.charAt(0) === '/' && returnUrl.charAt(1) !== '/') {
            location.href = returnUrl;
        } else {
            location.href = res.isAdmin ? '/dashboard' : '/user/userMain';
        }
    }
    function fnTotpVerify() {
        var value = ($('#totpCode').val() || '').trim();
        if (value === '') { alert('2단계 인증 코드를 입력하세요.'); return; }
        var data = value.length > 6 ? { recoveryCode: value } : { code: value };
        $.ajax({
            type: 'post',
            url: '/login/totpVerify.json',
            data: data,
            success: function(res) {
                if (res.success) { afterLogin(res); }
                else {
                    alert(res.message || '2단계 인증에 실패했습니다.');
                    if ((res.message || '').indexOf('다시 로그인') >= 0) {
                        location.reload();
                    }
                }
            },
            error: function() { alert('2단계 인증 중 오류가 발생했습니다.'); }
        });
    }
    function openReadyModal() {
        var m = document.getElementById('readyModal');
        m.style.display = 'block';
        m.classList.add('shown');
        m.querySelector('.modal-back').classList.add('in');
        setTimeout(function() { m.classList.add('in'); }, 50);
    }
    function closeReadyModal() {
        var m = document.getElementById('readyModal');
        if (!m.classList.contains('shown')) return;
        m.classList.remove('in');
        m.querySelector('.modal-back').classList.remove('in');
        setTimeout(function() { m.style.display = 'none'; m.classList.remove('shown'); }, 150);
    }
    document.getElementById('readyModal').querySelector('.modal-back').addEventListener('click', closeReadyModal);
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeReadyModal();
    });
    // JWT 로그인. 토큰을 받아 저장하고 JWT playground로 간다. 세션은 안 쓴다.
    function fnJwtLogin() {
        var userId = ($('#userId').val() || '').trim();
        if (userId === '' || ($('#password').val() || '') === '') {
            alert('아이디와 비밀번호를 입력하세요.');
            return;
        }
        $('#jwtBtn').prop('disabled', true);
        $.ajax({
            type: 'post',
            url: '/api/login.json',
            data: { userId: userId, password: $('#password').val() },
            complete: function() { $('#jwtBtn').prop('disabled', false); },
            success: function(res) {
                if (res.success && res.token) {
                    try { sessionStorage.setItem('jwt', res.token); } catch (e) {}
                    location.href = '/login/apiDemo';
                } else { alert(res.message || '로그인에 실패했습니다.'); }
            },
            error: function() { alert('로그인 중 오류가 발생했습니다.'); }
        });
    }
</script>
</body>
</html>
