<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>비밀번호 재설정</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/component/output.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/krds-local.css}">
    <script th:src="@{/js/jquery.min.js}"></script>
</head>
<body>
<div class="inner" style="max-width: 480px; margin: 80px auto;">
    <h2 class="heading-large" style="text-align: center;">비밀번호 재설정</h2>
    <div class="conts-wrap">
        <div th:if="${!valid}" class="fieldset input-form">
            <p style="line-height: 1.6;">재설정 링크가 만료되었거나 이미 사용되었습니다. 비밀번호 찾기에서 새 링크를 요청하세요.</p>
            <p style="margin-top: 12px;"><a th:href="@{/login/findPw}" class="krds-btn medium primary">비밀번호 찾기</a></p>
        </div>
        <div th:if="${valid}" class="fieldset input-form">
            <input type="hidden" id="token" th:value="${token}">
            <div class="form-group">
                <div class="form-tit"><label for="password">새 비밀번호 (8자 이상)</label></div>
                <div class="form-conts"><input type="password" id="password" class="krds-input" maxlength="50" autocomplete="new-password"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="passwordConfirm">새 비밀번호 확인</label></div>
                <div class="form-conts"><input type="password" id="passwordConfirm" class="krds-input" maxlength="50" autocomplete="new-password"></div>
            </div>
        </div>
        <div th:if="${valid}" style="margin-top: 12px; display: flex; gap: 8px;">
            <button type="button" class="krds-btn medium primary" style="flex: 1;" onclick="fnResetPw()">변경하기</button>
        </div>
        <p style="font-size: 12px; margin-top: 8px;"><a th:href="@{/login/login}">로그인으로 돌아가기</a></p>
    </div>
</div>
<script>
    function fnResetPw() {
        var password = $('#password').val() || '';
        var passwordConfirm = $('#passwordConfirm').val() || '';
        if (password.length < 8) {
            alert('비밀번호는 8자 이상 입력하세요.');
            $('#password').focus();
            return;
        }
        if (password !== passwordConfirm) {
            alert('비밀번호 확인이 일치하지 않습니다.');
            $('#passwordConfirm').focus();
            return;
        }
        $.ajax({
            type: 'post',
            url: '/login/resetPw.json',
            data: { token: $('#token').val(), password: password, passwordConfirm: passwordConfirm },
            success: function(res) {
                if (res.success) {
                    alert(res.message || '비밀번호가 변경되었습니다.');
                    location.href = '/login/login';
                } else {
                    alert(res.message || '비밀번호 변경에 실패했습니다.');
                }
            },
            error: function() { alert('비밀번호 변경 중 오류가 발생했습니다.'); }
        });
    }
</script>
</body>
</html>
