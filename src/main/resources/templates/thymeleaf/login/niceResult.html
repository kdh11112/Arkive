<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>본인확인 결과</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/component/output.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/krds-local.css}">
</head>
<body>
<div class="inner" style="max-width: 480px; margin: 80px auto;">
    <h2 class="heading-large" style="text-align: center;">본인확인 결과</h2>
    <div th:if="${message != null and message != ''}">
        <p th:text="${message}"></p>
    </div>
    <div th:if="${verified != null}">
        <p th:text="'이름: ' + ${verified['name']}"></p>
        <p th:text="'생년월일: ' + ${verified['birthdate']}"></p>
        <p th:text="'휴대폰: ' + ${verified['phone']}"></p>
        <p>본인확인이 완료되었습니다. 이 창을 닫고 계속하세요.</p>
    </div>
    <div style="margin-top: 12px; text-align: center;">
        <button type="button" class="krds-btn medium secondary" onclick="window.close();">닫기</button>
    </div>
</div>
</body>
</html>
