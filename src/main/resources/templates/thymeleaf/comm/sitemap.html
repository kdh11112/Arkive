<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>사이트맵</title>
</head>
<body>
<div layout:fragment="content" class="sitemap-page">
    <div class="sitemap-head">
        <h2 class="heading-large">사이트맵
            <span class="help-tip" tabindex="0" role="img"
                  aria-label="로그인 사용자가 조회 권한을 가진 메뉴만 표시됩니다."
                  data-tip="로그인 사용자가 조회 권한을 가진 메뉴만 표시됩니다.">?</span>
        </h2>
    </div>

    <div class="sitemap-grid" th:if="${menuList != null and !menuList.isEmpty()}">
        <section class="sitemap-card" th:each="menu : ${menuList}" th:if="${menu['grad'] == 2}">
            <h3 class="sitemap-card-tit" th:text="${menu['menuNm']}">대메뉴</h3>
            <ul class="sitemap-links">
                <li th:each="subMenu : ${menuList}"
                    th:if="${subMenu['grad'] == 3 and subMenu['parent'] == menu['menuId']}">
                    <a class="sitemap-link" th:href="${subMenu['menuCours']}" th:text="${subMenu['menuNm']}">하위 메뉴</a>
                </li>
            </ul>
        </section>
    </div>

    <p class="sitemap-empty" th:if="${menuList == null or menuList.isEmpty()}">표시할 메뉴가 없습니다.</p>
</div>
</body>
</html>
