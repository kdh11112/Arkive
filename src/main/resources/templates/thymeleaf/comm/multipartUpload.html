<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>멀파트 업로드</title>
</head>
<body>

<div layout:fragment="content" class="container-fluid">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">멀파트 업로드</h1>
    </div>

    <div class="row">
        <div class="col-lg-12 mb-4">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">일반 멀파트 파일 업로드</h6>
                </div>
                <div class="card-body">
                    <form action="/file/tempFileUpload.json" method="post" enctype="multipart/form-data">
                        <div class="form-group">
                            <input type="file" name="files" class="form-control-file mb-3" multiple>
                            <button type="submit" class="btn btn-primary btn-sm">멀파트 업로드 전송</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
