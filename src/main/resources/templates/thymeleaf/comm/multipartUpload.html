<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>멀티파트 업로드</title>
</head>
<body>

<div layout:fragment="content">
    <h2 class="heading-large">멀티파트 업로드</h2>

    <div class="conts-wrap">
        <div class="fieldset input-form">
            <div class="form-group">
                <div class="form-tit"><span>일반 멀티파트 파일 업로드</span></div>
                <div class="form-conts">
                    <form id="multipartUploadForm" enctype="multipart/form-data">
                        <input type="file" id="multipartFileInput" name="files" multiple required>
                        <input type="hidden" id="maxFileSizeMb" th:value="${maxFileSizeMb}">
                        <div>파일을 선택하고 열기를 누르면 temp 폴더에 바로 저장됩니다.</div>
                        <div style="color: #d11f1f;" th:text="'※ 첨부파일 업로드 용량은 ' + ${maxFileSizeMb} + 'MB 이하 입니다.'">※ 첨부파일 업로드 용량은 50MB 이하 입니다.</div>
                        <ul id="multipartStagedList" style="list-style: none; padding-left: 0; margin-top: 8px;" aria-live="polite"></ul>
                    </form>
                    <div class="btn-wrap" style="margin-top: 8px;">
                        <button type="button" id="multipartSaveButton" class="krds-btn small primary" disabled>저장</button>
                        <button type="button" id="multipartClearButton" class="krds-btn small secondary" disabled>전체 취소</button>
                    </div>
                    <div id="multipartUploadResult" style="margin-top: 12px;" role="status" aria-live="polite"></div>
                </div>
            </div>
        </div>

        <div class="fieldset">
            <div class="form-group">
                <div class="form-tit"><span>Arkive 저장 파일 목록</span></div>
                <div class="form-conts">
                    <div class="krds-table-wrap">
                        <table class="tbl col data">
                            <caption>Arkive 저장 파일 목록</caption>
                            <thead>
                                <tr>
                                    <th scope="col">No</th>
                                    <th scope="col">파일명</th>
                                    <th scope="col">크기 (Bytes)</th>
                                    <th scope="col">업로드일시</th>
                                    <th scope="col">다운로드</th>
                                    <th scope="col">삭제</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${fileList == null or fileList.isEmpty()}">
                                    <td colspan="6">저장된 파일이 없습니다.</td>
                                </tr>
                                <tr th:each="file, iterStat : ${fileList}">
                                    <td th:text="${iterStat.count}">1</td>
                                    <td th:text="${file.orgnlFileNm}">filename.ext</td>
                                    <td th:text="${file.fileSz}">0</td>
                                    <td th:text="${file.regDt}">2026-09-26</td>
                                    <td>
                                        <a th:href="@{/file/downloadFile.do(downloadFileId=${file.fileId})}" class="krds-btn small secondary" target="_blank">다운로드</a>
                                    </td>
                                    <td>
                                        <button type="button" class="krds-btn small danger" th:attr="data-saved-file-id=${file.fileId}">삭제</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('multipartFileInput');
        const saveButton = document.getElementById('multipartSaveButton');
        const clearButton = document.getElementById('multipartClearButton');
        const resultBox = document.getElementById('multipartUploadResult');
        const stagedList = document.getElementById('multipartStagedList');
        let isUploading = false;

        // temp 폴더에 저장된 파일 (저장 전에는 DB에 등록되지 않는다)
        let stagedFiles = [];

        function setResult(kind, msg) {
            const colors = { success: '#1a7f37', danger: '#d11f1f', info: '#0b5fc1', warning: '#b25e09' };
            resultBox.style.color = colors[kind] || '';
            resultBox.textContent = msg;
        }

        function updateButtons() {
            saveButton.disabled = stagedFiles.length === 0;
            clearButton.disabled = stagedFiles.length === 0;
        }

        function renderStaged() {
            stagedList.innerHTML = '';
            stagedFiles.forEach(function (item, index) {
                const row = document.createElement('li');
                row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;';

                const name = document.createElement('span');
                name.style.cssText = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px;';
                name.textContent = item.fileName;

                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'krds-btn small danger';
                button.textContent = '취소';
                button.addEventListener('click', function () { removeStaged(index); });

                row.appendChild(name);
                row.appendChild(button);
                stagedList.appendChild(row);
            });
        }

        async function removeStaged(index) {
            const item = stagedFiles[index];
            if (!item) {
                return;
            }
            if (item.fileId) {
                try {
                    await fetch('/system/tus/' + encodeURIComponent(item.fileId), { method: 'DELETE' });
                } catch (e) {
                    // temp 삭제 실패는 서버 로그에서 확인한다
                }
            }
            stagedFiles.splice(index, 1);
            renderStaged();
            updateButtons();
        }

        clearButton.addEventListener('click', async function () {
            if (!confirm('temp에 저장된 파일을 모두 삭제하시겠습니까?')) {
                return;
            }
            for (const item of stagedFiles) {
                if (item.fileId) {
                    try {
                        await fetch('/system/tus/' + encodeURIComponent(item.fileId), { method: 'DELETE', keepalive: true });
                    } catch (e) {
                        // 무시
                    }
                }
            }
            stagedFiles = [];
            fileInput.value = '';
            renderStaged();
            updateButtons();
        });

        // 파일 선택 대화상자에서 열기를 누르면 temp 폴더로 바로 전송한다. (DB 등록 없음)
        fileInput.addEventListener('change', uploadSelectedFiles);

        async function uploadSelectedFiles() {
            const selectedFiles = Array.from(fileInput.files || []);
            if (selectedFiles.length === 0 || isUploading) {
                return;
            }

            // 용량 상한은 서버 모델(Globals.fileUpload.maxFileSize.mb) 기준이다
            const maxFileSizeMb = parseFloat(document.getElementById('maxFileSizeMb').value) || 50;
            const overSized = selectedFiles.filter(function (f) { return f.size > maxFileSizeMb * 1024 * 1024; });
            if (overSized.length > 0) {
                fileInput.value = '';
                setResult('danger', '※ 첨부파일 업로드 용량은 ' + maxFileSizeMb + 'MB 이하 입니다. (' + overSized[0].name + ')');
                return;
            }

            isUploading = true;
            fileInput.disabled = true;
            saveButton.disabled = true;
            clearButton.disabled = true;
            setResult('info', 'temp 폴더로 업로드 중입니다...');

            try {
                const uploadData = new FormData();
                selectedFiles.forEach(function (selectedFile) {
                    uploadData.append('files', selectedFile);
                });
                const response = await fetch('/system/file/tempFileUpload.json', {
                    method: 'POST',
                    body: uploadData,
                    headers: { 'Accept': 'application/json' }
                });

                let payload;
                const contentType = response.headers.get('content-type') || '';
                if (contentType.includes('application/json')) {
                    payload = await response.json();
                } else {
                    const text = await response.text();
                    throw new Error('서버 응답 오류 (HTTP ' + response.status + '): ' + text);
                }

                if (!response.ok || payload.success === false) {
                    throw new Error(payload.message || '서버가 파일을 저장하지 못했습니다.');
                }

                const uploaded = payload.tempFileList || [];
                if (uploaded.length === 0) {
                    throw new Error(payload.message || '업로드된 파일이 없습니다.');
                }

                stagedFiles = stagedFiles.concat(uploaded.map(function (f) {
                    return { fileId: f.fileId, fileName: f.orgnlFileNm, fileSize: f.fileSz };
                }));
                fileInput.value = '';
                setResult('success', uploaded.length + '개 파일을 temp 폴더에 저장했습니다. 저장을 눌러야 Arkive에 반영됩니다.');
                renderStaged();
            } catch (error) {
                setResult('danger', error.message);
            } finally {
                isUploading = false;
                fileInput.disabled = false;
                updateButtons();
            }
        }

        // temp -> Arkive 최종 경로 이동 + DB 등록
        saveButton.addEventListener('click', async function () {
            if (stagedFiles.length === 0) {
                return;
            }
            saveButton.disabled = true;
            setResult('info', 'Arkive에 저장 중입니다...');

            const params = new URLSearchParams();
            params.append('files', JSON.stringify(stagedFiles.map(function (f) {
                return { fileId: f.fileId, fileName: f.fileName };
            })));
            params.append('fileType', 'MULTIPART');

            try {
                const response = await fetch('/system/file/saveTempFiles.json', {
                    method: 'POST',
                    body: params
                });
                const payload = await response.json();
                if (!response.ok || payload.success === false) {
                    throw new Error(payload.message || '저장에 실패하였습니다.');
                }
                if (payload.count !== stagedFiles.length) {
                    const savedIds = new Set((payload.files || []).map(function (f) { return f.fileId; }));
                    stagedFiles = stagedFiles.filter(function (f) { return !savedIds.has(f.fileId); });
                    setResult('warning', savedIds.size + '개 저장, ' + stagedFiles.length + '개는 temp에 남아 저장하지 못했습니다.');
                    renderStaged();
                    updateButtons();
                    return;
                }
                setResult('success', payload.count + '개 파일을 Arkive에 저장했습니다.');
                stagedFiles = [];
                renderStaged();
                updateButtons();
                location.reload();
            } catch (error) {
                setResult('danger', error.message);
                updateButtons();
            }
        });

        // 저장 목록에서 삭제 버튼을 누른 파일 한 건을 지운다
        async function deleteSavedFile(button) {
            const fileId = button.getAttribute('data-saved-file-id');
            if (!fileId) {
                return;
            }
            if (!confirm('선택한 저장 파일을 삭제하시겠습니까? 실제 파일과 목록에서 함께 삭제됩니다.')) {
                return;
            }

            button.disabled = true;
            // 구 삭제 API에 fileId를 POST한다
            const params = new URLSearchParams();
            params.append('fileId', fileId);
            try {
                const response = await fetch('/file/setFileDelete.json', {
                    method: 'POST',
                    body: params
                });
                const payload = await response.json();
                // result가 1이 아니면 삭제 실패다
                if (!response.ok || payload.result !== 1) {
                    throw new Error('삭제에 실패하였습니다.');
                }

                const row = button.closest('tr');
                const tbody = row ? row.parentNode : null;
                if (row) {
                    row.remove();
                }
                if (tbody && !tbody.querySelector('tr')) {
                    const emptyRow = document.createElement('tr');
                    emptyRow.innerHTML = '<td colspan="6">저장된 파일이 없습니다.</td>';
                    tbody.appendChild(emptyRow);
                }
                setResult('success', '저장 파일을 삭제했습니다.');
            } catch (error) {
                setResult('danger', error.message);
                button.disabled = false;
            }
        }

        document.addEventListener('click', function (event) {
            const target = event.target instanceof Element ? event.target : null;
            const button = target ? target.closest('[data-saved-file-id]') : null;
            if (button) {
                deleteSavedFile(button);
            }
        });

        let tempCleanupSent = false;

        function cleanupStagedTemp() {
            if (tempCleanupSent) {
                return;
            }
            tempCleanupSent = true;
            stagedFiles.forEach(function (item) {
                if (item.fileId) {
                    fetch('/system/tus/' + encodeURIComponent(item.fileId), { method: 'DELETE', keepalive: true });
                }
            });
            stagedFiles = [];
        }

        window.addEventListener('pagehide', cleanupStagedTemp);
        window.addEventListener('beforeunload', cleanupStagedTemp);

        renderStaged();
        updateButtons();
    </script>
</div>

</body>
</html>
