<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Uppy TUS Upload</title>
  <link href="https://releases.transloadit.com/uppy/v4.13.3/uppy.min.css" rel="stylesheet"/>
</head>
<body>
<div id="drag-drop-area"></div>
<input type="hidden" id="atchFileGrpid" name="atchFileGrpid" value="" />

<script src="https://releases.transloadit.com/uppy/v4.13.3/uppy.min.js"></script>
<script src="https://releases.transloadit.com/uppy/locales/v3.3.1/ko_KR.min.js"></script>
<script type="module">
let atchFileGrpid = opener && opener.document.getElementById("atchFileGrpid") ? opener.document.getElementById("atchFileGrpid").value : "";

const uppy = new Uppy.Uppy({
    locale: Uppy.locales.ko_KR,
    debug: true,
});

uppy.use(Uppy.Dashboard, {
    inline: true,
    target: '#drag-drop-area',
    showProgressDetails: true,
});

uppy.use(Uppy.Tus, {
    endpoint: '/system/tus',
    chunkSize: 52428800,
    resume: true,
    overridePatchMethod: true,
    onBeforeRequest: (req) => {
        const atchFileGrpidValue = atchFileGrpid ? atchFileGrpid : '';
        if (atchFileGrpidValue) {
            req.setHeader('atchFileGrpid', atchFileGrpidValue);
        }
        req.setHeader('cnt', uppy.getFiles().length);
    }
});

uppy.on('complete', (result) => {
    console.log(result);
    const name = result.successful.map(file => {
        return file.name;
    });

    if (opener && typeof opener.callBackFileUpload === 'function') {
        opener.callBackFileUpload(JSON.stringify(name));
        window.close();
    } else {
        console.error('부모 창의 callBackFileUpload 함수를 찾을 수 없습니다.');
    }
});
</script>

</body>
</html>
