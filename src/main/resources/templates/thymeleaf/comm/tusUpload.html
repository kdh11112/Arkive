<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>TUS 파일업로드</title>
</head>
<body>

<div layout:fragment="content" class="container-fluid">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">     
        <h1 class="h3 mb-0 text-gray-800">TUS 파일업로드 관리</h1>
    </div>

    <form id="detailForm" name="detailForm" method="post">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">파일 첨부 등록</h6>
            </div>
            <div class="card-body">
                <div id="addFileList1" style="margin-bottom: 10px;" class="text-primary font-weight-bold"></div>
                <button type="button" class="btn btn-primary btn-sm mb-2" id="fileBtn" onclick="addFile();">파일첨부</button>
                <div class="small text-muted">파일을 선택하고 업로드를 마치면 temp 폴더에 바로 저장됩니다.</div>
                <div class="mt-3">
                    <button type="button" class="btn btn-success btn-sm" id="tusSaveBtn" onclick="save();" disabled>tus 저장</button>
                    <button type="button" class="btn btn-secondary btn-sm" id="tusAllClearBtn" onclick="clearTusFiles();" disabled>전체 취소</button>
                </div>
                <div id="tusUploadResult" class="mt-3" role="status" aria-live="polite"></div>
            </div>
        </div>

        <input type="hidden" name="searchCondition" value=""/>
        <input type="hidden" name="searchKeyword" value=""/>
        <input type="hidden" name="pageIndex" value="1"/>
        <input type="hidden" id="atchFileGrpid" name="atchFileGrpid" value=""/>
        <input type="hidden" id="tusFileData" name="tusFileData" value=""/>
    </form>

    <!-- TUS 업로드 파일 목록 -->
    <div class="row mt-4">
        <div class="col-lg-12 mb-4">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">TUS 업로드 파일 목록</h6>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered" width="100%" cellspacing="0">
                            <thead>
                                <tr>
                                    <th>No</th>
                                    <th>파일명</th>
                                    <th>크기 (Bytes)</th>
                                    <th>업로드일시</th>
                                    <th>다운로드</th>
                                    <th>삭제</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${fileList == null or fileList.isEmpty()}">
                                    <td colspan="6" class="text-center">업로드된 파일이 없습니다.</td>
                                </tr>
                                <tr th:each="file, iterStat : ${fileList}">
                                    <td th:text="${iterStat.count}">1</td>
                                    <td th:text="${file.orgnlFileNm}">filename.ext</td>
                                    <td th:text="${file.fileSz}">0</td>
                                    <td th:text="${file.regDt}">2026-09-26</td>
                                    <td>
                                        <a th:href="@{/file/downloadFile.do(downloadFileId=${file.fileId})}" class="btn btn-sm btn-primary" target="_blank">다운로드</a>
                                    </td>
                                    <td>
                                        <button type="button" class="btn btn-sm btn-danger" th:attr="data-saved-file-id=${file.fileId}">삭제</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script type="text/javascript">
var tusFiles = [];

function addFile(){
    window.open("/system/tusPopup", "newWindow", "top=300,left=1000,width=600,height=600,status=no,menubar=no,toolbar=no,resizable=no");
}

function callBackFileUpload(data) {
    var files = JSON.parse(data);
    console.log(files);

    files.forEach(function(item){
        tusFiles.push(item);
    });

    renderFileList();
}

function renderFileList() {
    var html = "";
    tusFiles.forEach(function(item, idx){
        html += '<div class="file-item" data-idx="' + idx + '">' +
                '<span class="file-name">' + item.fileName + '</span>' +
                '<button type="button" class="btn btn-danger btn-sm" onclick="removeFile(' + idx + ')">삭제</button>' +
                '</div>';
    });
    document.getElementById("addFileList1").innerHTML = html;
    document.getElementById("tusFileData").value = JSON.stringify(tusFiles);
    document.getElementById("tusAllClearBtn").disabled = tusFiles.length === 0;
    document.getElementById("tusSaveBtn").disabled = tusFiles.length === 0;
    var tusResultBox = document.getElementById("tusUploadResult");
    if (tusFiles.length === 0) {
        tusResultBox.className = "mt-3";
        tusResultBox.textContent = "";
    } else {
        tusResultBox.className = "mt-3 text-success";
        tusResultBox.textContent = tusFiles.length + "개 파일을 temp 폴더에 저장했습니다. 저장을 눌러야 Arkive에 반영됩니다.";
    }
}

function clearTusFiles() {
    if (tusFiles.length === 0) {
        return;
    }
    if (!confirm('선택한 파일을 모두 취소하시겠습니까?')) {
        return;
    }
    tusFiles.forEach(function(item){
        if (item.fileId) {
            fetch('/system/tus/' + item.fileId, { method: 'DELETE', keepalive: true });
        }
    });
    tusFiles = [];
    renderFileList();
}

function removeFile(idx) {
    var removed = tusFiles.splice(idx, 1);
    if (removed.length > 0) {
        fetch('/system/tus/' + removed[0].fileId, { method: 'DELETE' });
    }
    renderFileList();
}

function save(){
    if (tusFiles.length === 0) {
        alert("저장할 파일이 없습니다.");
        return;
    }

    // 공용 저장 API에 TUS 딱지를 붙여 보낸다
    $.ajax({
        url: '/system/file/saveTempFiles.json',
        type: 'post',
        dataType: 'json',
        data: {
            files: JSON.stringify(tusFiles),
            atchFileGrpid: $("#atchFileGrpid").val() || "",
            fileType: 'TUS'
        },
        success: function(data){
            if (data.success) {
                alert("저장되었습니다.");
                tusFiles = [];
                renderFileList();
                list();
            } else {
                alert(data.message || "저장에 실패했습니다.");
            }
        },
        error: function(error){
            alert('에러가 발생하였습니다. 관리자에게 문의하세요.');
        }
    });
}

function list(){
    window.location.href = '/system/tusUpload';
}

// 저장 목록에서 삭제 버튼을 누른 파일 한 건을 지운다
function deleteSavedFile(button) {
    var fileId = button.getAttribute('data-saved-file-id');
    if (!fileId) {
        return;
    }
    if (!confirm('선택한 저장 파일을 삭제하시겠습니까? 실제 파일과 목록에서 함께 삭제됩니다.')) {
        return;
    }

    button.disabled = true;
    // 구 삭제 API에 fileId를 POST한다
    var params = new URLSearchParams();
    params.append('fileId', fileId);
    fetch('/file/setFileDelete.json', {
        method: 'POST',
        body: params
    }).then(function(response) {
        return response.json().then(function(payload) {
            // result가 1이 아니면 삭제 실패다
            if (!response.ok || payload.result !== 1) {
                throw new Error('삭제에 실패하였습니다.');
            }

            var row = button.closest('tr');
            var tbody = row ? row.parentNode : null;
            if (row) {
                row.remove();
            }
            if (tbody && !tbody.querySelector('tr')) {
                var emptyRow = document.createElement('tr');
                emptyRow.innerHTML = '<td colspan="6" class="text-center">업로드된 파일이 없습니다.</td>';
                tbody.appendChild(emptyRow);
            }
            alert('저장 파일을 삭제했습니다.');
        });
    }).catch(function(error) {
        alert((error && error.message) || '삭제에 실패하였습니다.');
        button.disabled = false;
    });
}

document.addEventListener('click', function(event) {
    var target = event.target instanceof Element ? event.target : null;
    var button = target ? target.closest('[data-saved-file-id]') : null;
    if (button) {
        deleteSavedFile(button);
    }
});

/* TUS temp는 페이지를 나가도 남긴다. 청크 이어받기가 temp 부분 파일을 사용한다.
   만료된 temp는 서버의 TempFileCleanupJob이 정리한다.
   사용자가 누른 삭제·전체 취소는 즉시 temp를 지운다. */
</script>
</div>

</body>
</html>
