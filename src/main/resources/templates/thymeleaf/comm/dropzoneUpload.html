<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>드롭존 업로드</title>
</head>
<body>

<div layout:fragment="content" class="container-fluid">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">드롭존 업로드</h1>
    </div>

    <form id="detailForm" name="detailForm" method="post">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">파일 첨부 등록</h6>
            </div>
            <div class="card-body">
                <div id="addFileList" class="text-primary font-weight-bold" style="margin-bottom: 10px;"></div>
                <button type="button" class="btn btn-primary btn-sm mb-2" id="fileBtn" onclick="addDropzoneFile();">파일첨부</button>
                <div class="small text-muted">파일을 선택하고 업로드를 마치면 temp 폴더에 바로 저장됩니다.</div>
                <div class="mt-3">
                    <button type="button" class="btn btn-success btn-sm" id="saveButton" onclick="saveDropzoneFiles();" disabled>드롭존 저장</button>
                    <button type="button" class="btn btn-secondary btn-sm" id="allClearButton" onclick="clearDropzoneFiles();" disabled>전체 취소</button>
                </div>
                <div id="dropzoneResult" class="mt-3" role="status" aria-live="polite"></div>
                <input type="hidden" id="atchFileGrpid" name="atchFileGrpid" value="">
                <input type="hidden" id="dropzoneFileData" name="dropzoneFileData" value="">
            </div>
        </div>
    </form>

    <!-- Arkive 최종 경로에 저장된 파일 목록 -->
    <div class="row">
        <div class="col-lg-12 mb-4">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Arkive 저장 파일 목록</h6>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered" width="100%" cellspacing="0">
                            <thead>
                                <tr>
                                    <th>No</th>
                                    <th>파일명</th>
                                    <th>크기 (Bytes)</th>
                                    <th>업로드일시</th>
                                    <th>다운로드</th>
                                    <th>삭제</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${fileList == null or fileList.isEmpty()}">
                                    <td colspan="6" class="text-center">저장된 파일이 없습니다.</td>
                                </tr>
                                <tr th:each="file, iterStat : ${fileList}">
                                    <td th:text="${iterStat.count}">1</td>
                                    <td th:text="${file.orgnlFileNm}">filename.ext</td>
                                    <td th:text="${file.fileSz}">0</td>
                                    <td th:text="${file.regDt}">2026-09-26</td>
                                    <td>
                                        <a th:href="@{/file/downloadFile.do(downloadFileId=${file.fileId})}" class="btn btn-sm btn-primary" target="_blank">다운로드</a>
                                    </td>
                                    <td>
                                        <button type="button" class="btn btn-sm btn-danger" th:attr="data-saved-file-id=${file.fileId}">삭제</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const saveButton = document.getElementById('saveButton');
        const allClearButton = document.getElementById('allClearButton');
        const resultBox = document.getElementById('dropzoneResult');
        const addFileList = document.getElementById('addFileList');
        const fileDataInput = document.getElementById('dropzoneFileData');

        // 팝업에서 temp 폴더로 올린 파일이다. 저장 전에는 DB에 등록되지 않는다.
        let stagedFiles = [];

        function addDropzoneFile() {
            window.open("/system/dropzonePopup", "dropzoneWindow", "top=100,left=300,width=600,height=620,status=no,menubar=no,toolbar=no,resizable=yes");
        }

        function callBackFileUpload(data) {
            const uploadedFiles = JSON.parse(data);
            uploadedFiles.forEach(function (uploadedFile) {
                stagedFiles.push(uploadedFile);
            });
            renderStaged();
            updateButtons();
            resultBox.className = 'mt-3 text-success';
            resultBox.textContent = stagedFiles.length + '개 파일을 temp 폴더에 저장했습니다. 저장을 눌러야 Arkive에 반영됩니다.';
        }

        function updateButtons() {
            saveButton.disabled = stagedFiles.length === 0;
            allClearButton.disabled = stagedFiles.length === 0;
        }

        function renderStaged() {
            addFileList.innerHTML = '';
            stagedFiles.forEach(function (item, index) {
                const row = document.createElement('div');
                row.className = 'file-item';
                row.setAttribute('data-idx', index);

                const name = document.createElement('span');
                name.className = 'file-name';
                name.textContent = item.fileName;

                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'btn btn-danger btn-sm';
                button.textContent = '삭제';
                button.addEventListener('click', function () { removeStaged(index); });

                row.appendChild(name);
                row.appendChild(document.createTextNode(' '));
                row.appendChild(button);
                addFileList.appendChild(row);
            });
            fileDataInput.value = JSON.stringify(stagedFiles);
        }

        async function removeStaged(index) {
            const item = stagedFiles[index];
            if (!item) {
                return;
            }
            if (item.fileId) {
                try {
                    await fetch('/system/tus/' + encodeURIComponent(item.fileId), { method: 'DELETE' });
                } catch (e) {
                    // temp 삭제 실패는 서버 로그에서 확인한다
                }
            }
            stagedFiles.splice(index, 1);
            renderStaged();
            updateButtons();
            if (stagedFiles.length === 0) {
                resultBox.className = 'mt-3';
                resultBox.textContent = '';
            }
        }

        async function clearDropzoneFiles() {
            if (stagedFiles.length === 0) {
                return;
            }
            if (!confirm('선택한 파일을 모두 취소하시겠습니까?')) {
                return;
            }
            for (const item of stagedFiles) {
                if (item.fileId) {
                    try {
                        await fetch('/system/tus/' + encodeURIComponent(item.fileId), { method: 'DELETE', keepalive: true });
                    } catch (e) {
                        // 무시
                    }
                }
            }
            stagedFiles = [];
            renderStaged();
            updateButtons();
            resultBox.className = 'mt-3';
            resultBox.textContent = '';
        }

        async function saveDropzoneFiles() {
            if (stagedFiles.length === 0) {
                alert('저장할 파일이 없습니다.');
                return;
            }

            saveButton.disabled = true;
            resultBox.className = 'mt-3 text-info';
            resultBox.textContent = 'Arkive에 저장 중입니다...';

            const params = new URLSearchParams();
            params.append('files', JSON.stringify(stagedFiles.map(function (item) {
                return { fileId: item.fileId, fileName: item.fileName };
            })));
                params.append('fileType', 'DROPZONE');

            try {
                const response = await fetch('/system/file/saveTempFiles.json', {
                    method: 'POST',
                    body: params
                });
                const payload = await response.json();
                if (!response.ok || payload.success === false) {
                    throw new Error(payload.message || '저장에 실패하였습니다.');
                }
                if (payload.count !== stagedFiles.length) {
                    const savedIds = new Set((payload.files || []).map(function (savedFile) { return savedFile.fileId; }));
                    stagedFiles = stagedFiles.filter(function (item) { return !savedIds.has(item.fileId); });
                    resultBox.className = 'mt-3 text-warning';
                    resultBox.textContent = savedIds.size + '개 저장, ' + stagedFiles.length + '개는 temp에 남아 저장하지 못했습니다.';
                    renderStaged();
                    updateButtons();
                    return;
                }
                resultBox.className = 'mt-3 text-success';
                resultBox.textContent = payload.count + '개 파일을 Arkive에 저장했습니다.';
                stagedFiles = [];
                renderStaged();
                updateButtons();
                window.location.href = '/system/dropzoneUpload';
            } catch (error) {
                resultBox.className = 'mt-3 text-danger';
                resultBox.textContent = error.message;
                updateButtons();
            }
        }

        // 저장 목록에서 삭제 버튼을 누른 파일 한 건을 지운다
        async function deleteSavedFile(button) {
            const fileId = button.getAttribute('data-saved-file-id');
            if (!fileId) {
                return;
            }
            if (!confirm('선택한 저장 파일을 삭제하시겠습니까? 실제 파일과 목록에서 함께 삭제됩니다.')) {
                return;
            }

            button.disabled = true;
            // 구 삭제 API에 fileId를 POST한다
            const params = new URLSearchParams();
            params.append('fileId', fileId);
            try {
                const response = await fetch('/file/setFileDelete.json', {
                    method: 'POST',
                    body: params
                });
                const payload = await response.json();
                // result가 1이 아니면 삭제 실패다
                if (!response.ok || payload.result !== 1) {
                    throw new Error('삭제에 실패하였습니다.');
                }

                const row = button.closest('tr');
                const tbody = row ? row.parentNode : null;
                if (row) {
                    row.remove();
                }
                if (tbody && !tbody.querySelector('tr')) {
                    const emptyRow = document.createElement('tr');
                    emptyRow.innerHTML = '<td colspan="6" class="text-center">저장된 파일이 없습니다.</td>';
                    tbody.appendChild(emptyRow);
                }
                resultBox.className = 'mt-3 text-success';
                resultBox.textContent = '저장 파일을 삭제했습니다.';
            } catch (error) {
                resultBox.className = 'mt-3 text-danger';
                resultBox.textContent = error.message;
                button.disabled = false;
            }
        }

        document.addEventListener('click', function (event) {
            const target = event.target instanceof Element ? event.target : null;
            const button = target ? target.closest('[data-saved-file-id]') : null;
            if (button) {
                deleteSavedFile(button);
            }
        });

        let tempCleanupSent = false;

        function cleanupStagedTemp() {
            if (tempCleanupSent) {
                return;
            }
            tempCleanupSent = true;
            stagedFiles.forEach(function (item) {
                if (item.fileId) {
                    fetch('/system/tus/' + encodeURIComponent(item.fileId), { method: 'DELETE', keepalive: true });
                }
            });
            stagedFiles = [];
        }

        window.addEventListener('pagehide', cleanupStagedTemp);
        window.addEventListener('beforeunload', cleanupStagedTemp);

        renderStaged();
        updateButtons();
    </script>
</div>

</body>
</html>
