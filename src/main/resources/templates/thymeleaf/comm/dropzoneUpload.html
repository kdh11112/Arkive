<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>드롭존 업로드</title>
</head>
<body>

<div layout:fragment="content">
    <h2 class="heading-large">드롭존 업로드</h2>

    <form id="detailForm" name="detailForm" method="post">
        <div class="conts-wrap">
            <div class="fieldset input-form">
                <div class="form-group">
                    <div class="form-tit"><span>파일 첨부 등록</span></div>
                    <div class="form-conts">
                        <div id="addFileList" style="margin-bottom: 10px;"></div>
                        <button type="button" class="krds-btn small primary" id="fileBtn" onclick="addDropzoneFile();">파일첨부</button>
                        <div>파일을 선택하고 업로드를 마치면 temp 폴더에 바로 저장됩니다.</div>
                        <div class="btn-wrap" style="margin-top: 8px;">
                            <button type="button" class="krds-btn small primary" id="saveButton" onclick="saveDropzoneFiles();" disabled>드롭존 저장</button>
                            <button type="button" class="krds-btn small secondary" id="allClearButton" onclick="clearDropzoneFiles();" disabled>전체 취소</button>
                        </div>
                        <div id="dropzoneResult" style="margin-top: 12px;" role="status" aria-live="polite"></div>
                        <input type="hidden" id="atchFileGrpid" name="atchFileGrpid" value="">
                        <input type="hidden" id="dropzoneFileData" name="dropzoneFileData" value="">
                    </div>
                </div>
            </div>
        </div>
    </form>

    <div class="conts-wrap">
        <div class="fieldset">
            <div class="form-group">
                <div class="form-tit"><span>Arkive 저장 파일 목록</span></div>
                <div class="form-conts">
                    <div class="krds-table-wrap">
                        <table class="tbl col data">
                            <caption>Arkive 저장 파일 목록</caption>
                            <thead>
                                <tr>
                                    <th scope="col">No</th>
                                    <th scope="col">파일명</th>
                                    <th scope="col">크기 (Bytes)</th>
                                    <th scope="col">업로드일시</th>
                                    <th scope="col">다운로드</th>
                                    <th scope="col">삭제</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${fileList == null or fileList.isEmpty()}">
                                    <td colspan="6">저장된 파일이 없습니다.</td>
                                </tr>
                                <tr th:each="file, iterStat : ${fileList}">
                                    <td th:text="${iterStat.count}">1</td>
                                    <td th:text="${file.orgnlFileNm}">filename.ext</td>
                                    <td th:text="${file.fileSz}">0</td>
                                    <td th:text="${file.regDt}">2026-09-26</td>
                                    <td>
                                        <a th:href="@{/file/downloadFile.do(downloadFileId=${file.fileId})}" class="krds-btn small secondary" target="_blank">다운로드</a>
                                    </td>
                                    <td>
                                        <button type="button" class="krds-btn small danger" th:attr="data-saved-file-id=${file.fileId}">삭제</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const saveButton = document.getElementById('saveButton');
        const allClearButton = document.getElementById('allClearButton');
        const resultBox = document.getElementById('dropzoneResult');
        const addFileList = document.getElementById('addFileList');
        const fileDataInput = document.getElementById('dropzoneFileData');

        // 팝업에서 temp 폴더로 올린 파일이다. 저장 전에는 DB에 등록되지 않는다.
        let stagedFiles = [];

        function setResult(kind, msg) {
            const colors = { success: '#1a7f37', danger: '#d11f1f', info: '#0b5fc1', warning: '#b25e09' };
            resultBox.style.color = colors[kind] || '';
            resultBox.textContent = msg;
        }

        function addDropzoneFile() {
            window.open("/system/dropzonePopup", "dropzoneWindow", "top=100,left=300,width=600,height=620,status=no,menubar=no,toolbar=no,resizable=yes");
        }

        function callBackFileUpload(data) {
            const uploadedFiles = JSON.parse(data);
            uploadedFiles.forEach(function (uploadedFile) {
                stagedFiles.push(uploadedFile);
            });
            renderStaged();
            updateButtons();
            setResult('success', stagedFiles.length + '개 파일을 temp 폴더에 저장했습니다. 저장을 눌러야 Arkive에 반영됩니다.');
        }

        function updateButtons() {
            saveButton.disabled = stagedFiles.length === 0;
            allClearButton.disabled = stagedFiles.length === 0;
        }

        function renderStaged() {
            addFileList.innerHTML = '';
            stagedFiles.forEach(function (item, index) {
                const row = document.createElement('div');
                row.setAttribute('data-idx', index);

                const name = document.createElement('span');
                name.textContent = item.fileName;

                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'krds-btn small danger';
                button.textContent = '삭제';
                button.addEventListener('click', function () { removeStaged(index); });

                row.appendChild(name);
                row.appendChild(document.createTextNode(' '));
                row.appendChild(button);
                addFileList.appendChild(row);
            });
            fileDataInput.value = JSON.stringify(stagedFiles);
        }

        async function removeStaged(index) {
            const item = stagedFiles[index];
            if (!item) {
                return;
            }
            if (item.fileId) {
                try {
                    await fetch('/system/tus/' + encodeURIComponent(item.fileId), { method: 'DELETE' });
                } catch (e) {
                    // temp 삭제 실패는 서버 로그에서 확인한다
                }
            }
            stagedFiles.splice(index, 1);
            renderStaged();
            updateButtons();
            if (stagedFiles.length === 0) {
                setResult('', '');
            }
        }

        async function clearDropzoneFiles() {
            if (stagedFiles.length === 0) {
                return;
            }
            if (!confirm('선택한 파일을 모두 취소하시겠습니까?')) {
                return;
            }
            for (const item of stagedFiles) {
                if (item.fileId) {
                    try {
                        await fetch('/system/tus/' + encodeURIComponent(item.fileId), { method: 'DELETE', keepalive: true });
                    } catch (e) {
                        // 무시
                    }
                }
            }
            stagedFiles = [];
            renderStaged();
            updateButtons();
            setResult('', '');
        }

        async function saveDropzoneFiles() {
            if (stagedFiles.length === 0) {
                alert('저장할 파일이 없습니다.');
                return;
            }

            saveButton.disabled = true;
            setResult('info', 'Arkive에 저장 중입니다...');

            const params = new URLSearchParams();
            params.append('files', JSON.stringify(stagedFiles.map(function (item) {
                return { fileId: item.fileId, fileName: item.fileName };
            })));
                params.append('fileType', 'DROPZONE');

            try {
                const response = await fetch('/system/file/saveTempFiles.json', {
                    method: 'POST',
                    body: params
                });
                const payload = await response.json();
                if (!response.ok || payload.success === false) {
                    throw new Error(payload.message || '저장에 실패하였습니다.');
                }
                if (payload.count !== stagedFiles.length) {
                    const savedIds = new Set((payload.files || []).map(function (savedFile) { return savedFile.fileId; }));
                    stagedFiles = stagedFiles.filter(function (item) { return !savedIds.has(item.fileId); });
                    setResult('warning', savedIds.size + '개 저장, ' + stagedFiles.length + '개는 temp에 남아 저장하지 못했습니다.');
                    renderStaged();
                    updateButtons();
                    return;
                }
                setResult('success', payload.count + '개 파일을 Arkive에 저장했습니다.');
                stagedFiles = [];
                renderStaged();
                updateButtons();
                window.location.href = '/system/dropzoneUpload';
            } catch (error) {
                setResult('danger', error.message);
                updateButtons();
            }
        }

        // 저장 목록에서 삭제 버튼을 누른 파일 한 건을 지운다
        async function deleteSavedFile(button) {
            const fileId = button.getAttribute('data-saved-file-id');
            if (!fileId) {
                return;
            }
            if (!confirm('선택한 저장 파일을 삭제하시겠습니까? 실제 파일과 목록에서 함께 삭제됩니다.')) {
                return;
            }

            button.disabled = true;
            // 구 삭제 API에 fileId를 POST한다
            const params = new URLSearchParams();
            params.append('fileId', fileId);
            try {
                const response = await fetch('/file/setFileDelete.json', {
                    method: 'POST',
                    body: params
                });
                const payload = await response.json();
                // result가 1이 아니면 삭제 실패다
                if (!response.ok || payload.result !== 1) {
                    throw new Error('삭제에 실패하였습니다.');
                }

                const row = button.closest('tr');
                const tbody = row ? row.parentNode : null;
                if (row) {
                    row.remove();
                }
                if (tbody && !tbody.querySelector('tr')) {
                    const emptyRow = document.createElement('tr');
                    emptyRow.innerHTML = '<td colspan="6">저장된 파일이 없습니다.</td>';
                    tbody.appendChild(emptyRow);
                }
                setResult('success', '저장 파일을 삭제했습니다.');
            } catch (error) {
                setResult('danger', error.message);
                button.disabled = false;
            }
        }

        document.addEventListener('click', function (event) {
            const target = event.target instanceof Element ? event.target : null;
            const button = target ? target.closest('[data-saved-file-id]') : null;
            if (button) {
                deleteSavedFile(button);
            }
        });

        let tempCleanupSent = false;

        function cleanupStagedTemp() {
            if (tempCleanupSent) {
                return;
            }
            tempCleanupSent = true;
            stagedFiles.forEach(function (item) {
                if (item.fileId) {
                    fetch('/system/tus/' + encodeURIComponent(item.fileId), { method: 'DELETE', keepalive: true });
                }
            });
            stagedFiles = [];
        }

        window.addEventListener('pagehide', cleanupStagedTemp);
        window.addEventListener('beforeunload', cleanupStagedTemp);

        renderStaged();
        updateButtons();
    </script>
</div>

</body>
</html>
