<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>약도 등록</title>
    <style>
        #map { width: 100%; height: 320px; border: 1px solid #ddd; border-radius: 6px; margin-top: 8px; }
    </style>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">
        <span th:text="${detail != null ? '약도 수정' : '약도 등록'}">약도 등록</span>
        <div th:replace="~{cmm/doubleSubmit :: badge}"></div>
    </h2>

    <div class="conts-wrap">
        <div class="fieldset input-form">
            <input type="hidden" id="mapId" th:value="${detail != null ? detail['mapId'] : ''}">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <div class="form-group">
                <div class="form-tit"><label for="title">약도명</label></div>
                <div class="form-conts">
                    <input type="text" id="title" class="krds-input" maxlength="200"
                           th:value="${detail != null ? detail['title'] : ''}">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="address">주소</label></div>
                <div class="form-conts">
                    <input type="text" id="address" class="krds-input" maxlength="300"
                           th:value="${detail != null ? detail['address'] : ''}">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="latitude">위도</label></div>
                <div class="form-conts">
                    <input type="text" id="latitude" class="krds-input" style="width: 220px;"
                           placeholder="예: 37.5665" th:value="${detail != null ? detail['latitude'] : ''}">
                    <label for="longitude" style="margin-left: 12px;">경도</label>
                    <input type="text" id="longitude" class="krds-input" style="width: 220px; margin-left: 6px;"
                           placeholder="예: 126.9780" th:value="${detail != null ? detail['longitude'] : ''}">
                    <div style="font-size: 12px; color: #666; margin-top: 4px;">
                        위도와 경도는 함께 입력합니다. 주소→좌표 자동 변환(지오코딩)은 외부 API 계약이 필요해 포함하지 않았습니다.
                    </div>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="description">설명</label></div>
                <div class="form-conts">
                    <textarea id="description" class="krds-input" rows="4" maxlength="2000"
                              style="width: 100%;" th:text="${detail != null ? detail['description'] : ''}"></textarea>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="useYn">사용여부</label></div>
                <div class="form-conts">
                    <select id="useYn" class="krds-form-select" style="width: 160px;">
                        <option value="Y" th:selected="${detail == null or detail['useYn'] == 'Y'}">사용</option>
                        <option value="N" th:selected="${detail != null and detail['useYn'] == 'N'}">중지</option>
                    </select>
                </div>
            </div>

            <div th:if="${detail != null and detail['latitude'] != null}">
                <div class="form-tit">지도 미리보기</div>
                <div th:if="${mapKeyConfigured}">
                    <div id="map"></div>
                </div>
                <div th:if="${!mapKeyConfigured}" style="font-size: 13px; color: #b45309; margin-top: 6px;">
                    카카오 지도 키가 설정되지 않아 미리보기를 표시할 수 없습니다. 좌표는 그대로 저장됩니다.
                </div>
            </div>
        </div>

        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:href="@{/map/mapList}" class="krds-btn medium secondary">목록</a>
            <button type="button" class="krds-btn medium danger" th:if="${detail != null}" onclick="fnDelete()">삭제</button>
            <button type="button" id="saveBtn" class="krds-btn medium primary"
                    th:text="${detail != null ? '수정' : '등록'}" onclick="fnSave()">저장</button>
        </div>
    </div>

    <script th:if="${detail != null and detail['latitude'] != null and mapKeyConfigured}"
            th:src="'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + ${kakaoMapKey} + '&autoload=false'"></script>
    <script th:inline="javascript">
        var latitude = /*[[${detail != null ? detail['latitude'] : null}]]*/ null;
        var longitude = /*[[${detail != null ? detail['longitude'] : null}]]*/ null;
        var mapKeyConfigured = /*[[${mapKeyConfigured}]]*/ false;

        if (mapKeyConfigured && latitude != null && longitude != null
                && window.kakao && kakao.maps) {
            kakao.maps.load(function() {
                var container = document.getElementById('map');
                var position = new kakao.maps.LatLng(Number(latitude), Number(longitude));
                var map = new kakao.maps.Map(container, { center: position, level: 3 });
                new kakao.maps.Marker({ position: position }).setMap(map);
            });
        }

        function fnSave() {
            var mapId = $('#mapId').val();
            if (($('#title').val() || '').trim() === '') { alert('약도명을 입력하세요.'); return; }
            var latitude = ($('#latitude').val() || '').trim();
            var longitude = ($('#longitude').val() || '').trim();
            if ((latitude === '') !== (longitude === '')) {
                alert('위도와 경도는 함께 입력하세요.'); return;
            }
            $.ajax({
                type: 'post',
                url: mapId ? '/map/updateMapGuide.json' : '/map/insertMapGuide.json',
                data: {
                    mapId: mapId,
                    title: $('#title').val(),
                    address: $('#address').val(),
                    latitude: latitude,
                    longitude: longitude,
                    description: $('#description').val(),
                    useYn: $('#useYn').val(),
                    'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val()
                },
                beforeSend: function() { $('#saveBtn').prop('disabled', true); },
                complete: function() { $('#saveBtn').prop('disabled', false); },
                success: function(res) {
                    if (res.success) { location.href = '/map/mapList'; }
                    else { alert(res.message || '저장에 실패했습니다.'); }
                },
                error: function() { alert('저장 중 오류가 발생했습니다.'); }
            });
        }

        function fnDelete() {
            if (!confirm('약도를 삭제하시겠습니까?')) { return; }
            $.ajax({
                type: 'post',
                url: '/map/deleteMapGuide.json',
                data: { mapId: $('#mapId').val() },
                success: function(res) {
                    if (res.success) { location.href = '/map/mapList'; }
                    else { alert(res.message || '삭제에 실패했습니다.'); }
                },
                error: function() { alert('삭제 중 오류가 발생했습니다.'); }
            });
        }
    </script>
</div>
</body>
</html>
