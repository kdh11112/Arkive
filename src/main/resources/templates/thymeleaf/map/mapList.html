<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>약도관리</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">약도관리</h2>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <p style="color: #555; margin: 0;">
            주소와 위·경도를 등록하면 상세 화면에서 카카오 지도로 위치를 표시합니다.
            <span th:if="${!mapKeyConfigured}" style="color: #b45309;">
                (카카오 지도 키 미설정: KAKAO_MAP_KEY 환경값을 넣으면 지도가 표시됩니다)
            </span>
        </p>
        <a th:href="@{/map/mapWrite}" class="krds-btn medium primary">등록</a>
    </div>

    <form id="listForm" method="get" th:action="@{/map/mapList}">
        <input type="hidden" id="pageIndex" name="pageIndex" th:value="${pageIndex}">
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <select name="useYn" class="krds-form-select" style="width: 120px;">
                <option value="" th:selected="${useYn == ''}">전체 사용</option>
                <option value="Y" th:selected="${useYn == 'Y'}">사용</option>
                <option value="N" th:selected="${useYn == 'N'}">중지</option>
            </select>
            <input type="text" name="searchKeyword" class="krds-input" style="flex: 1;"
                   placeholder="약도명·주소 검색" th:value="${searchKeyword}">
            <button type="submit" class="krds-btn medium secondary"
                    onclick="document.getElementById('pageIndex').value=1;">검색</button>
        </div>
    </form>

    <div class="krds-table-wrap">
        <table class="tbl col data">
            <caption>약도 목록</caption>
            <colgroup>
                <col style="width: 24%;">
                <col style="width: 30%;">
                <col style="width: 20%;">
                <col style="width: 8%;">
                <col>
            </colgroup>
            <thead>
            <tr>
                <th scope="col">약도명</th>
                <th scope="col">주소</th>
                <th scope="col">좌표</th>
                <th scope="col">사용</th>
                <th scope="col">관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${resultList}">
                <td>
                    <a th:href="@{/map/mapView}" data-post
                       th:attr="data-name='mapId',data-value=${item['mapId']}"
                       th:text="${item['title']}"></a>
                </td>
                <td th:text="${item['address']}"></td>
                <td>
                    <span th:if="${item['latitude'] == null}" style="color: #888;">미지정</span>
                    <span th:if="${item['latitude'] != null}"
                          th:text="${item['latitude']} + ', ' + ${item['longitude']}"></span>
                </td>
                <td th:text="${item['useYn'] == 'Y' ? '사용' : '중지'}"></td>
                <td style="white-space: nowrap;">
                    <a th:href="@{/map/mapView}" data-post
                       th:attr="data-name='mapId',data-value=${item['mapId']}"
                       class="krds-btn small secondary">보기</a>
                    <a th:href="@{/map/mapWrite}" data-post
                       th:attr="data-name='mapId',data-value=${item['mapId']}"
                       class="krds-btn small secondary">수정</a>
                    <button type="button" class="krds-btn small danger"
                            th:attr="data-id=${item['mapId']}" onclick="fnDelete(this)">삭제</button>
                </td>
            </tr>
            <tr th:if="${resultList == null or resultList.isEmpty()}">
                <td colspan="5">조회된 약도가 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div id="paging" class="krds-pagination w-page"
         th:utext="${#egovKrdsPaginationRenderer.renderPagination(paginationInfo, 'mapPaging')}"></div>
    <script>
        function mapPaging(pageIndex) {
            document.getElementById('pageIndex').value = pageIndex;
            document.getElementById('listForm').submit();
        }
        function fnDelete(btn) {
            if (!confirm('약도를 삭제하시겠습니까?')) { return; }
            $.ajax({
                type: 'post',
                url: '/map/deleteMapGuide.json',
                data: { mapId: btn.getAttribute('data-id') },
                success: function(res) {
                    if (res.success) { location.reload(); }
                    else { alert(res.message || '삭제에 실패했습니다.'); }
                },
                error: function() { alert('삭제 중 오류가 발생했습니다.'); }
            });
        }
    </script>
</div>
</body>
</html>
