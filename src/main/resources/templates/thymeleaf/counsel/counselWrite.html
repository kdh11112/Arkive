<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>상담 등록</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large"><span th:text="${detail != null ? '상담 수정' : '상담 등록'}">상담 등록</span><div th:replace="~{cmm/doubleSubmit :: badge}"></div></h2>
    <div class="conts-wrap">
        <div class="fieldset input-form">
            <input type="hidden" id="counselId" th:value="${detail != null ? detail['counselId'] : ''}">
            <input type="hidden" id="atchFileGrpid" th:value="${detail != null ? detail['atchFileGrpid'] : ''}">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <div class="form-group">
                <div class="form-tit"><label for="title">제목</label></div>
                <div class="form-conts"><input type="text" id="title" class="krds-input" th:value="${detail != null ? detail['title'] : ''}"></div>
            </div>
            <div class="form-group" th:if="${detail == null}">
                <div class="form-tit"><label for="writer">작성자</label></div>
                <div class="form-conts"><input type="text" id="writer" class="krds-input" maxlength="50"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="password">비밀번호 (수정·삭제 확인용)</label></div>
                <div class="form-conts"><input type="password" id="password" class="krds-input" maxlength="50"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="content">내용</label></div>
                <div class="form-conts"><textarea id="content" class="krds-input" rows="8" style="width: 100%;" th:text="${detail != null ? detail['content'] : ''}"></textarea></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="file">첨부파일 (최대 3개)</label></div>
                <div class="form-conts">
                    <input type="file" id="file" multiple onchange="fnUploadFiles()">
                    <ul id="fileList" style="margin-top: 8px;"></ul>
                </div>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:href="@{/counsel/counselList}" class="krds-btn medium secondary">목록</a>
            <button type="button" id="saveBtn" class="krds-btn medium primary" th:text="${detail != null ? '수정' : '등록'}" onclick="fnSaveCounsel()">저장</button>
        </div>
    </div>
<script th:inline="javascript">
    var counselGrpid = $('#atchFileGrpid').val() || '';
    (function initFiles() {
        var files = /*[[${fileList}]]*/ null;
        if (files) { renderFiles(files); }
    })();
    function renderFiles(files) {
        var ul = document.getElementById('fileList');
        ul.innerHTML = '';
        files.forEach(function(f) {
            var li = document.createElement('li');
            li.textContent = f.fileName || f.orgnlFileNm || f.fileId;
            ul.appendChild(li);
        });
    }
    function fnUploadFiles() {
        var input = document.getElementById('file');
        if (input.files.length === 0) { return; }
        var fd = new FormData();
        for (var i = 0; i < input.files.length; i++) { fd.append('file', input.files[i]); }
        fd.append('atchFileGrpid', counselGrpid);
        $.ajax({
            type: 'POST', url: '/counsel/counselFileUpload.json', data: fd,
            processData: false, contentType: false,
            success: function(res) {
                if (res.success) {
                    counselGrpid = res.grpid;
                    $('#atchFileGrpid').val(res.grpid);
                    renderFiles(res.files);
                } else { alert(res.message || '업로드에 실패했습니다.'); }
                input.value = '';
            },
            error: function() { alert('업로드 중 오류가 발생했습니다.'); input.value = ''; }
        });
    }
    function fnSaveCounsel() {
        if (window._counselSaving) { return; }
        var title = ($('#title').val() || '').trim();
        if (title === '') {
            alert('제목을 입력하세요.');
            $('#title').focus();
            return;
        }
        if (($('#password').val() || '') === '') {
            alert('비밀번호를 입력하세요.');
            $('#password').focus();
            return;
        }
        var counselId = $('#counselId').val();
        var isUpdate = counselId !== '';
        $.ajax({
            type: 'post',
            url: isUpdate ? '/counsel/updateCounsel.json' : '/counsel/insertCounsel.json',
            data: { counselId: counselId, title: title, content: $('#content').val(), writer: $('#writer').val(), password: $('#password').val(), atchFileGrpid: counselGrpid, 'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val() },
            beforeSend: function() { window._counselSaving = true; $('#saveBtn').prop('disabled', true); },
            complete: function() { window._counselSaving = false; $('#saveBtn').prop('disabled', false); },
            success: function(res) {
                if (res.success) { location.href = '/counsel/counselList'; }
                else { alert(res.message || '저장에 실패했습니다.'); }
            },
            error: function() { alert('저장 중 오류가 발생했습니다.'); }
        });
    }
</script>
</div>
</body>
</html>
