<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>상담관리</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">상담관리</h2>

    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
        <div>
            <a th:href="@{/counsel/answerList}" class="krds-btn medium secondary">관리자 답변 목록</a>
        </div>
        <div>
            <a th:href="@{/counsel/counselWrite}" class="krds-btn medium primary">등록</a>
        </div>
    </div>

    <form id="listForm" method="post" th:action="@{/counsel/counselList}">
        <input type="hidden" id="pageIndex" name="pageIndex" th:value="${pageIndex}">
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <input type="text" name="searchKeyword" class="krds-input" style="flex: 1;" placeholder="작성자·제목 검색" th:value="${searchKeyword}">
            <button type="submit" class="krds-btn medium secondary" onclick="document.getElementById('pageIndex').value=1;">검색</button>
        </div>
    </form>

    <div class="krds-table-wrap">
        <table class="tbl col data">
            <caption>상담 목록</caption>
            <colgroup>
                <col style="width: 8%;">
                <col>
                <col style="width: 12%;">
                <col style="width: 10%;">
                <col style="width: 12%;">
            </colgroup>
            <thead>
            <tr>
                <th scope="col">번호</th>
                <th scope="col">제목</th>
                <th scope="col">작성자</th>
                <th scope="col">상태</th>
                <th scope="col">등록일</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item, stat : ${resultList}">
                <td th:text="${paginationInfo.totalRecordCount + 1 - ((pageIndex - 1) * paginationInfo.recordCountPerPage + stat.count)}"></td>
                <td><a th:href="@{/counsel/counselDetail}" data-post th:attr="data-name='counselId',data-value=${item['counselId']}" th:text="${item['title']}"></a></td>
                <td th:text="${item['writer']}"></td>
                <td th:text="${item['status']}"></td>
                <td th:text="${item['registDt'] != null ? #dates.format(item['registDt'], 'yyyy-MM-dd') : ''}"></td>
            </tr>
            <tr th:if="${resultList == null or resultList.isEmpty()}">
                <td colspan="5">조회된 상담이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div id="paging" class="krds-pagination w-page" th:utext="${#egovKrdsPaginationRenderer.renderPagination(paginationInfo, 'counselPaging')}"></div>
<script>
    function counselPaging(pageIndex) {
        document.getElementById('pageIndex').value = pageIndex;
        document.getElementById('listForm').submit();
    }
</script>
</div>
</body>
</html>
