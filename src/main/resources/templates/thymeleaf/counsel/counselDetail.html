<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>상담 상세보기</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">상담 상세보기</h2>
    <div class="conts-wrap" th:if="${detail != null}">
        <div class="fieldset input-form">
            <div class="form-group">
                <div class="form-tit">제목</div>
                <div class="form-conts"><p th:text="${detail['title']}"></p></div>
            </div>
            <div class="form-group">
                <div class="form-tit">작성자 · 상태</div>
                <div class="form-conts"><p th:text="${detail['writer']} + ' · ' + ${detail['status']}"></p></div>
            </div>
            <div class="form-group">
                <div class="form-tit">내용</div>
                <div class="form-conts"><p th:text="${detail['content']}" style="white-space: pre-wrap;"></p></div>
            </div>
            <div class="form-group" th:if="${fileList != null and !fileList.isEmpty()}">
                <div class="form-tit">첨부파일</div>
                <div class="form-conts">
                    <ul>
                        <li th:each="f : ${fileList}"><a th:href="@{/file/downloadFile.do(downloadFileId=${f['fileId']})}" th:text="${f['orgnlFileNm']}"></a></li>
                    </ul>
                </div>
            </div>
            <div class="form-group" th:if="${detail['answer'] != null and detail['answer'] != ''}">
                <div class="form-tit">답변</div>
                <div class="form-conts"><p th:text="${detail['answer']}" style="white-space: pre-wrap;"></p></div>
            </div>
        </div>

        <!-- 비밀번호 확인 후 수정·삭제를 연다 -->
        <div style="display: flex; gap: 8px; margin-top: 8px;">
            <input type="password" id="password" class="krds-input" style="width: 200px;" placeholder="비밀번호">
            <button type="button" class="krds-btn medium secondary" onclick="fnCheckPassword()">확인</button>
        </div>
        <div id="editBtns" style="display: none; gap: 8px; justify-content: flex-end; margin-top: 8px;">
            <a th:href="@{/counsel/counselWrite}" data-post th:attr="data-name='counselId',data-value=${detail['counselId']}" class="krds-btn small secondary">수정</a>
            <button type="button" class="krds-btn small danger" onclick="fnDeleteCounsel()">삭제</button>
        </div>

        <!-- 관리자 답변 (1단계 제약: 권한 미분리, 2단계에서 분리 예정) -->
        <h3 class="heading-small" style="margin-top: 16px;">답변 등록·수정</h3>
        <div style="display: flex; gap: 8px; margin-bottom: 8px;">
            <select id="status" class="krds-form-select" style="width: 150px;">
                <option value="접수대기" th:selected="${detail['status'] == '접수대기'}">접수대기</option>
                <option value="접수" th:selected="${detail['status'] == '접수'}">접수</option>
                <option value="완료" th:selected="${detail['status'] == '완료'}">완료</option>
            </select>
        </div>
        <div class="form-conts"><textarea id="answer" class="krds-input" rows="6" style="width: 100%;" th:text="${detail['answer']}"></textarea></div>
        <div style="display: flex; justify-content: flex-end; margin-top: 8px;">
            <button type="button" id="answerBtn" class="krds-btn medium primary" onclick="fnSaveAnswer()">답변저장</button>
        </div>
    </div>
    <div style="margin-top: 12px;">
        <a th:href="@{/counsel/counselList}" class="krds-btn medium secondary">목록</a>
    </div>
<script th:inline="javascript">
    var counselId = /*[[${detail != null ? detail['counselId'] : ''}]]*/ '';
    var counselUnlocked = false;
    function fnCheckPassword() {
        var pw = ($('#password').val() || '');
        if (pw === '') {
            alert('비밀번호를 입력하세요.');
            return;
        }
        $.ajax({
            type: 'post',
            url: '/counsel/checkPassword.json',
            data: { counselId: counselId, password: pw },
            success: function(res) {
                if (res.success) {
                    counselUnlocked = true;
                    document.getElementById('editBtns').style.display = 'flex';
                    alert('확인되었습니다.');
                } else { alert(res.message || '비밀번호가 틀립니다.'); }
            },
            error: function() { alert('확인 중 오류가 발생했습니다.'); }
        });
    }
    function fnDeleteCounsel() {
        if (!counselUnlocked) {
            alert('먼저 비밀번호를 확인하세요.');
            return;
        }
        if (!confirm('첨부를 포함해 삭제하시겠습니까?')) { return; }
        $.ajax({
            type: 'post',
            url: '/counsel/deleteCounsel.json',
            data: { counselId: counselId, password: $('#password').val() },
            success: function(res) {
                if (res.success) { location.href = '/counsel/counselList'; }
                else { alert(res.message || '삭제에 실패했습니다.'); }
            },
            error: function() { alert('삭제 중 오류가 발생했습니다.'); }
        });
    }
    function fnSaveAnswer() {
        if (window._ansSaving) { return; }
        $.ajax({
            type: 'post',
            url: '/counsel/updateCounselAnswer.json',
            data: { counselId: counselId, answer: $('#answer').val(), status: $('#status').val() },
            beforeSend: function() { window._ansSaving = true; $('#answerBtn').prop('disabled', true); },
            complete: function() { window._ansSaving = false; $('#answerBtn').prop('disabled', false); },
            success: function(res) {
                if (res.success) { location.reload(); }
                else { alert(res.message || '저장에 실패했습니다.'); }
            },
            error: function() { alert('저장 중 오류가 발생했습니다.'); }
        });
    }
</script>
</div>
</body>
</html>
