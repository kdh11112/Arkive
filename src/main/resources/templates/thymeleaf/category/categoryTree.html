<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>카테고리 트리</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">카테고리 (트리형)</h2>

    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 8px;">
        <a th:href="@{/category/drill}" class="krds-btn medium secondary">드릴다운형으로 보기</a>
        <button type="button" class="krds-btn medium primary" onclick="fnAddRoot()">최상위 추가</button>
    </div>

    <!-- jstree 라이브러리 없이 서버 렌더 트리. tree.json(jstree 규격)은 외부 이식용으로 별도 제공한다. -->
    <div id="treeWrap" th:utext="${treeHtml}"></div>
    <p th:if="${treeHtml == null or treeHtml == ''}">등록된 카테고리가 없습니다.</p>

    <div id="editBox" style="display: none; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-top: 12px;">
        <input type="hidden" id="catId">
        <input type="hidden" id="upCatId">
        <input type="hidden" id="doubleSubmitToken" name="egovframework.double.submit.preventer.parameter.name" th:value="${doubleSubmitToken}">
        <div style="display: flex; gap: 8px;">
            <input type="text" id="catNm" class="krds-input" style="flex: 1;" placeholder="카테고리 이름" maxlength="200">
            <input type="text" id="ordr" class="krds-input" style="width: 80px;" placeholder="순서" value="0">
            <button type="button" class="krds-btn medium primary" onclick="fnSaveCat()">저장</button>
            <button type="button" class="krds-btn medium secondary" onclick="document.getElementById('editBox').style.display='none';">취소</button>
        </div>
    </div>
<script>
    function showEdit(catId, upCatId, catNm) {
        document.getElementById('catId').value = catId || '';
        document.getElementById('upCatId').value = upCatId || '';
        document.getElementById('catNm').value = catNm || '';
        document.getElementById('editBox').style.display = 'block';
        document.getElementById('catNm').focus();
    }
    function fnAddRoot() { showEdit('', '', ''); }
    function fnAddChild(btn) { showEdit('', btn.getAttribute('data-id'), ''); }
    function fnEditCat(btn) {
        document.getElementById('ordr').value = btn.getAttribute('data-ord') || '0';
        showEdit(btn.getAttribute('data-id'), btn.getAttribute('data-up'), btn.getAttribute('data-nm'));
    }
    function fnSaveCat() {
        var nm = ($('#catNm').val() || '').trim();
        if (nm === '') {
            alert('카테고리 이름을 입력하세요.');
            return;
        }
        $.ajax({
            type: 'post',
            url: '/category/saveCategory.json',
            data: { catId: $('#catId').val(), upCatId: $('#upCatId').val(), catNm: nm, ordr: $('#ordr').val(), 'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val() },
            success: function(res) {
                if (res.success) { location.reload(); }
                else { alert(res.message || '저장에 실패했습니다.'); }
            },
            error: function() { alert('저장 중 오류가 발생했습니다.'); }
        });
    }
    function fnDeleteCat(btn) {
        if (!confirm('하위가 있으면 삭제할 수 없습니다. 삭제하시겠습니까?')) { return; }
        $.ajax({
            type: 'post',
            url: '/category/deleteCategory.json',
            data: { catId: btn.getAttribute('data-id') },
            success: function(res) {
                if (res.success) { location.reload(); }
                else { alert(res.message || '삭제에 실패했습니다.'); }
            },
            error: function() { alert('삭제 중 오류가 발생했습니다.'); }
        });
    }
</script>
</div>
</body>
</html>
