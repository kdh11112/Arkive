<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>당직 등록</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large"><span th:text="${detail != null ? '당직 수정' : '당직 등록'}">당직 등록</span><div th:replace="~{cmm/doubleSubmit :: badge}"></div></h2>
    <div class="conts-wrap">
        <div class="fieldset input-form">
            <input type="hidden" id="dutyId" th:value="${detail != null ? detail['dutyId'] : ''}">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <div class="form-group">
                <div class="form-tit"><label for="dutyDe">날짜</label></div>
                <div class="form-conts"><input type="date" id="dutyDe" class="krds-input" onclick="this.showPicker()" th:value="${detail != null ? #strings.substring(detail['dutyDe'],0,4) + '-' + #strings.substring(detail['dutyDe'],4,6) + '-' + #strings.substring(detail['dutyDe'],6,8) : ''}"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="dutyUser">당직자</label></div>
                <div class="form-conts"><input type="text" id="dutyUser" class="krds-input" maxlength="100" th:value="${detail != null ? detail['dutyUser'] : ''}"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="note">비고</label></div>
                <div class="form-conts"><input type="text" id="note" class="krds-input" maxlength="500" th:value="${detail != null ? detail['note'] : ''}"></div>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:href="@{/duty/dutyList}" class="krds-btn medium secondary">목록</a>
            <button type="button" class="krds-btn medium danger" th:if="${detail != null}" onclick="fnDeleteDuty()">삭제</button>
            <button type="button" id="saveBtn" class="krds-btn medium primary" th:text="${detail != null ? '수정' : '등록'}" onclick="fnSaveDuty()">저장</button>
        </div>
    </div>
<script>
    function fnSaveDuty() {
        if (window._dutySaving) { return; }
        if (($('#dutyDe').val() || '').trim() === '' || ($('#dutyUser').val() || '').trim() === '') {
            alert('날짜와 당직자를 입력하세요.');
            return;
        }
        var dutyId = $('#dutyId').val();
        var isUpdate = dutyId !== '';
        $.ajax({
            type: 'post',
            url: isUpdate ? '/duty/updateDuty.json' : '/duty/insertDuty.json',
            data: { dutyId: dutyId, dutyDe: $('#dutyDe').val(), dutyUser: $('#dutyUser').val(), note: $('#note').val(), 'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val() },
            beforeSend: function() { window._dutySaving = true; $('#saveBtn').prop('disabled', true); },
            complete: function() { window._dutySaving = false; $('#saveBtn').prop('disabled', false); },
            success: function(res) {
                if (res.success) { location.href = '/duty/dutyList'; }
                else { alert(res.message || '저장에 실패했습니다.'); }
            },
            error: function() { alert('저장 중 오류가 발생했습니다.'); }
        });
    }
    function fnDeleteDuty() {
        if (!confirm('삭제하시겠습니까?')) { return; }
        $.ajax({
            type: 'post',
            url: '/duty/deleteDuty.json',
            data: { dutyId: $('#dutyId').val() },
            success: function(res) {
                if (res.success) { location.href = '/duty/dutyList'; }
                else { alert(res.message || '삭제에 실패했습니다.'); }
            },
            error: function() { alert('삭제 중 오류가 발생했습니다.'); }
        });
    }
</script>
</div>
</body>
</html>
