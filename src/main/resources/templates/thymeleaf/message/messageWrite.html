<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>쪽지쓰기</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">쪽지쓰기<div th:replace="~{cmm/doubleSubmit :: badge}"></div></h2>
    <div class="conts-wrap">
        <div class="fieldset input-form">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <div class="form-group">
                <div class="form-tit"><label for="receiverId">받는 사람 아이디</label></div>
                <div class="form-conts">
                    <input type="text" id="receiverId" class="krds-input" maxlength="50"
                           placeholder="사용자 아이디" th:value="${receiverId != null ? receiverId : ''}">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="title">제목</label></div>
                <div class="form-conts">
                    <input type="text" id="title" class="krds-input" maxlength="200">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="content">내용</label></div>
                <div class="form-conts">
                    <textarea id="content" class="krds-input" rows="10" maxlength="4000"
                              style="width: 100%;"></textarea>
                </div>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:href="@{/message/inbox}" class="krds-btn medium secondary">목록</a>
            <button type="button" id="sendBtn" class="krds-btn medium primary" onclick="fnSendMessage()">보내기</button>
        </div>
    </div>
    <script>
        function fnSendMessage() {
            if (window._messageSending) { return; }
            var receiverId = ($('#receiverId').val() || '').trim();
            var title = ($('#title').val() || '').trim();
            var content = $('#content').val() || '';
            if (receiverId === '') {
                alert('받는 사람 아이디를 입력하세요.');
                $('#receiverId').focus();
                return;
            }
            if (title === '') {
                alert('제목을 입력하세요.');
                $('#title').focus();
                return;
            }
            if (content.trim() === '') {
                alert('내용을 입력하세요.');
                $('#content').focus();
                return;
            }
            $.ajax({
                type: 'post',
                url: '/message/insertMessage.json',
                data: {
                    receiverId: receiverId,
                    title: title,
                    content: content,
                    'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val()
                },
                beforeSend: function() {
                    window._messageSending = true;
                    $('#sendBtn').prop('disabled', true);
                },
                complete: function() {
                    window._messageSending = false;
                    $('#sendBtn').prop('disabled', false);
                },
                success: function(res) {
                    if (res.success) { location.href = '/message/sent'; }
                    else { alert(res.message || '발송에 실패했습니다.'); }
                },
                error: function() { alert('발송 중 오류가 발생했습니다.'); }
            });
        }
    </script>
</div>
</body>
</html>
