<!-- KRDS 측면 내비게이션. DB 메뉴(grad 2/3)를 그대로 렌더한다. 토글 동작은 ui-script.js가 담당한다. -->
<nav class="krds-side-navigation" th:fragment="left">
    <h2 class="lnb-tit">아카이브</h2>
    <ul class="lnb-list" role="menubar">
        <li class="lnb-item" role="none">
            <a href="/" class="lnb-btn lnb-link" role="menuitem">Dashboard</a>
        </li>
        <th:block th:each="menu : ${menuList}" th:if="${menu['grad'] == 2}">
        <li class="lnb-item" role="none">
            <button type="button" class="lnb-btn lnb-toggle" role="menuitem"
                    th:aria-controls="'lnbmenu-' + ${menu['menuId']}" aria-expanded="false"
                    th:text="${menu['menuNm']}">메뉴명</button>
            <div class="lnb-submenu">
                <ul th:id="'lnbmenu-' + ${menu['menuId']}" role="menu">
                    <th:block th:each="subMenu : ${menuList}" th:if="${subMenu['grad'] == 3 and subMenu['parent'] == menu['menuId']}">
                    <li class="lnb-subitem" role="none">
                        <a th:href="${subMenu['menuCours']}" class="lnb-btn lnb-link" role="menuitem" th:text="${subMenu['menuNm']}">하위메뉴명</a>
                    </li>
                    </th:block>
                </ul>
            </div>
        </li>
        </th:block>
    </ul>
</nav>
