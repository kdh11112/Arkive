<html xmlns:th="http://www.thymeleaf.org" th:fragment="left">
        <!-- Sidebar -->
        <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">

            <!-- Sidebar - Brand -->
            <a class="sidebar-brand d-flex align-items-center justify-content-center" href="/">
                <div class="sidebar-brand-icon rotate-n-15">
                    <i class="fas fa-laugh-wink"></i>
                </div>
                <div class="sidebar-brand-text mx-3">아카이브</div>
            </a>

            <!-- Divider -->
            <hr class="sidebar-divider my-0">

            <!-- Nav Item - Dashboard -->
            <li class="nav-item active">
                <a class="nav-link" href="/">
                    <i class="fas fa-fw fa-tachometer-alt"></i>
                    <span>Dashboard</span></a>
            </li>

            <!-- Divider -->
            <hr class="sidebar-divider">

            <!-- Heading -->
            <div class="sidebar-heading">
                Interface
            </div>


          <th:block th:each="menu : ${menuList}"
          th:if="${menu['grad'] == 2}">

    <li class="nav-item">

        <a class="nav-link collapsed"
           href="#"
           data-toggle="collapse"
           th:data-target="'#collapse_' + ${menu['menuId']}"
           aria-expanded="false"
           th:aria-controls="'collapse_' + ${menu['menuId']}">

            <i class="fas fa-fw fa-folder"></i>

            <span th:text="${menu['menuNm']}">
                메뉴명
            </span>

        </a>


        <div th:id="'collapse_' + ${menu['menuId']}"
             class="collapse"
             data-parent="#accordionSidebar">

            <div class="bg-white py-2 collapse-inner rounded">
                <th:block th:each="subMenu : ${menuList}"
                          th:if="${subMenu['grad'] == 3
                              and subMenu['parent'] == menu['menuId']}">

                    <a class="collapse-item"
                       th:href="${subMenu['menuCours']}"
                       th:text="${subMenu['menuNm']}">
                        하위메뉴명
                    </a>

                </th:block>

            </div>
        </div>

    </li>

</th:block>

            <!-- Divider -->
            <hr class="sidebar-divider d-none d-md-block">

            <!-- Sidebar Toggler (Sidebar) -->
            <div class="text-center d-none d-md-inline">
                <button class="rounded-circle border-0" id="sidebarToggle"></button>
            </div>

        </ul>
        <!-- End of Sidebar -->
</html>
