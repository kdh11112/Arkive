<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head th:replace="~{layout/header :: header}"></head>

<body>

<div id="wrap">

    <!-- KRDS 서비스 헤더 -->
    <header id="krds-header">
        <div class="header-in">
            <div class="header-container">
                <div class="inner">
                    <div class="header-branding">
                        <h2 style="margin: 0; font-size: 2.4rem; font-weight: 700;">
                            <a href="/" style="text-decoration: none; color: inherit;">아카이브</a>
                        </h2>
                    </div>
                    <div class="header-actions">
                        <span class="krds-btn small text" th:text="${session.LOGIN_USER != null ? session.LOGIN_USER['userNm'] : '관리자'}">관리자</span>
                        <a th:if="${session.LOGIN_USER != null}" th:href="@{/login/logout}" class="krds-btn small secondary">로그아웃</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 본문: 측면 내비 + 콘텐츠 -->
    <div id="container">
        <div class="inner sub">
            <div th:replace="~{layout/left :: left}"></div>
            <main layout:fragment="content">
                공통 레이아웃
            </main>
        </div>
    </div>

    <footer th:replace="~{layout/footer :: footer}"></footer>

    <!-- 새 글 전역 알림. 어느 화면에 있어도 CK·토스트 새 글이 오면 뜬다 -->
    <div id="globalPostBanner" style="display: none; position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 2000;">
        <button type="button" id="globalPostBtn" class="krds-btn medium primary" onclick="goNewPostBoard();">새 글이 등록되었습니다. 이동</button>
    </div>

</div>

<script>
    // 전역 SSE 구독. CK·토스트 두 통로를 열어 둔다.
    // 목록이 아닌 화면(상세·글쓰기·메뉴 등)에서도 새 글을 알려주기 위함이다.
    //
    // 화면별 조절 (각 페이지 inline script에서 layout script보다 먼저 선언한다):
    //   window.ARKIVE_SSE = { banner: false };      // 이 화면에서는 배너 숨김
    //   window.ARKIVE_SSE = { hideAfterMs: 30000 }; // 30초 뒤 자동 숨김 (기본 0=계속 표시)
    var globalPostBoard = '';
    function goNewPostBoard() {
        if (globalPostBoard === 'TOAST') {
            location.href = '/board/toastList';
        } else {
            location.href = '/board/ckeditorList';
        }
    }
    // 새 글 실시간 알림(SSE) 구독 처리. 통로는 1개만 연다.
    // (CK·TOAST 2개를 열면 브라우저 연결 상한을 잡아먹어 메뉴 이동이 멈춘다)
    //
    // SSE(Server-Sent Events)란:
    // 서버가 브라우저에 한 방향으로 밀어넣는 기술이다. WebSocket과 달리
    // 별도 설치 없이 HTTP 하나로 되며, 끊기면 브라우저가 알아서 다시 붙는다.
    //
    // 동작 순서:
    // 1) 아래에서 ALL 통로 1개를 연다.
    //    (GET /board/subscribe?boardType=ALL, BoardSseService가 통로를 보관)
    // 2) 누군가 글을 등록(insertBoard 성공)하면 서버가 해당 게시판+ALL 통로로
    //    {boardId,title,boardType}을 쏜다(BoardSseService.broadcast).
    // 3) onmessage가 불리면 상단 배너를 보여준다. 버튼을 누르면 그 게시판 목록으로 간다.
    // 4) hideAfterMs(밀리초, 기본 0=계속 표시)가 있으면 그 뒤 배너를 숨긴다.
    //
    // 화면별 조절: 이 스크립트보다 먼저 실행되는 페이지 inline 스크립트에서 선언한다.
    //   window.ARKIVE_SSE = { banner: false };      // 이 화면에서는 구독 안 함
    //   window.ARKIVE_SSE = { hideAfterMs: 30000 }; // 30초 뒤 자동 숨김
    (function() {
        // SSE 전체 킬스위치. false면 어떤 화면에서도 구독하지 않는다. 켜려면 true.
        var ARKIVE_SSE_ENABLED = false;
        if (!ARKIVE_SSE_ENABLED) return;
        var cfg = window.ARKIVE_SSE || {};
        if (cfg.banner === false) return;
        var hideAfterMs = cfg.hideAfterMs || 0;
        var banner = document.getElementById('globalPostBanner');
        var hideTimer = null;
        try {
            var source = new EventSource('/board/subscribe?boardType=ALL');
            source.onmessage = function(e) {
                try {
                    var data = JSON.parse(e.data);
                    globalPostBoard = data.boardType || '';
                } catch (err) {
                    globalPostBoard = '';
                }
                banner.style.display = 'block';
                if (hideTimer) clearTimeout(hideTimer);
                if (hideAfterMs > 0) {
                    hideTimer = setTimeout(function() { banner.style.display = 'none'; }, hideAfterMs);
                }
            };
        } catch (err) {
            // 구형 브라우저는 알림 없이 쓴다.
        }
    })();
</script>

</body>
</html>
