<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>배너 등록</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large"><span th:text="${detail != null ? '배너 수정' : '배너 등록'}">배너 등록</span><div th:replace="~{cmm/doubleSubmit :: badge}"></div></h2>
    <div class="conts-wrap">
        <div class="fieldset input-form">
            <input type="hidden" id="bannerId" th:value="${detail != null ? detail['bannerId'] : ''}">
            <input type="hidden" id="atchFileGrpid" th:value="${detail != null ? detail['atchFileGrpid'] : ''}">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <div class="form-group">
                <div class="form-tit"><label for="title">제목</label></div>
                <div class="form-conts"><input type="text" id="title" class="krds-input" th:value="${detail != null ? detail['title'] : ''}"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="position">노출위치</label></div>
                <div class="form-conts">
                    <select id="position" class="krds-form-select">
                        <option value="BANNER" th:selected="${detail == null or detail['position'] == 'BANNER'}">일반 배너</option>
                        <option value="MAIN" th:selected="${detail != null and detail['position'] == 'MAIN'}">메인이미지</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="image">이미지 (PNG/JPG/GIF/BMP, 실형식 검증됨)</label></div>
                <div class="form-conts">
                    <input type="file" id="image" accept=".png,.jpg,.jpeg,.gif,.bmp" onchange="fnUploadImage()">
                    <div style="margin-top: 8px;"><img id="preview" style="max-width: 400px; display: none;"></div>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="startYmd">게시기간</label></div>
                <div class="form-conts" style="display: flex; flex-direction: row; gap: 8px; align-items: center; flex-wrap: nowrap;">
                    <input type="date" id="startYmd" class="krds-input" style="flex: 1; min-width: 0;" onclick="this.showPicker()" th:value="${detail != null ? #strings.substring(detail['startYmd'],0,4) + '-' + #strings.substring(detail['startYmd'],4,6) + '-' + #strings.substring(detail['startYmd'],6,8) : ''}">
                    <span>~</span>
                    <input type="date" id="endYmd" class="krds-input" style="flex: 1; min-width: 0;" onclick="this.showPicker()" th:value="${detail != null ? #strings.substring(detail['endYmd'],0,4) + '-' + #strings.substring(detail['endYmd'],4,6) + '-' + #strings.substring(detail['endYmd'],6,8) : ''}">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="linkUrl">연결 URL</label></div>
                <div class="form-conts"><input type="text" id="linkUrl" class="krds-input" th:value="${detail != null ? detail['linkUrl'] : ''}"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="ordr">노출순서</label></div>
                <div class="form-conts"><input type="text" id="ordr" class="krds-input" th:value="${detail != null ? detail['ordr'] : '0'}"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="useYn">사용여부</label></div>
                <div class="form-conts">
                    <select id="useYn" class="krds-form-select">
                        <option value="Y" th:selected="${detail == null or detail['useYn'] == 'Y'}">사용</option>
                        <option value="N" th:selected="${detail != null and detail['useYn'] == 'N'}">미사용</option>
                    </select>
                </div>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:href="@{/banner/bannerList}" class="krds-btn medium secondary">목록</a>
            <button type="button" class="krds-btn medium danger" th:if="${detail != null}" onclick="fnDeleteBanner()">삭제</button>
            <button type="button" id="saveBtn" class="krds-btn medium primary" th:text="${detail != null ? '수정' : '등록'}" onclick="fnSaveBanner()">저장</button>
        </div>
    </div>
<script th:inline="javascript">
    var bannerGrpid = $('#atchFileGrpid').val() || '';
    (function initPreview() {
        var g = /*[[${detail != null ? detail['atchFileGrpid'] : ''}]]*/ '';
        var files = /*[[${fileList}]]*/ null;
        if (g && files && files.length > 0) {
            $('#preview').attr('src', '/file/downloadFile.do?downloadFileId=' + files[0].fileId).show();
        }
    })();
    function fnUploadImage() {
        var f = document.getElementById('image').files[0];
        if (!f) { return; }
        var fd = new FormData();
        fd.append('image', f);
        $.ajax({
            type: 'POST', url: '/banner/bannerImageUpload.json', data: fd,
            processData: false, contentType: false,
            success: function(res) {
                if (res.success) {
                    bannerGrpid = res.grpid;
                    $('#atchFileGrpid').val(res.grpid);
                    $('#preview').attr('src', res.url).show();
                } else { alert(res.message || '이미지 업로드에 실패했습니다.'); }
            },
            error: function() { alert('이미지 업로드 중 오류가 발생했습니다.'); }
        });
    }
    function fnSaveBanner() {
        if (window._bannerSaving) { return; }
        var title = ($('#title').val() || '').trim();
        if (title === '') {
            alert('제목을 입력하세요.');
            $('#title').focus();
            return;
        }
        var bannerId = $('#bannerId').val();
        var isUpdate = bannerId !== '';
        $.ajax({
            type: 'post',
            url: isUpdate ? '/banner/updateBanner.json' : '/banner/insertBanner.json',
            data: { bannerId: bannerId, title: title, position: $('#position').val(), startYmd: $('#startYmd').val(), endYmd: $('#endYmd').val(), linkUrl: $('#linkUrl').val(), ordr: $('#ordr').val(), useYn: $('#useYn').val(), atchFileGrpid: bannerGrpid, 'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val() },
            beforeSend: function() { window._bannerSaving = true; $('#saveBtn').prop('disabled', true); },
            complete: function() { window._bannerSaving = false; $('#saveBtn').prop('disabled', false); },
            success: function(res) {
                if (res.success) { location.href = '/banner/bannerList'; }
                else { alert(res.message || '저장에 실패했습니다.'); }
            },
            error: function() { alert('저장 중 오류가 발생했습니다.'); }
        });
    }
    function fnDeleteBanner() {
        if (!confirm('이미지를 포함해 삭제하시겠습니까?')) { return; }
        $.ajax({
            type: 'post',
            url: '/banner/deleteBanner.json',
            data: { bannerId: $('#bannerId').val() },
            success: function(res) {
                if (res.success) { location.href = '/banner/bannerList'; }
                else { alert(res.message || '삭제에 실패했습니다.'); }
            },
            error: function() { alert('삭제 중 오류가 발생했습니다.'); }
        });
    }
</script>
</div>
</body>
</html>
