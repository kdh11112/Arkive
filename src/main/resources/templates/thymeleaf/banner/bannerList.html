<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>배너관리</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">배너관리 (일반 배너 + 메인이미지)</h2>

    <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;">
        <a th:href="@{/banner/bannerWrite}" class="krds-btn medium primary">등록</a>
    </div>

    <form id="listForm" method="post" th:action="@{/banner/bannerList}">
        <input type="hidden" id="pageIndex" name="pageIndex" th:value="${pageIndex}">
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <select name="position" class="krds-form-select" style="width: 150px;" onchange="document.getElementById('pageIndex').value=1; document.getElementById('listForm').submit();">
                <option value="">전체위치</option>
                <option value="BANNER" th:selected="${position == 'BANNER'}">일반 배너</option>
                <option value="MAIN" th:selected="${position == 'MAIN'}">메인이미지</option>
            </select>
            <input type="text" name="searchKeyword" class="krds-input" style="flex: 1;" placeholder="제목 검색" th:value="${searchKeyword}">
            <button type="submit" class="krds-btn medium secondary" onclick="document.getElementById('pageIndex').value=1;">검색</button>
        </div>
    </form>

    <div class="krds-table-wrap">
        <table class="tbl col data">
            <caption>배너 목록</caption>
            <colgroup>
                <col style="width: 6%;">
                <col>
                <col style="width: 10%;">
                <col style="width: 16%;">
                <col style="width: 6%;">
                <col style="width: 6%;">
            </colgroup>
            <thead>
            <tr>
                <th scope="col">번호</th>
                <th scope="col">제목</th>
                <th scope="col">위치</th>
                <th scope="col">게시기간</th>
                <th scope="col">순서</th>
                <th scope="col">사용</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item, stat : ${resultList}">
                <td th:text="${paginationInfo.totalRecordCount + 1 - ((pageIndex - 1) * paginationInfo.recordCountPerPage + stat.count)}"></td>
                <td><a th:href="@{/banner/bannerWrite}" data-post th:attr="data-name='bannerId',data-value=${item['bannerId']}" th:text="${item['title']}"></a></td>
                <td th:text="${item['position']}"></td>
                <td th:text="${item['startYmd']} + ' ~ ' + ${item['endYmd']}"></td>
                <td th:text="${item['ordr']}"></td>
                <td th:text="${item['useYn']}"></td>
            </tr>
            <tr th:if="${resultList == null or resultList.isEmpty()}">
                <td colspan="6">조회된 배너가 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div id="paging" class="krds-pagination w-page" th:utext="${#egovKrdsPaginationRenderer.renderPagination(paginationInfo, 'bannerPaging')}"></div>
<script>
    function bannerPaging(pageIndex) {
        document.getElementById('pageIndex').value = pageIndex;
        document.getElementById('listForm').submit();
    }
</script>
</div>
</body>
</html>
