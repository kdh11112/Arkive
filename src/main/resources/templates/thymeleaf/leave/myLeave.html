<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>내 휴가</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">내 휴가<div th:replace="~{cmm/doubleSubmit :: badge}"></div></h2>

    <form id="yearForm" method="post" th:action="@{/leave/myLeave}"
          style="display: flex; gap: 8px; margin-bottom: 12px;">
        <input type="number" name="leaveYear" class="krds-input" style="width: 140px;"
               min="2000" max="2100" th:value="${leaveYear}">
        <button type="submit" class="krds-btn medium secondary">조회</button>
    </form>

    <div th:if="${balance != null}" style="display: flex; gap: 12px; margin-bottom: 16px;">
        <div class="krds-card" style="flex: 1; padding: 16px;">
            <div style="font-size: 13px; color: #555;">총 연차</div>
            <div style="font-size: 22px; font-weight: bold;"
                 th:text="${#numbers.formatDecimal(balance['totalDays'], 1, 1)} + '일'"></div>
        </div>
        <div class="krds-card" style="flex: 1; padding: 16px;">
            <div style="font-size: 13px; color: #555;">사용 연차</div>
            <div style="font-size: 22px; font-weight: bold;"
                 th:text="${#numbers.formatDecimal(balance['usedDays'], 1, 1)} + '일'"></div>
        </div>
        <div class="krds-card" style="flex: 1; padding: 16px;">
            <div style="font-size: 13px; color: #555;">잔여 연차</div>
            <div style="font-size: 22px; font-weight: bold; color: #2f7cf6;"
                 th:text="${#numbers.formatDecimal(balance['remainDays'], 1, 1)} + '일'"></div>
        </div>
    </div>
    <p th:if="${balance == null}"
       style="padding: 12px; margin-bottom: 16px; background: #fff4e5; border: 1px solid #f0c36d; border-radius: 4px;"
       th:text="${leaveYear} + '년 연차 정보가 없습니다. 관리자에게 연차 부여를 요청하세요.'"></p>

    <div class="conts-wrap" style="margin-bottom: 20px;">
        <div class="fieldset input-form">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <div class="form-group">
                <div class="form-tit"><label for="leaveType">휴가 유형</label></div>
                <div class="form-conts">
                    <select id="leaveType" class="krds-form-select" style="width: 180px;"
                            onchange="fnSyncEndDate()">
                        <option value="FULL">연차</option>
                        <option value="HALF_AM">오전반차 (0.5일)</option>
                        <option value="HALF_PM">오후반차 (0.5일)</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="startDe">시작일</label></div>
                <div class="form-conts">
                    <input type="date" id="startDe" class="krds-input" onchange="fnSyncEndDate()">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="endDe">종료일</label></div>
                <div class="form-conts">
                    <input type="date" id="endDe" class="krds-input">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="reason">휴가 사유</label></div>
                <div class="form-conts">
                    <textarea id="reason" class="krds-input" rows="3" maxlength="500"
                              style="width: 100%;"></textarea>
                </div>
            </div>
        </div>
        <div style="display: flex; justify-content: flex-end; margin-top: 8px;">
            <button type="button" id="insertBtn" class="krds-btn medium primary"
                    onclick="fnInsertLeave()">휴가 신청</button>
        </div>
    </div>

    <div class="krds-table-wrap">
        <table class="tbl col data">
            <caption>내 휴가 신청 목록</caption>
            <colgroup>
                <col style="width: 18%;">
                <col style="width: 10%;">
                <col style="width: 7%;">
                <col>
                <col style="width: 10%;">
                <col style="width: 11%;">
                <col style="width: 9%;">
            </colgroup>
            <thead>
            <tr>
                <th scope="col">기간</th>
                <th scope="col">유형</th>
                <th scope="col">일수</th>
                <th scope="col">사유</th>
                <th scope="col">상태</th>
                <th scope="col">신청일</th>
                <th scope="col">관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${resultList}">
                <td th:text="${item['startDe']} + ' ~ ' + ${item['endDe']}"></td>
                <td th:text="${item['leaveType'] == 'HALF_AM' ? '오전반차' : (item['leaveType'] == 'HALF_PM' ? '오후반차' : '연차')}"></td>
                <td th:text="${#numbers.formatDecimal(item['days'], 1, 1)} + '일'"></td>
                <td th:text="${item['reason']}"></td>
                <td>
                    <span class="krds-badge"
                          th:text="${item['status'] == 'REQUESTED' ? '대기' : (item['status'] == 'APPROVED' ? '승인' : (item['status'] == 'REJECTED' ? '반려' : '취소'))}"></span>
                    <div th:if="${item['rejectReason'] != null and item['rejectReason'] != ''}"
                         th:text="'반려사유: ' + ${item['rejectReason']}"
                         style="font-size: 12px; color: #b42318; margin-top: 4px;"></div>
                </td>
                <td th:text="${item['registDt'] != null ? #dates.format(item['registDt'], 'yyyy-MM-dd HH:mm') : ''}"></td>
                <td>
                    <button type="button" class="krds-btn small danger"
                            th:if="${item['status'] == 'REQUESTED' or item['status'] == 'APPROVED'}"
                            th:attr="data-id=${item['leaveId']}"
                            onclick="fnCancelLeave(this)">취소</button>
                </td>
            </tr>
            <tr th:if="${resultList == null or resultList.isEmpty()}">
                <td colspan="7">신청한 휴가가 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>
    <script>
        function fnSyncEndDate() {
            var type = $('#leaveType').val();
            if (type !== 'FULL') {
                $('#endDe').val($('#startDe').val());
            }
        }
        function fnInsertLeave() {
            var type = $('#leaveType').val();
            var startDe = ($('#startDe').val() || '').trim();
            var endDe = ($('#endDe').val() || '').trim();
            var reason = ($('#reason').val() || '').trim();
            if (startDe === '' || endDe === '') {
                alert('휴가 기간을 입력하세요.');
                return;
            }
            if (type !== 'FULL' && startDe !== endDe) {
                alert('반차는 시작일과 종료일이 같아야 합니다.');
                return;
            }
            if (reason === '') {
                alert('휴가 사유를 입력하세요.');
                $('#reason').focus();
                return;
            }
            $.ajax({
                type: 'post',
                url: '/leave/insertLeave.json',
                data: {
                    leaveType: type,
                    startDe: startDe,
                    endDe: endDe,
                    reason: reason,
                    'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val()
                },
                beforeSend: function() { $('#insertBtn').prop('disabled', true); },
                complete: function() { $('#insertBtn').prop('disabled', false); },
                success: function(res) {
                    if (res.success) { location.reload(); }
                    else { alert(res.message || '휴가 신청에 실패했습니다.'); }
                },
                error: function() { alert('휴가 신청 중 오류가 발생했습니다.'); }
            });
        }
        function fnCancelLeave(btn) {
            if (!confirm('이 휴가를 취소하시겠습니까?')) { return; }
            $.ajax({
                type: 'post',
                url: '/leave/cancelLeave.json',
                data: { leaveId: btn.getAttribute('data-id') },
                success: function(res) {
                    if (res.success) { location.reload(); }
                    else { alert(res.message || '취소에 실패했습니다.'); }
                },
                error: function() { alert('취소 중 오류가 발생했습니다.'); }
            });
        }
    </script>
</div>
</body>
</html>
