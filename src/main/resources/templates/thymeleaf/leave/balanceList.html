<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>연차관리</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">연차관리</h2>

    <form id="listForm" method="post" th:action="@{/leave/balanceList}">
        <input type="hidden" id="pageIndex" name="pageIndex" th:value="${pageIndex}">
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <input type="number" name="leaveYear" class="krds-input" style="width: 120px;"
                   min="2000" max="2100" th:value="${leaveYear}">
            <input type="text" name="searchKeyword" class="krds-input" style="flex: 1;"
                   placeholder="아이디·이름 검색" th:value="${searchKeyword}">
            <button type="submit" class="krds-btn medium secondary"
                    onclick="document.getElementById('pageIndex').value=1;">검색</button>
        </div>
    </form>

    <div style="display: flex; gap: 8px; margin-bottom: 12px; align-items: center;">
        <select id="balanceUserId" class="krds-form-select" style="width: 220px;">
            <option value="">사용자 선택</option>
            <option th:each="user : ${userList}" th:value="${user['userId']}"
                    th:text="${user['userNm']} + ' (' + ${user['userId']} + ')'"></option>
        </select>
        <input type="number" id="balanceYear" class="krds-input" style="width: 100px;"
               min="2000" max="2100" th:value="${leaveYear}" title="연도">
        <input type="number" id="balanceTotalDays" class="krds-input" style="width: 120px;"
               min="0" max="999.9" step="0.5" placeholder="총 연차(일)">
        <button type="button" class="krds-btn medium primary" onclick="fnSaveBalance()">연차 부여·수정</button>
        <span style="font-size: 12px; color: #666;">이미 사용한 일수보다 적게는 부여할 수 없습니다.</span>
    </div>

    <div class="krds-table-wrap">
        <table class="tbl col data">
            <caption>연차 현황</caption>
            <colgroup>
                <col style="width: 20%;">
                <col style="width: 8%;">
                <col style="width: 12%;">
                <col style="width: 12%;">
                <col style="width: 12%;">
                <col style="width: 16%;">
                <col style="width: 10%;">
            </colgroup>
            <thead>
            <tr>
                <th scope="col">사용자</th>
                <th scope="col">연도</th>
                <th scope="col">총 연차</th>
                <th scope="col">사용</th>
                <th scope="col">잔여</th>
                <th scope="col">수정일</th>
                <th scope="col">관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${resultList}">
                <td>
                    <div th:text="${item['userNm']}"></div>
                    <div th:text="${item['userId']}" style="font-size: 12px; color: #666;"></div>
                </td>
                <td th:text="${item['leaveYear']}"></td>
                <td th:text="${#numbers.formatDecimal(item['totalDays'], 1, 1)} + '일'"></td>
                <td th:text="${#numbers.formatDecimal(item['usedDays'], 1, 1)} + '일'"></td>
                <td th:text="${#numbers.formatDecimal(item['remainDays'], 1, 1)} + '일'"></td>
                <td th:text="${item['updtDt'] != null ? #dates.format(item['updtDt'], 'yyyy-MM-dd HH:mm') : ''}"></td>
                <td>
                    <button type="button" class="krds-btn small secondary"
                            th:attr="data-user=${item['userId']},data-year=${item['leaveYear']},data-total=${item['totalDays']}"
                            onclick="fnLoadBalance(this)">불러오기</button>
                </td>
            </tr>
            <tr th:if="${resultList == null or resultList.isEmpty()}">
                <td colspan="7">조회된 연차가 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div id="paging" class="krds-pagination w-page"
         th:utext="${#egovKrdsPaginationRenderer.renderPagination(paginationInfo, 'balancePaging')}"></div>
    <script>
        function balancePaging(pageIndex) {
            document.getElementById('pageIndex').value = pageIndex;
            document.getElementById('listForm').submit();
        }
        function fnLoadBalance(btn) {
            $('#balanceUserId').val(btn.getAttribute('data-user'));
            $('#balanceYear').val(btn.getAttribute('data-year'));
            $('#balanceTotalDays').val(btn.getAttribute('data-total'));
        }
        function fnSaveBalance() {
            var userId = $('#balanceUserId').val();
            var leaveYear = ($('#balanceYear').val() || '').trim();
            var totalDays = ($('#balanceTotalDays').val() || '').trim();
            if (!userId) {
                alert('사용자를 선택하세요.');
                return;
            }
            if (!/^[0-9]{4}$/.test(leaveYear)) {
                alert('연도는 YYYY 형식으로 입력하세요.');
                return;
            }
            if (totalDays === '') {
                alert('총 연차 일수를 입력하세요.');
                return;
            }
            $.ajax({
                type: 'post',
                url: '/leave/saveBalance.json',
                data: { userId: userId, leaveYear: leaveYear, totalDays: totalDays },
                success: function(res) {
                    if (res.success) { location.reload(); }
                    else { alert(res.message || '저장에 실패했습니다.'); }
                },
                error: function() { alert('저장 중 오류가 발생했습니다.'); }
            });
        }
    </script>
</div>
</body>
</html>
