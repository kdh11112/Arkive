<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>회의실예약</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">회의실예약<div th:replace="~{cmm/doubleSubmit :: badge}"></div></h2>

    <form method="post" th:action="@{/meeting/reserveList}"
          style="display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;">
        <input type="date" name="reserveDe" class="krds-input" style="width: 170px;"
               th:value="${reserveDe}">
        <select name="roomId" class="krds-form-select" style="width: 180px;">
            <option value="">전체 회의실</option>
            <option th:each="room : ${roomList}" th:value="${room['roomId']}" th:text="${room['roomNm']}"
                    th:selected="${roomId == room['roomId']}"></option>
        </select>
        <input type="text" name="searchKeyword" class="krds-input" style="width: 200px;"
               placeholder="제목·예약자" th:value="${searchKeyword}">
        <button type="submit" class="krds-btn medium secondary">조회</button>
    </form>

    <div class="conts-wrap" style="margin-bottom: 20px;">
        <div class="fieldset input-form">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <div class="form-group">
                <div class="form-tit"><label for="roomId">회의실</label></div>
                <div class="form-conts">
                    <select id="roomId" class="krds-form-select" style="width: 220px;">
                        <option th:each="room : ${roomList}" th:value="${room['roomId']}"
                                th:text="${room['roomNm'] + ' (' + (room['location'] ?: '') + ')'}"
                                th:selected="${roomId == room['roomId']}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="reserveDeInput">예약일</label></div>
                <div class="form-conts">
                    <input type="date" id="reserveDeInput" class="krds-input"
                           style="width: 170px;" th:value="${reserveDe}">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="startTime">시간</label></div>
                <div class="form-conts" style="display: flex; gap: 6px; align-items: center;">
                    <input type="time" id="startTime" class="krds-input" style="width: 130px;" value="09:00">
                    <span>~</span>
                    <input type="time" id="endTime" class="krds-input" style="width: 130px;" value="10:00">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="title">제목</label></div>
                <div class="form-conts">
                    <input type="text" id="title" class="krds-input" maxlength="200">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="purpose">사용 목적</label></div>
                <div class="form-conts">
                    <textarea id="purpose" class="krds-input" rows="2" maxlength="500" style="width: 100%;"></textarea>
                </div>
            </div>
        </div>
        <div style="display: flex; justify-content: flex-end; margin-top: 8px;">
            <button type="button" id="insertBtn" class="krds-btn medium primary"
                    onclick="fnInsertReservation()">예약</button>
        </div>
    </div>

    <div class="krds-table-wrap">
        <table class="tbl col data">
            <caption>회의실 예약 목록</caption>
            <colgroup>
                <col style="width: 12%;">
                <col style="width: 15%;">
                <col style="width: 14%;">
                <col>
                <col style="width: 12%;">
                <col style="width: 10%;">
            </colgroup>
            <thead>
            <tr>
                <th scope="col">예약일</th>
                <th scope="col">회의실</th>
                <th scope="col">시간</th>
                <th scope="col">제목</th>
                <th scope="col">예약자</th>
                <th scope="col">관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${resultList}">
                <td th:text="${item['reserveDe']}"></td>
                <td th:text="${item['roomNm'] + ' (' + (item['location'] ?: '') + ')'}"></td>
                <td th:text="${item['startTime']} + ' ~ ' + ${item['endTime']}"></td>
                <td>
                    <span th:text="${item['title']}"></span>
                    <div th:if="${item['purpose'] != null and item['purpose'] != ''}"
                         th:text="${item['purpose']}"
                         style="font-size: 12px; color: #555; margin-top: 2px;"></div>
                </td>
                <td th:text="${item['userNm'] ?: item['userId']}"></td>
                <td>
                    <button type="button" class="krds-btn small danger"
                            th:if="${session.LOGIN_USER != null and (session.ADMIN_USER != null or item['userId'] == session.LOGIN_USER['userId'])}"
                            th:attr="data-id=${item['reserveId']}"
                            onclick="fnCancelReservation(this)">취소</button>
                </td>
            </tr>
            <tr th:if="${resultList == null or resultList.isEmpty()}">
                <td colspan="6">예약이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <script>
        function fnInsertReservation() {
            var roomId = $('#roomId').val();
            var reserveDe = ($('#reserveDeInput').val() || '').trim();
            var startTime = ($('#startTime').val() || '').trim();
            var endTime = ($('#endTime').val() || '').trim();
            var title = ($('#title').val() || '').trim();
            if (!roomId || !reserveDe || !startTime || !endTime) {
                alert('회의실·예약일·시간을 입력하세요.');
                return;
            }
            if (title === '') {
                alert('예약 제목을 입력하세요.');
                $('#title').focus();
                return;
            }
            $.ajax({
                type: 'post',
                url: '/meeting/insertReservation.json',
                data: {
                    roomId: roomId,
                    reserveDe: reserveDe,
                    startTime: startTime,
                    endTime: endTime,
                    title: title,
                    purpose: $('#purpose').val(),
                    'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val()
                },
                beforeSend: function() { $('#insertBtn').prop('disabled', true); },
                complete: function() { $('#insertBtn').prop('disabled', false); },
                success: function(res) {
                    if (res.success) { location.reload(); }
                    else { alert(res.message || '예약에 실패했습니다.'); }
                },
                error: function() { alert('예약 중 오류가 발생했습니다.'); }
            });
        }
        function fnCancelReservation(btn) {
            if (!confirm('이 예약을 취소하시겠습니까?')) { return; }
            $.ajax({
                type: 'post',
                url: '/meeting/cancelReservation.json',
                data: { reserveId: btn.getAttribute('data-id') },
                success: function(res) {
                    if (res.success) { location.reload(); }
                    else { alert(res.message || '취소에 실패했습니다.'); }
                },
                error: function() { alert('취소 중 오류가 발생했습니다.'); }
            });
        }
    </script>
</div>
</body>
</html>
