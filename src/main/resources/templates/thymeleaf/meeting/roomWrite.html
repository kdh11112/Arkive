<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>회의실 등록</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large"><span th:text="${detail != null ? '회의실 수정' : '회의실 등록'}">회의실 등록</span><div th:replace="~{cmm/doubleSubmit :: badge}"></div></h2>
    <div class="conts-wrap">
        <div class="fieldset input-form">
            <input type="hidden" id="roomId" th:value="${detail != null ? detail['roomId'] : ''}">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <div class="form-group">
                <div class="form-tit"><label for="roomNm">회의실명</label></div>
                <div class="form-conts">
                    <input type="text" id="roomNm" class="krds-input" maxlength="100"
                           th:value="${detail != null ? detail['roomNm'] : ''}">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="location">위치</label></div>
                <div class="form-conts">
                    <input type="text" id="location" class="krds-input" maxlength="200"
                           th:value="${detail != null ? detail['location'] : ''}">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="capacity">수용인원</label></div>
                <div class="form-conts">
                    <input type="number" id="capacity" class="krds-input" min="0" max="100000"
                           th:value="${detail != null ? detail['capacity'] : 0}">
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="useYn">사용여부</label></div>
                <div class="form-conts">
                    <select id="useYn" class="krds-form-select" style="width: 160px;">
                        <option value="Y" th:selected="${detail == null or detail['useYn'] == 'Y'}">사용</option>
                        <option value="N" th:selected="${detail != null and detail['useYn'] == 'N'}">중지</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="remark">비고</label></div>
                <div class="form-conts">
                    <textarea id="remark" class="krds-input" rows="3" maxlength="500"
                              style="width: 100%;" th:text="${detail != null ? detail['remark'] : ''}"></textarea>
                </div>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:href="@{/meeting/roomList}" class="krds-btn medium secondary">목록</a>
            <button type="button" id="saveBtn" class="krds-btn medium primary"
                    th:text="${detail != null ? '수정' : '등록'}" onclick="fnSaveRoom()">저장</button>
        </div>
    </div>
    <script>
        function fnSaveRoom() {
            var roomId = $('#roomId').val();
            var roomNm = ($('#roomNm').val() || '').trim();
            if (roomNm === '') {
                alert('회의실명을 입력하세요.');
                $('#roomNm').focus();
                return;
            }
            $.ajax({
                type: 'post',
                url: roomId ? '/meeting/updateRoom.json' : '/meeting/insertRoom.json',
                data: {
                    roomId: roomId,
                    roomNm: roomNm,
                    location: $('#location').val(),
                    capacity: $('#capacity').val(),
                    useYn: $('#useYn').val(),
                    remark: $('#remark').val(),
                    'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val()
                },
                beforeSend: function() { $('#saveBtn').prop('disabled', true); },
                complete: function() { $('#saveBtn').prop('disabled', false); },
                success: function(res) {
                    if (res.success) { location.href = '/meeting/roomList'; }
                    else { alert(res.message || '저장에 실패했습니다.'); }
                },
                error: function() { alert('저장 중 오류가 발생했습니다.'); }
            });
        }
    </script>
</div>
</body>
</html>
