<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>FAQ관리</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">FAQ관리</h2>

    <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;">
        <a th:href="@{/faq/faqWrite}" class="krds-btn medium primary">등록</a>
    </div>

    <form id="listForm" method="post" th:action="@{/faq/faqList}">
        <input type="hidden" id="pageIndex" name="pageIndex" th:value="${pageIndex}">
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <input type="text" name="searchKeyword" class="krds-input" style="flex: 1;" placeholder="제목 검색" th:value="${searchKeyword}">
            <button type="submit" class="krds-btn medium secondary" onclick="document.getElementById('pageIndex').value=1;">검색</button>
        </div>
    </form>

    <!-- BLMS faqList 아코디언을 네이티브 details로 단순화. JS 의존성 없음(이식 용이). -->
    <div class="faq-list">
        <details th:each="item : ${resultList}" style="border: 1px solid #ddd; border-radius: 8px; margin-bottom: 8px; padding: 8px 12px;">
            <summary th:text="${item['title']}" style="cursor: pointer; font-weight: 600;"></summary>
            <div th:text="${item['content']}" style="white-space: pre-wrap; margin-top: 8px;"></div>
            <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px;">
                <a th:href="@{/faq/faqWrite}" data-post th:attr="data-name='boardId',data-value=${item['boardId']}" class="krds-btn small secondary">수정</a>
                <button type="button" class="krds-btn small danger" th:attr="data-board-id=${item['boardId']}" onclick="fnDeleteFaq(this)">삭제</button>
            </div>
        </details>
        <p th:if="${resultList == null or resultList.isEmpty()}">조회된 FAQ가 없습니다.</p>
    </div>

    <div id="paging" class="krds-pagination w-page" th:utext="${#egovKrdsPaginationRenderer.renderPagination(paginationInfo, 'faqPaging')}"></div>
<script>
    function faqPaging(pageIndex) {
        document.getElementById('pageIndex').value = pageIndex;
        document.getElementById('listForm').submit();
    }
    function fnDeleteFaq(btn) {
        var boardId = btn.getAttribute('data-board-id');
        if (!confirm('삭제하시겠습니까?')) { return; }
        $.ajax({
            type: 'post',
            url: '/faq/deleteFaq.json',
            data: { boardId: boardId },
            success: function(res) {
                if (res.success) { location.reload(); }
                else { alert(res.message || '삭제에 실패했습니다.'); }
            },
            error: function() { alert('삭제 중 오류가 발생했습니다.'); }
        });
    }
</script>
</div>
</body>
</html>
