<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>FAQ 등록</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large"><span th:text="${detail != null ? 'FAQ 수정' : 'FAQ 등록'}">FAQ 등록</span><div th:replace="~{cmm/doubleSubmit :: badge}"></div></h2>
    <div class="conts-wrap">
        <div class="fieldset input-form">
            <input type="hidden" id="boardId" th:value="${detail != null ? detail['boardId'] : ''}">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <div class="form-group">
                <div class="form-tit"><label for="title">질문</label></div>
                <div class="form-conts"><input type="text" id="title" class="krds-input" th:value="${detail != null ? detail['title'] : ''}"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="content">답변 (에디터 없이 텍스트만. HTML 태그는 저장 시 정제됨)</label></div>
                <div class="form-conts"><textarea id="content" class="krds-input" rows="10" style="width: 100%;" th:text="${detail != null ? detail['content'] : ''}"></textarea></div>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:href="@{/faq/faqList}" class="krds-btn medium secondary">목록</a>
            <button type="button" id="saveBtn" class="krds-btn medium primary" th:text="${detail != null ? '수정' : '등록'}" onclick="fnSaveFaq()">저장</button>
        </div>
    </div>
<script>
    function fnSaveFaq() {
        if (window._faqSaving) { return; }
        var title = ($('#title').val() || '').trim();
        if (title === '') {
            alert('제목을 입력하세요.');
            $('#title').focus();
            return;
        }
        var boardId = $('#boardId').val();
        var isUpdate = boardId !== '';
        $.ajax({
            type: 'post',
            url: isUpdate ? '/faq/updateFaq.json' : '/faq/insertFaq.json',
            data: { boardId: boardId, title: title, content: $('#content').val(), 'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val() },
            beforeSend: function() { window._faqSaving = true; $('#saveBtn').prop('disabled', true); },
            complete: function() { window._faqSaving = false; $('#saveBtn').prop('disabled', false); },
            success: function(res) {
                if (res.success) { location.href = '/faq/faqList'; }
                else { alert(res.message || '저장에 실패했습니다.'); }
            },
            error: function() { alert('저장 중 오류가 발생했습니다.'); }
        });
    }
</script>
</div>
</body>
</html>
