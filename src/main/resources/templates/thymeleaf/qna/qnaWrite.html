<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title th:text="${detail != null ? 'Q&A 수정' : 'Q&A 등록'}">Q&A 등록</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large"><span th:text="${detail != null ? 'Q&A 수정' : 'Q&A 등록'}">Q&A 등록</span><div th:replace="~{cmm/doubleSubmit :: badge}"></div></h2>
    <div class="conts-wrap">
        <div class="fieldset input-form">
            <input type="hidden" id="boardId" th:value="${detail != null ? detail['boardId'] : ''}">
            <div th:replace="~{cmm/doubleSubmit :: token}"></div>
            <div class="form-group">
                <div class="form-tit"><label for="title">질문</label></div>
                <div class="form-conts"><input type="text" id="title" class="krds-input" th:value="${detail != null ? detail['title'] : ''}"></div>
            </div>
            <div class="form-group" th:if="${detail == null}">
                <div class="form-tit"><label for="register">작성자 (미입력 시 익명)</label></div>
                <div class="form-conts"><input type="text" id="register" class="krds-input" maxlength="50"></div>
            </div>
            <div class="form-group">
                <div class="form-tit"><label for="content">내용</label></div>
                <div class="form-conts"><textarea id="content" class="krds-input" rows="10" style="width: 100%;" th:text="${detail != null ? detail['content'] : ''}"></textarea></div>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <a th:href="@{/qna/qnaList}" class="krds-btn medium secondary">목록</a>
            <button type="button" id="saveBtn" class="krds-btn medium primary" th:text="${detail != null ? '수정' : '등록'}" onclick="fnSaveQna()">저장</button>
        </div>
    </div>
<script>
    function fnSaveQna() {
        if (window._qnaSaving) { return; }
        var title = ($('#title').val() || '').trim();
        if (title === '') {
            alert('제목을 입력하세요.');
            $('#title').focus();
            return;
        }
        var boardId = $('#boardId').val();
        var isUpdate = boardId !== '';
        $.ajax({
            type: 'post',
            url: isUpdate ? '/qna/updateQna.json' : '/qna/insertQna.json',
            data: { boardId: boardId, title: title, content: $('#content').val(), register: $('#register').val(), 'egovframework.double.submit.preventer.parameter.name': $('#doubleSubmitToken').val() },
            beforeSend: function() { window._qnaSaving = true; $('#saveBtn').prop('disabled', true); },
            complete: function() { window._qnaSaving = false; $('#saveBtn').prop('disabled', false); },
            success: function(res) {
                if (res.success) { location.href = '/qna/qnaList'; }
                else { alert(res.message || '저장에 실패했습니다.'); }
            },
            error: function() { alert('저장 중 오류가 발생했습니다.'); }
        });
    }
</script>
</div>
</body>
</html>
