<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>Q&A관리</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">Q&A관리</h2>

    <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;">
        <a th:href="@{/qna/qnaWrite}" class="krds-btn medium primary">등록</a>
    </div>

    <form id="listForm" method="post" th:action="@{/qna/qnaList}">
        <input type="hidden" id="pageIndex" name="pageIndex" th:value="${pageIndex}">
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <input type="text" name="searchKeyword" class="krds-input" style="flex: 1;" placeholder="제목 검색" th:value="${searchKeyword}">
            <button type="submit" class="krds-btn medium secondary" onclick="document.getElementById('pageIndex').value=1;">검색</button>
        </div>
    </form>

    <!-- BLMS qnaList(번호/제목/작성자/등록일/공개여부/조회수)에서 1단계에 맞게 상태 컬럼만 남겼다. -->
    <div class="krds-table-wrap">
        <table class="tbl col data">
            <caption>Q&A 목록</caption>
            <colgroup>
                <col style="width: 8%;">
                <col>
                <col style="width: 12%;">
                <col style="width: 12%;">
                <col style="width: 10%;">
            </colgroup>
            <thead>
            <tr>
                <th scope="col">번호</th>
                <th scope="col">제목</th>
                <th scope="col">작성자</th>
                <th scope="col">등록일</th>
                <th scope="col">상태</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item, stat : ${resultList}">
                <td th:text="${paginationInfo.totalRecordCount + 1 - ((pageIndex - 1) * paginationInfo.recordCountPerPage + stat.count)}"></td>
                <td><a th:href="@{/qna/qnaDetail}" data-post th:attr="data-name='boardId',data-value=${item['boardId']}" th:text="${item['title']}"></a></td>
                <td th:text="${item['register']}"></td>
                <td th:text="${item['registDt'] != null ? #dates.format(item['registDt'], 'yyyy-MM-dd') : ''}"></td>
                <td th:text="${item['answerStatus']}"></td>
            </tr>
            <tr th:if="${resultList == null or resultList.isEmpty()}">
                <td colspan="5">조회된 Q&A가 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div id="paging" class="krds-pagination w-page" th:utext="${#egovKrdsPaginationRenderer.renderPagination(paginationInfo, 'qnaPaging')}"></div>
<script>
    function qnaPaging(pageIndex) {
        document.getElementById('pageIndex').value = pageIndex;
        document.getElementById('listForm').submit();
    }
</script>
</div>
</body>
</html>
