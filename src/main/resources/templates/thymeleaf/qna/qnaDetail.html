<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8">
    <title>Q&A 상세보기</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="heading-large">Q&A 상세보기</h2>
    <div class="conts-wrap" th:if="${detail != null}">
        <div class="fieldset input-form">
            <div class="form-group">
                <div class="form-tit">질문</div>
                <div class="form-conts"><p th:text="${detail['title']}"></p></div>
            </div>
            <div class="form-group">
                <div class="form-tit">작성자</div>
                <div class="form-conts"><p th:text="${detail['register']}"></p></div>
            </div>
            <div class="form-group">
                <div class="form-tit">내용</div>
                <div class="form-conts"><p th:text="${detail['content']}" style="white-space: pre-wrap;"></p></div>
            </div>
        </div>
        <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px;">
            <a th:href="@{/qna/qnaWrite}" data-post th:attr="data-name='boardId',data-value=${detail['boardId']}" class="krds-btn small secondary">수정</a>
            <button type="button" class="krds-btn small danger" onclick="fnDeleteQna()">삭제</button>
        </div>

        <h3 class="heading-small" style="margin-top: 16px;">답변<div th:replace="~{cmm/doubleSubmit :: badge}"></div></h3>
        <div th:if="${answer != null}">
            <p th:text="${answer['answerContent']}" style="white-space: pre-wrap; border: 1px solid #ddd; border-radius: 8px; padding: 8px 12px;"></p>
        </div>
        <p th:if="${answer == null}">등록된 답변이 없습니다.</p>
        <!-- 1단계 제약: 답변 권한 미분리. 2단계 권한관리에서 관리자만 보이게 분리 예정. -->
        <input type="hidden" id="answerToken" name="egovframework.double.submit.preventer.parameter.name" th:value="${answerToken}">
        <div class="form-group" style="margin-top: 8px;">
            <div class="form-conts"><textarea id="answerContent" class="krds-input" rows="6" style="width: 100%;" th:text="${answer != null ? answer['answerContent'] : ''}"></textarea></div>
        </div>
        <div style="display: flex; justify-content: flex-end; margin-top: 8px;">
            <button type="button" id="answerBtn" class="krds-btn medium primary" onclick="fnSaveAnswer()">답변저장</button>
        </div>
    </div>
    <div style="margin-top: 12px;">
        <a th:href="@{/qna/qnaList}" class="krds-btn medium secondary">목록</a>
    </div>
<script th:inline="javascript">
    var qnaBoardId = /*[[${detail != null ? detail['boardId'] : ''}]]*/ '';
    function fnDeleteQna() {
        if (!confirm('질문과 답변이 함께 삭제됩니다. 삭제하시겠습니까?')) { return; }
        $.ajax({
            type: 'post',
            url: '/qna/deleteQna.json',
            data: { boardId: qnaBoardId },
            success: function(res) {
                if (res.success) { location.href = '/qna/qnaList'; }
                else { alert(res.message || '삭제에 실패했습니다.'); }
            },
            error: function() { alert('삭제 중 오류가 발생했습니다.'); }
        });
    }
    function fnSaveAnswer() {
        if (window._ansSaving) { return; }
        var content = ($('#answerContent').val() || '').trim();
        if (content === '') {
            alert('답변을 입력하세요.');
            $('#answerContent').focus();
            return;
        }
        $.ajax({
            type: 'post',
            url: '/qna/saveAnswer.json',
            data: { boardId: qnaBoardId, answerContent: $('#answerContent').val(), 'egovframework.double.submit.preventer.parameter.name': $('#answerToken').val() },
            beforeSend: function() { window._ansSaving = true; $('#answerBtn').prop('disabled', true); },
            complete: function() { window._ansSaving = false; $('#answerBtn').prop('disabled', false); },
            success: function(res) {
                if (res.success) { location.reload(); }
                else { alert(res.message || '저장에 실패했습니다.'); }
            },
            error: function() { alert('저장 중 오류가 발생했습니다.'); }
        });
    }
</script>
</div>
</body>
</html>
