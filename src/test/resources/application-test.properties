# 테스트 전용. main application.properties에 덮어쓴다.
# 테스트는 격리 PostgreSQL을 쓴다. 실제 접속 URL(임의 포트)은 PostgresTestDatabaseInitializer가
# 컨텍스트 시작 전에 target/test-postgres 아래 로컬 PG17.12 인스턴스로 덮어쓴다.
# 아래 URL은 그 초기화가 실행되지 않았을 때의 로컬 자리표시자다. 운영 DB가 아니며,
# 초기화 없이 실행하면 아무도 듣지 않는 포트라 즉시 실패한다(운영 접속으로 흘러가지 않는다).
Globals.DbType=postgresql
Globals.postgresql.DriverClassName=org.postgresql.Driver
Globals.postgresql.Url=jdbc:postgresql://127.0.0.1:55432/arkive_test
Globals.postgresql.UserName=postgres
Globals.postgresql.Password=postgres
# PG 서버 기본 시간대는 UTC이고, 세션 시간대만 접속 후 SET TIME ZONE 'Asia/Seoul'로 맞춘다.
Globals.postgresql.TimeZone=Asia/Seoul
# 후속 Boot 자동 구성도 같은 로컬 DB를 보도록 고정한다. 운영 값이 테스트로 새지 않게 한다.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://127.0.0.1:55432/arkive_test
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Seoul'
# 스키마·시드는 PostgresTestDatabaseInitializer가 한 번만 적용한다. Boot 자동 실행은 끈다.
spring.sql.init.mode=never
# 테스트에서는 실제 SMTP에 연결하지 않는다. 필요하면 테스트 클래스에서 켠다.
arkive.mail.enabled=false
# SMTP 미설정으로 메일 헬스가 DOWN이 되어 테스트의 health 응답이 흔들리지 않게 한다.
management.health.mail.enabled=false
# 테스트 전용 고정 키. 운영 키가 아니며 저장소에 커밋해도 되는 값이다.
arkive.crypto.field-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
# 테스트 전용 내부 API 토큰. 운영 값이 아니며 저장소에 커밋해도 되는 값이다.
arkive.api.internal-token=test-internal-token
arkive.totp.issuer=Arkive-Test
# 업로드 파일이 저장소 밖으로 나가지 않도록 테스트용 VOD 경로를 target 아래로 둔다.
arkive.vod.path=./target/test-vod/
