# 테스트 전용. main application.properties에 덮어쓴다.
# 파일 서버 DB 경로와 포트를 격리한다. 앱(9001)이 떠 있어도 테스트(9002)는 실행된다.
Globals.hsql_server.DatabasePath=./target/test-db/ArkiveDB
Globals.hsql_server.Port=9002
Globals.hsql_server.Url=jdbc:log4jdbc:hsqldb:hsql://127.0.0.1:9002/ArkiveDB
# 테스트에서는 실제 SMTP에 연결하지 않는다. 필요하면 테스트 클래스에서 켠다.
arkive.mail.enabled=false
# SMTP 미설정으로 메일 헬스가 DOWN이 되어 테스트의 health 응답이 흔들리지 않게 한다.
management.health.mail.enabled=false
# 테스트 전용 고정 키. 운영 키가 아니며 저장소에 커밋해도 되는 값이다.
arkive.crypto.field-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
# 테스트 전용 내부 API 토큰. 운영 값이 아니며 저장소에 커밋해도 되는 값이다.
arkive.api.internal-token=test-internal-token
arkive.totp.issuer=Arkive-Test
# 업로드 파일이 저장소 밖으로 나가지 않도록 테스트용 VOD 경로를 target 아래로 둔다.
arkive.vod.path=./target/test-vod/
